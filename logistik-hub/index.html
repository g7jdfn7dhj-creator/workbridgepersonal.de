<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logistik-Hub</title>
<meta name="app-version" content="lhub-pwa-v4">
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#161d26">
<meta name="description" content="Logistik-Hub — управление логистикой и производством предприятия: факт, симуляция «что-если», KPI. Без встроенных данных.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logistik-Hub">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<style>
:root{--bg:#161d26;--panel:#1e2732;--panel2:#18212b;--line:#33414f;--line2:#26313c;--fg:#e8edf2;--mut:#8d9bab;
  --amber:#f2b705;--on-amber:#1d1600;--in:#6b9cf0;--out:#3fbfae;--warn:#ef6b4a;--ok:#5fd38a;--sim:#c98bf0;
  --vest:#ff7a1a;--log:#b5d334;--mech:#3d6fc4;--elec:#9b7cf0;
  --f-disp:"Saira Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px var(--f-disp);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pad{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{padding-block:7px;display:flex;align-items:center;gap:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0;white-space:nowrap}
h1 small{font-weight:400;color:var(--mut);letter-spacing:.06em;font-size:13px;margin-left:8px}
.hright{display:flex;align-items:center;gap:12px;margin-left:auto}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock b{color:var(--amber);font-weight:500}
.banner{padding-block:5px;font-size:13px;letter-spacing:.03em;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner .tag{font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:2px}
body[data-dm="fact"] .banner{background:#17242c}body[data-dm="fact"] .banner .tag{background:var(--out);color:#06221e}
body[data-dm="sim"] .banner{background:repeating-linear-gradient(135deg,#2a2233 0 12px,#251f2d 12px 24px)}body[data-dm="sim"] .banner .tag{background:var(--sim);color:#1f0f2a}
.banner .mut{color:var(--mut)}
.hud{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--panel);padding:6px 10px 7px;min-width:0}
.stat span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.stat.hot{box-shadow:inset 0 -2px 0 var(--warn)}.stat.hot b{color:var(--warn)}
.meter{height:3px;background:var(--line);margin-top:5px}.meter i{display:block;height:100%;width:0;background:var(--amber);transition:width .4s}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-height:0;min-width:0;touch-action:none;cursor:grab;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.legend{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);pointer-events:none;text-shadow:0 1px 2px #0008}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px}
#warn{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;max-width:60%}
#warn div{background:rgba(30,39,50,.92);border-left:3px solid var(--warn);color:var(--fg);font-size:12px;letter-spacing:.04em;padding:3px 8px}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(30,39,50,.94);border:1px solid var(--line);border-top:3px solid var(--out);padding:14px 18px;max-width:360px;font-size:14px;line-height:1.4}
.keys{position:absolute;bottom:8px;left:12px;font-family:var(--f-mono);font-size:11px;color:var(--mut);pointer-events:none}
#panel{width:560px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
.ptop{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.ptop .sp{flex:1}
.tabsrow{display:flex;border-bottom:1px solid var(--line)}
.tabs{flex:1;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;min-height:34px;color:var(--mut);font-size:13px;padding:2px 4px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--amber);background:var(--panel2)}
#sheetBtn{display:none}
.tabc{flex:1;overflow:auto;padding:10px 12px 16px;min-height:0;overscroll-behavior:contain}
.sec{margin-bottom:14px}
h3,details>summary{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 7px}
details{border-top:1px solid var(--line);padding-top:7px;margin-bottom:10px}
details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details>summary::after{content:"▾"}details:not([open])>summary::after{content:"▸"}details>summary::-webkit-details-marker{display:none}
button{font:inherit;font-size:13px;letter-spacing:.05em;text-transform:uppercase;background:transparent;color:var(--fg);border:1px solid var(--line);padding:4px 10px;min-height:32px;border-radius:2px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--mut)}
button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.pri{border-color:var(--amber);color:var(--amber)}button.danger{border-color:#ef6b4a;color:#ef6b4a}
.seg{display:flex}.seg button{border-radius:0}.seg button+button{border-left:0}
.seg.sm button{min-height:28px;padding:2px 8px;font-size:12px}
#modeSeg button[data-m="fact"][aria-pressed="true"]{background:var(--out);border-color:var(--out);color:#06221e}
#modeSeg button[data-m="sim"][aria-pressed="true"]{background:var(--sim);border-color:var(--sim);color:#1f0f2a}
.simonly{}body[data-dm="fact"] .simonly{display:none!important}body[data-dm="sim"] .factonly{display:none!important}
.note{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kpi{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--ok);padding:6px 8px;min-width:0}
.kpi.bad{border-left-color:var(--warn)}.kpi.na{border-left-color:var(--line)}
.kpi span{display:block;font-size:12px;color:var(--mut);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-family:var(--f-mono);font-weight:500;font-size:17px}.kpi.bad b{color:var(--warn)}
.kpi small{font-family:var(--f-mono);font-size:11px;color:var(--mut);margin-left:4px}
.kpi em{float:right;font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--mut);margin-top:6px}
.alerts div{border-left:3px solid var(--warn);background:var(--panel2);padding:4px 8px;margin-bottom:4px;font-size:13px}
.chart{margin-bottom:8px}.chart .cl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.chart .cl b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.chart canvas{width:100%;height:64px;display:block;background:var(--panel2);border:1px solid var(--line)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--f-mono)}
th{font-family:var(--f-disp);font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:-10px;background:var(--panel)}
td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line2);white-space:nowrap}
th.l,td.l{text-align:left}
td.bad{color:var(--warn)}td.good{color:var(--ok)}td.mut{color:var(--mut)}
tr.cur td{color:var(--amber)}
tr.click{cursor:pointer}tr.click:hover td{background:#223040}
.pbar{display:inline-block;width:70px;height:6px;background:var(--line);vertical-align:middle}.pbar i{display:block;height:100%}
.src{display:inline-block;font-family:var(--f-disp);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:0 4px;border:1px solid;border-radius:2px;white-space:nowrap}
.src.a{color:#9fc1e3;border-color:#4d6f93}.src.i{color:#f2c46b;border-color:#8a6a2a}.src.f{color:#cfe39a;border-color:#6a7d3a}.src.s{color:#d9b8f2;border-color:#6d4d86}
.gantt canvas{width:100%;display:block;background:var(--panel2);border:1px solid var(--line)}
.tw{overflow:auto;max-height:360px}
.cell{display:flex;align-items:center;gap:6px}.cell .nm{flex:1;min-width:0;font-size:14px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .nm i{display:inline-block;width:8px;height:8px;margin-right:6px}.cell b{font-family:var(--f-mono);font-weight:500;min-width:2.5ch;text-align:center}
.cell .ut{font-family:var(--f-mono);font-size:11px;color:var(--mut);width:4.5ch;text-align:right}
.staffc{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
input[type=number],input[type=url],input[type=text],input[type=time],input[type=datetime-local],input[type=search],select{font:13px var(--f-mono);background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:4px 6px;border-radius:2px}
input[type=number]{width:76px;text-align:right}
input[type=url]{width:100%;margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:1fr auto 5.5em;gap:4px 8px;align-items:center;font-size:13px}
.pgrid span.u{font-family:var(--f-mono);font-size:11px;color:var(--mut)}
.rowb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
label.ck{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}.kv span{color:var(--mut)}.kv b{font-family:var(--f-mono);font-weight:500;text-align:right}
.err{color:var(--warn)}.okc{color:var(--ok)}
.help{font-size:12.5px;line-height:1.4;color:#cdd6df}.help code{font-family:var(--f-mono);font-size:11.5px;color:var(--amber)}.help table{margin:4px 0 10px}.help td{white-space:normal}
#report{background:#fff;color:#111;padding:14px 16px;font:12px/1.35 var(--f-disp);border:1px solid var(--line)}
#report h2{font-size:18px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.04em}#report h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 4px;color:#333;border-bottom:1px solid #999}
#report table{font-size:11px}#report th{color:#333;background:#fff;position:static;border-bottom:1px solid #666}#report td{border-bottom:1px solid #ddd;white-space:normal}
#report .bad{color:#b4321a;font-weight:600}#report .modetag{display:inline-block;padding:1px 6px;border:1px solid #111;font-weight:600;letter-spacing:.06em}
#report .meta{color:#444}
/* campus */
.campusui{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.campusui>*{pointer-events:auto}
.hint{background:rgba(22,29,38,.85);border-left:3px solid var(--amber);padding:8px 12px;max-width:440px;font-size:15px}
.hint small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.blist{display:flex;flex-wrap:wrap;gap:6px}.blist button{background:rgba(22,29,38,.85)}.blist button.hubb{border-color:#f0a070;color:#ffc79e}
#bLabel{position:absolute;pointer-events:none;transform:translate(-50%,-100%);background:rgba(22,29,38,.92);border:1px solid var(--amber);padding:4px 10px;font-size:14px;white-space:nowrap}
#bLabel small{display:block;color:var(--amber);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,19,.5)}
#card>div{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--amber);padding:18px 20px;max-width:340px;width:calc(100% - 32px)}
#card h2{margin:0 0 4px;font-size:21px;font-weight:600;text-transform:uppercase}#card .soon{color:var(--amber);font-family:var(--f-mono);font-size:13px;margin-bottom:10px}#card p{color:var(--mut);margin:0 0 14px}
#fade{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .25s}#fade.on{opacity:1}
body[data-scene="campus"] .hubonly{display:none!important}body[data-scene="hub"] .campusonly{display:none!important}body[data-scene="campus"] #stage{cursor:default}
@media (max-width:1250px){#panel{width:470px}.hud{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  #main{flex-direction:column}#panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:48vh;flex:none}
  #panel.collapsed .tabc{display:none}#sheetBtn{display:block;flex:none;width:42px;border:0;border-left:1px solid var(--line);border-radius:0}
  .keys{display:none}.charts{grid-template-columns:1fr}.legend{font-size:10px}#warn{max-width:55%}
}
.sh{display:none}
@media (max-width:900px){#legend,#warn{display:none!important}.banner{white-space:nowrap;overflow:hidden;font-size:12px}.banner span:not(.tag){overflow:hidden;text-overflow:ellipsis}
  .hud{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:4px 8px}.stat span{font-size:10px}.stat b{font-size:13px}.meter{margin-top:3px}#panel{max-height:44vh}}
@media (max-width:520px){.lg{display:none}.sh{display:inline}header{gap:6px 10px}.clock{font-size:12px}.hright{gap:8px}h1 small{display:none}h1{font-size:17px}.hud .stat b{font-size:14px}.kpis{grid-template-columns:1fr 1fr}.staffc{grid-template-columns:1fr}.kpi b{font-size:15px}}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  header,.banner,.hud,#stage,.ptop,.tabsrow,.noprint{display:none!important}
  #main{display:block}#panel{display:block!important;width:auto;border:0;background:#fff;max-height:none}
  .tabc{display:none!important}#tab-report{display:block!important;overflow:visible;padding:0}
  #report{border:0;padding:0}
}
.inv{border-color:var(--red,#ef6b4a)!important;outline:1px solid var(--red,#ef6b4a)}
.req{color:var(--amber);font-style:normal}
.miss{margin:6px 0 8px 18px;padding:0;font-size:12px;line-height:1.45}.empty ul{margin:6px 0 0 18px;padding:0;font-size:12px;text-align:left}
#simGate{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--panel2);padding:8px 10px;margin-bottom:12px;font-size:13px}
.eform{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:12px;margin-bottom:8px}.eform input,.eform select{width:100%;box-sizing:border-box;min-width:0}
input[type=search]{width:100%;box-sizing:border-box;margin-bottom:6px}
.part{padding:6px 8px;border:1px solid var(--line);background:var(--panel2);margin-bottom:4px;font-size:13px}.part .loc{color:var(--amber);font-family:var(--f-mono)}
button.x{min-height:22px;padding:0 6px;font-size:11px}button:disabled{opacity:.45;cursor:not-allowed}
.pgrid input[type=time]{width:96px}
#installBtn{min-height:28px;padding:2px 10px;font-size:12px;white-space:nowrap}
#pwaBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;gap:10px;align-items:center;max-width:min(560px,94vw);
  background:rgba(30,39,50,.97);border:1px solid var(--line);border-left:3px solid var(--amber);padding:10px 12px;font-size:13px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#pwaBar[hidden]{display:none}#pwaBar .t{flex:1}#pwaBar button{white-space:nowrap}
@media print{#pwaBar,#installBtn{display:none!important}}

/* ===================== UX v2 (responsive shell) ===================== */
.xbtn{border:0;background:transparent;color:var(--mut);min-height:28px;min-width:28px;padding:0 6px;font-size:18px;line-height:1;text-transform:none;letter-spacing:0;flex:none}
.xbtn:hover{color:var(--fg)}
.banner{flex-wrap:nowrap;padding-block:2px}
#banner{flex:1;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:3px}
#addBtn{background:var(--amber);color:var(--on-amber);border-color:var(--amber);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
#addBtn .ic{font-size:18px;line-height:1;font-weight:600}
#menuBtn{font-size:18px;padding:2px 10px;text-transform:none;letter-spacing:0}
.menu{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 50px);right:max(10px,env(safe-area-inset-right,0px));width:min(330px,calc(100vw - 20px));max-height:calc(100vh - 70px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--amber);box-shadow:0 10px 30px rgba(0,0,0,.55);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.menu .mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu label.ck{font-size:14px;color:var(--fg);min-height:36px}
.menu .clockM{font-family:var(--f-mono);font-size:13px;color:var(--mut)}
.menu .mb{width:100%;text-align:left}
#warn{top:58px}
#warn div{pointer-events:auto;display:flex;align-items:center;gap:4px}
#warn .xbtn{min-height:22px;min-width:22px;font-size:15px;padding:0 2px}
.empty{pointer-events:auto;z-index:4}
.empty .ehead{display:flex;gap:10px;align-items:flex-start}.empty .ehead>span{flex:1}
.empty .ehead .xbtn{margin:-6px -10px 0 0}
.empty .rowb{margin-top:10px}
.hint{display:flex;gap:6px;align-items:flex-start}.hint>div{flex:1}.hint .xbtn{margin:-4px -8px 0 0}
#stageTools{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;z-index:6}
#stageTools button{background:rgba(22,29,38,.88);min-width:40px;font-size:16px;text-transform:none;letter-spacing:.02em}
#panelShow{display:none}
body.pcol[data-scene="hub"] #panelShow{display:inline-block}
body.fs #stage{position:fixed;inset:0;z-index:55;height:auto!important;flex:none;background:var(--bg)}
body.fs #stageTools{top:max(10px,env(safe-area-inset-top,0px))}
body.nohints #bannerRow,body.nohints #emptyMsg,body.nohints #warn,body.nohints #campusHint,body.nohints .keys{display:none!important}
#hudWrap{position:relative;border-bottom:1px solid var(--line);background:var(--line)}
#hudWrap .hud{border-bottom:0;margin-right:38px}
#hudBtn{position:absolute;right:0;top:0;bottom:0;width:38px;min-height:0;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--panel);padding:0;font-size:14px;color:var(--mut);text-transform:none}
#hudWrap.c .hud{display:none}
#hudWrap.c #hudBtn{position:static;display:block;width:100%;height:34px;min-height:34px;border-left:0;text-align:left;padding:0 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#split{flex:none;width:7px;cursor:col-resize;background:var(--panel2);border-left:1px solid var(--line);touch-action:none;position:relative}
#split::after{content:"";position:absolute;left:2px;top:50%;width:1px;height:36px;margin-top:-18px;background:var(--mut);box-shadow:2px 0 0 var(--mut)}
#split:hover,#split.drag,#split:focus-visible{background:#3a3220}
#panel{border-left:0}
body.pcol #panel,body.pcol #split{display:none!important}
@media (min-width:901px){#panel{width:var(--pw,560px)}}

        const m=Math.min(d,rem);g.position.x+=dx/d*m;g.position.z+=dz/d*m;rem-=m;moved+=m;if(m===d)st.pts.shift()}
      if(!st.pts.length)w.steps.shift();
    }else if(st.t==='face'){g.rotation.y=angLerp(g.rotation.y,st.a,Math.min(1,dt*8));if(angDiff(g.rotation.y,st.a)<0.05){g.rotation.y=st.a;w.steps.shift()}
    }else if(st.t==='wait'){st.d-=dt;if(st.d<=0)w.steps.shift()
    }else if(st.t==='fn'){w.steps.shift();st.f()
    }else if(st.t==='work'){w.working=true;w.place={k:'hall',h:w.hall}}
  }
  let s;if(moved>0){w.phase+=moved*3.2;s=Math.sin(w.phase)*0.6}else{s=w.legL.rotation.x*0.8}
  w.legL.rotation.x=s;w.legR.rotation.x=-s;
  if(w.load){w.armL.rotation.x=w.armR.rotation.x=-0.9}
  else if(w.working&&w.busy){w.phase+=dt*9;w.armR.rotation.x=-1.1+Math.sin(w.phase)*0.5;w.armL.rotation.x=-0.7+Math.sin(w.phase+1.7)*0.3}
  else{w.armL.rotation.x=-s*0.8;w.armR.rotation.x=s*0.8}
}

const sideX=(h,x)=>x<=h.cx-1?h.cx-7.5:h.cx+4.3;
function exitPts(place,pos){
  if(place.k==='hall'){const h=place.h,pts=[];if(pos.z<h.cz+1.5){const sx=sideX(h,pos.x);pts.push({x:sx,z:pos.z},{x:sx,z:h.cz+6})}
    pts.push({x:h.cx,z:h.cz+12.5},{x:h.cx,z:RZ[h.r]});return pts}
  return[{x:-38.6,z:pos.z},{x:-38.6,z:RZ[0]}]}
function roadIn(place){return place.k==='hall'?{x:place.h.cx,z:RZ[place.h.r]}:{x:-38.6,z:RZ[0]}}
function enterPts(place,t){
  if(place.k==='hall'){const h=place.h,pts=[{x:h.cx,z:h.cz+12.5}];if(t.z<h.cz+1.5){const sx=sideX(h,t.x);pts.push({x:sx,z:h.cz+6},{x:sx,z:t.z})}pts.push(t);return pts}
  return[{x:-38.6,z:t.z},t]}
function sameHall(a,b){return a.k===b.k&&(a.k!=='hall'||a.h===b.h)}
function routeW(w,to,t){const p=w.g.position,from=w.place;
  if(from&&sameHall(from,to)){
    if(to.k==='hall'){const h=to.h,pts=[];const sa=p.z<h.cz+1.5,sb=t.z<h.cz+1.5;
      if(sa||sb){if(sa)pts.push({x:sideX(h,p.x),z:p.z},{x:sideX(h,p.x),z:h.cz+6});if(sb){pts.push({x:sideX(h,t.x),z:h.cz+6},{x:sideX(h,t.x),z:t.z})}}
      pts.push(t);return pts}
    return[{x:-38.6,z:p.z},{x:-38.6,z:t.z},t]}
  const ex=exitPts(from,p),a=ex[ex.length-1],b=roadIn(to);
  const pts=[...ex];
  if(Math.abs(a.z-b.z)<0.1)pts.push(b);
  else{let ax=ALLEYS[0],best=1e9;for(const x of ALLEYS){const c=Math.abs(a.x-x)+Math.abs(x-b.x);if(c<best){best=c;ax=x}}pts.push({x:ax,z:a.z},{x:ax,z:b.z},b)}
  return pts.concat(enterPts(to,t))}

const MSPOTS=[[-5.3,0,Math.PI/2],[5.3,0,-Math.PI/2],[0,-4.2,0]],ESPOTS=[[3.2,5.0,Math.PI],[-2.5,4.6,Math.PI]];
function spotWorld(h,crew,i){const s=(crew==='mech'?MSPOTS:ESPOTS)[i];return{x:h.cx-1+s[0],z:h.cz-3+s[1],a:s[2]}}

function assignWorkers(){
  for(let i=workers.length-1;i>=0;i--){const w=workers[i];if(w.retire&&!w.job){simG.remove(w.g);workers.splice(i,1)}}
  for(const w of workers){
    if((w.crew==='mech'||w.crew==='elec')&&w.job&&w.steps[0]&&w.steps[0].t==='work'){
      const need=w.crew==='mech'?'mech':'elec';if(w.hall.phase!==need){w.job=null;w.steps=[];w.spot=-1}}
    if(w.job||w.retire)continue;
    if(w.crew==='in'){
      const k=inTrucks.findIndex(t=>t&&t.state==='dock'&&t.n>0);const s=inBuf.find(s=>!s.pallet&&!s.reserved);
      if(k>=0&&s){const tr=inTrucks[k];tr.n--;tr.pend++;s.reserved=true;w.job=true;const dx=DOCKS_IN[k];
        w.steps=[{t:'go',pts:[{x:dx+(Math.random()-0.5),z:25.6}]},{t:'face',a:0},{t:'wait',d:P.unloadMinPal*2},
          {t:'fn',f:()=>{const p=makePallet(0,0,0);w.g.add(p);p.position.set(0,0.05,1.05);w.load=p;w.jack.visible=true;tr.pend--;stats.recv++;p.userData.rec=tr.rec;ev('recv')}},
          {t:'go',pts:[{x:s.x,z:11.6}]},{t:'face',a:Math.PI},{t:'wait',d:0.4},
          {t:'fn',f:()=>{const p=w.load;w.load=null;w.jack.visible=false;simG.attach(p);settle(p,new THREE.Vector3(s.x,0,s.z));s.pallet=p;s.reserved=false;w.job=null}}];
        continue}
    }else if(w.crew==='out'){
      const k=outTrucks.findIndex(o=>o&&o.state==='dock'&&o.n+o.res<o.cap);const s=outBuf.find(s=>s.pallet&&!s.reserved&&!settling.has(s.pallet));
      if(k>=0&&s){const o=outTrucks[k];o.res++;s.reserved=true;w.job=true;const dx=DOCKS_OUT[k];
        w.steps=[{t:'go',pts:[{x:s.x,z:10.6}]},{t:'face',a:Math.PI},{t:'wait',d:0.4},
          {t:'fn',f:()=>{const p=s.pallet;s.pallet=null;s.reserved=false;w.g.attach(p);settle(p,new THREE.Vector3(0,0.05,1.05));w.load=p;w.jack.visible=true}},
          {t:'go',pts:[{x:dx+(Math.random()-0.5),z:25.6}]},{t:'face',a:0},{t:'wait',d:P.loadMinPal*2},
          {t:'fn',f:()=>{const p=w.load;w.load=null;w.jack.visible=false;shipPallet(p,o);killPallet(p);o.res--;o.n++;stats.ship++;w.job=null}}];
        continue}
    }else if(w.crew==='log'){
      if(w.steps.length)continue;
      const ps=prodBuf.find(s=>s.pallet&&!s.reserved&&!settling.has(s.pallet));
      let best=null,bd=-1;
      for(const h of halls){if(h.phase!=='mech')continue;const stock=h.slots.filter(s=>s.pallet).length;const def=NEED-h.used-stock-h.incoming;
        const free=h.slots.find(s=>!s.pallet&&!s.reserved);if(def<=0||!free)continue;const score=def*10-stock*4-h.r*2;if(score>bd){bd=score;best={h,hs:free}}}
      if(ps&&best){const {h,hs}=best;ps.reserved=true;hs.reserved=true;h.incoming++;w.job=true;
        const wt={x:-37.2,z:ps.z},hallT={x:hs.x,z:h.cz+11.25};
        w.steps=[{t:'go',pts:routeW(w,{k:'wh'},wt)},{t:'face',a:Math.PI/2},{t:'wait',d:0.4},
          {t:'fn',f:()=>{const p=ps.pallet;ps.pallet=null;ps.reserved=false;w.g.attach(p);settle(p,new THREE.Vector3(0,0.05,1.05));w.load=p;w.jack.visible=true;w.place={k:'wh'};
            w.steps.splice(0,0,{t:'go',pts:routeW(w,{k:'hall',h},hallT)})}},
          {t:'face',a:Math.PI},{t:'wait',d:0.4},
          {t:'fn',f:()=>{const p=w.load;w.load=null;w.jack.visible=false;simG.attach(p);settle(p,new THREE.Vector3(hs.x,0,hs.z));hs.pallet=p;hs.reserved=false;h.incoming--;w.place={k:'hall',h};w.job=null}}];
        continue}
      if(!w.steps.length&&w.place&&w.place.k==='hall'){w.steps=[{t:'go',pts:routeW(w,{k:'wh'},{x:-39.6,z:-6-Math.random()*14})},{t:'fn',f:()=>{w.place={k:'wh'}}}]}
    }else{
      const need=w.crew==='mech'?'mech':'elec',cap=need==='mech'?3:2;
      let best=null,bs=-1e9;
      for(const h of halls){if(h.phase!==need)continue;const n=workers.filter(o=>o!==w&&o.crew===w.crew&&o.hall===h&&o.job).length;if(n>=cap)continue;
        const parts=need==='mech'?h.slots.filter(s=>s.pallet).length+h.incoming:1;
        const here=w.place&&w.place.k==='hall'&&w.place.h===h?2:0;
        const sc=(parts>0?10:0)-n*4+here-Math.abs((w.place&&w.place.h?w.place.h.r:0)-h.r);if(sc>bs){bs=sc;best=h}}
      if(best){const used=workers.filter(o=>o!==w&&o.crew===w.crew&&o.hall===best&&o.job).map(o=>o.spot);
        let i=0;while(used.includes(i))i++;const sp=spotWorld(best,w.crew,i);
        w.hall=best;w.spot=i;w.job=true;
        w.steps=[{t:'go',pts:routeW(w,{k:'hall',h:best},{x:sp.x,z:sp.z})},{t:'fn',f:()=>{w.place={k:'hall',h:best}}},{t:'face',a:sp.a},{t:'work'}];
        continue}
      if(w.hall&&!w.job)w.hall=null;
    }
    if(w.crew==='in'||w.crew==='out'){const sp=SPOT[w.crew],p=w.g.position;
      if(!w.steps.length&&Math.hypot(p.x-sp.x,p.z-sp.z)>4)w.steps=[{t:'go',pts:[{x:sp.x+(Math.random()-0.5)*6,z:sp.z+(Math.random()-0.5)*3}]}]}
  }
}

let stats;
function upHall(h,dt){
  const crew=workers.filter(w=>w.hall===h&&w.working);
  const nm=crew.filter(w=>w.crew==='mech').length,ne=crew.filter(w=>w.crew==='elec').length;
  if(h.phase==='mech'){
    const slot=h.slots.find(s=>s.pallet&&!settling.has(s.pallet));
    for(const w of crew)w.busy=!!slot;
    if(slot&&nm>0){h.cur+=dt*nm;if(h.cur>=WPP){h.cur-=WPP;killPallet(slot.pallet);slot.pallet=null;h.used++;
      if(h.used>=NEED){h.phase='elec';h.cur=0;h.e=0;}}}
    setLamps(h,1,false);
  }else if(h.phase==='elec'){for(const w of crew)w.busy=true;h.e+=dt*ne;setLamps(h,1,false);if(h.e>=EW){h.phase='test';h.t=TEST_S;}}
  else if(h.phase==='test'){h.t-=dt;setLamps(h,2,Math.floor(h.t*3)%2===0);if(h.t<=0){h.phase='done';h.t=DONE_S;onBuilt(h);}}
  else if(h.phase==='done'){h.t-=dt;setLamps(h,2,false);if(h.t<=0){S.remove(h.mach.g);buildMachine(h);h.phase='mech';h.used=0;h.cur=0;h.e=0;}}
  hallVis(h)}

/* ================= PARAMETERS (R4: no built-in values — everything is entered by the user) ================= */
const ROLE_KEYS=['fl','log','mech','elec','in','out'];
const NUM_KEYS=['inPerH','palMin','palMax','delayMean','delaySd','punctTol','ordPerH','palPerOrder','dueH','outGapMin','outCap',
  'unloadMinPal','loadMinPal','flMinMove','kits','mechMinKit','elecMin','testMin','handMin','planHall','demandDay',
  'th_rackHi','th_rackLo','th_doc','th_dts','th_turn','th_waitMin','th_punct','th_wait','th_backlog','th_overdue','th_onTime','th_fill','th_out','th_util','arbAutoS'];
const INT_KEYS=['palMin','palMax','palPerOrder','outCap','kits'];
// layout limits (scene geometry, not data): work spots per hall, 3D readability caps
const ROLE_MAX={fl:14,log:16,mech:27,elec:18,in:10,out:10};
function emptyParams(){const p={shifts:[null,null,null],staff:{1:{},2:{},3:{}}};for(const k of NUM_KEYS)p[k]=null;
  for(const n of[1,2,3])for(const r of ROLE_KEYS)p.staff[n][r]=null;return p}
const PKEY='lhub.r4.params';
const LS=(()=>{try{const s=window.localStorage;s.getItem('x');return s}catch(e){return null}})();
function parseHM(v){if(v==null||v==='')return null;const m=String(v).trim().match(/^(\d{1,2})(?::(\d{2}))?$/);if(!m)return null;
  const h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return null;return h*60+mi}
const fmtHM=m=>m==null?'':String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function mergeParams(src){const p=emptyParams();if(!src||typeof src!=='object')return p;
  for(const k of NUM_KEYS){const raw=src[k];if(raw===null||raw===undefined||raw==='')continue;const v=+raw;if(isFinite(v))p[k]=INT_KEYS.includes(k)?Math.round(v):v}
  if(Array.isArray(src.shifts))for(let i=0;i<3;i++){const m=parseHM(src.shifts[i]);p.shifts[i]=m==null?null:fmtHM(m)}
  if(src.staff)for(const n of[1,2,3])for(const r of ROLE_KEYS){const raw=src.staff[n]&&src.staff[n][r];if(raw===null||raw===undefined||raw==='')continue;
    const v=+raw;if(isFinite(v)&&v>=0)p.staff[n][r]=Math.min(ROLE_MAX[r],Math.round(v))}
  return p}
let P=mergeParams((()=>{try{return JSON.parse(LHStore.get(PKEY)||'null')}catch(e){return null}})());

function applyParams(){const f=v=>v==null?null:v*2;NEED=P.kits;WPP=f(P.mechMinKit);EW=f(P.elecMin);TEST_S=f(P.testMin);DONE_S=f(P.handMin)}

/* ================= TIME / SHIFTS (user-entered start times) ================= */
const DAY0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()})();
function shiftDefs(){const r=[];(P.shifts||[]).forEach((s,i)=>{const m=parseHM(s);if(m!==null)r.push({n:i+1,m})});
  r.sort((a,b)=>a.m-b.m);return r.filter((x,i)=>i===0||x.m!==r[i-1].m)}
const shiftsSet=()=>shiftDefs().length>0;
function shiftAt(ms){const D=shiftDefs();if(!D.length)return null;const d0=Math.floor((ms-DAY0)/864e5);const occ=[];
  for(let d=d0-1;d<=d0+1;d++)for(const s of D){const x=new Date(DAY0);x.setDate(x.getDate()+d);x.setHours(0,s.m,0,0);occ.push({n:s.n,t:x.getTime()})}
  occ.sort((a,b)=>a.t-b.t);let i=-1;for(let j=0;j<occ.length;j++)if(occ[j].t<=ms)i=j;
  if(i<0||i+1>=occ.length)return null;return{k:occ[i].t,n:occ[i].n,a:occ[i].t,b:occ[i+1].t}}
function shiftsBetween(a,b){const out=[];let s=shiftAt(b-1),g=0;while(s&&s.b>a&&g++<400){out.push(s);s=shiftAt(s.a-1)}return out.reverse()}
let clock=0;                                       // sim plant time, s since DAY0 (set on model start)

/* ================= SIM REQUIREMENTS ================= */
const SIM_REQ=['inPerH','palMin','palMax','delayMean','delaySd','ordPerH','palPerOrder','dueH','outGapMin','outCap','unloadMinPal','loadMinPal','flMinMove','kits','mechMinKit','elecMin','testMin','handMin'];
const POS_REQ=['inPerH','palMin','palMax','ordPerH','palPerOrder','outGapMin','outCap','kits','mechMinKit','elecMin'];
function simMissing(){const miss=[];
  if(!shiftsSet())miss.push({k:'shifts'});
  for(const k of SIM_REQ){if(!has(P[k]))miss.push({k});else if(POS_REQ.includes(k)&&P[k]<=0)miss.push({k,bad:'>0'});else if(P[k]<0&&k!=='delayMean')miss.push({k,bad:'≥0'})}
  if(has(P.palMin)&&has(P.palMax)&&P.palMax<P.palMin)miss.push({k:'palMax',bad:'≥ min'});
  for(const s of shiftDefs())for(const r of ROLE_KEYS)if(!has(P.staff[s.n][r]))miss.push({k:'staff',n:s.n,r});
  return miss}

const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function pick(a){return a[Math.random()*a.length|0]}

function planAhead(){const H=clock+3*3600;
  while(planNext<=H){const pl=planNext;const arr=Math.max(clock,pl+(P.delayMean+gauss()*P.delaySd)*60);
    const rec={id:'WE-'+String(++truckNo.in).padStart(4,'0'),dir:'in',plate:'',planned:DAY0+pl*1000,arrS:arr,arrival:null,docked:null,departed:null,stocked:null,
      pallets:P.palMin+(Math.random()*(P.palMax-P.palMin+1)|0),stockedN:0,dock:null,src:'sim'};
    inPlan.push(rec);simTrucks.push(rec);planNext+=expRand(3600/P.inPerH)}}
function replanInbound(){if(!simOn)return;for(let j=inPlan.length-1;j>=0;j--){const r=inPlan[j];if(r.planned>simNow()){inPlan.splice(j,1);const k=simTrucks.indexOf(r);if(k>=0)simTrucks.splice(k,1)}}
  planNext=clock+expRand(3600/P.inPerH)}
function spawnIn(i,rec){const g=makeTruck(M.inCab,DOCKS_IN[i]);inTrucks[i]={g,n:rec.pallets,pend:0,state:'arr',rec}}
function spawnOut(i){const g=makeTruck(M.outCab,DOCKS_OUT[i]);
  const rec={id:'WA-'+String(++truckNo.out).padStart(4,'0'),dir:'out',plate:'',planned:null,arrival:simNow(),docked:null,departed:null,pallets:0,dock:i+1,src:'sim'};
  simTrucks.push(rec);outTrucks[i]={g,n:0,res:0,cap:P.outCap,state:'arr',rec}}
function upTrucks(dt){

  for(let i=0;i<3;i++){if(!inTrucks[i]&&inQueue.length>0){const rec=inQueue.shift();rec.dock=i+1;spawnIn(i,rec)}
    const tr=inTrucks[i];if(tr){const g=tr.g;
      if(tr.state==='arr'){g.position.z=Math.max(DOCK_Z,g.position.z-16*dt);if(g.position.z===DOCK_Z){tr.state='dock';tr.rec.docked=simNow()}}
      else if(tr.state==='dock'){if(tr.n===0&&tr.pend===0){tr.state='out';tr.rec.departed=simNow()}}
      else{g.position.z+=16*dt;if(g.position.z>110){simG.remove(g);inTrucks[i]=null}}}
    const o=outTrucks[i];

    const g=o.g;
    if(o.state==='arr'){g.position.z=Math.max(DOCK_Z,g.position.z-16*dt);if(g.position.z===DOCK_Z){o.state='dock';o.rec.docked=simNow()}}
    else if(o.state==='dock'){if(o.n>=o.cap&&o.res===0){o.state='out';o.rec.departed=simNow()}}
    else{g.position.z+=16*dt;if(g.position.z>110){simG.remove(g);outTrucks[i]=null}}
  }}
function newOrder(){const t=simNow();const o={id:'A-'+String(++ordNo).padStart(5,'0'),customer:'',created:t,due:t+P.dueH*3600e3,pallets:P.palPerOrder,alloc:0,shippedPallets:0,shipped:null,status:'open',src:'sim'};

function assign(){
  const demand=halls.reduce((n,h)=>n+(h.phase==='mech'?Math.max(0,NEED-h.used-h.slots.filter(s=>s.pallet).length-h.incoming):0),0);
  for(const f of fls){if(f.job||f.retire)continue;
    const inReady=inBuf.filter(s=>s.pallet&&!s.reserved);

function compute(ds,a,b){const now=ds.now,end=Math.min(b,now);const K={};
  const trs=ds.trucks;

  K.ship=sumK(outb.filter(t=>inWin(t.departed,a,end)).map(t=>t.pallets));
  if(ds.mode==='sim'){K.recv=EV.recv.filter(e=>inWin(e.t,a,end)).length;K.ship=EV.ship.filter(e=>inWin(e.t,a,end)).length;K.prodPal=EV.prod.filter(e=>inWin(e.t,a,end)).length}
  else K.prodPal=null;

  K.turn=avg(trs.filter(t=>t.arrival&&t.departed&&inWin(t.departed,a,end)).map(t=>(t.departed-t.arrival)/60000));
  K.dockTime=avg(trs.filter(t=>t.docked&&t.departed&&inWin(t.departed,a,end)).map(t=>(t.departed-t.docked)/60000));

  const shs=shiftsBetween(a,b);
  if(ds.mode==='sim'){K.built=simOn?EV.built.filter(e=>inWin(e.t,a,end)).length:null;
    if(has(P.planHall)&&shs.length){let pl=0,pd=0;for(const s of shs){const ov=Math.max(0,Math.min(b,s.b)-Math.max(a,s.a))/(s.b-s.a);const ovd=Math.max(0,Math.min(end,s.b)-Math.max(a,s.a))/(s.b-s.a);pl+=P.planHall*9*ov;pd+=P.planHall*9*ovd}K.plan=pl;K.planToDate=pd}

  setH($('kpis'),KPIS.map(d=>{const v=kpiVal(K,d);const cls=v===null?'na':d.bad(K)?'bad':'';const th=KTH[d.k];const j=th&&!has(P[th])&&!(d.k==='occ'&&has(P.th_rackHi))?` data-jump="#pi-${th}" role="button" tabindex="0" title="${esc(T('ux_setThr'))}"`:'';
    return`<div class="kpi ${cls}"${j}><span title="${esc(T('k_'+d.k))}">${T('k_'+d.k)}</span><b>${fmtN(v,d.d)}</b><small>${v===null?'':unitT(d.u)}</small><em>${esc(d.th())}</em></div>`}).join(''));

  const H=dmode==='sim'?histS:histF;let rows='',sh=shiftAt(nowMs());const cur=sh?sh.k:null;
  for(let i=0;i<6&&sh;i++){if(dmode==='sim'&&(!simOn||sh.b<=simStartMs))break;const S=compute(ds,sh.a,sh.b);
    const mbv=H.filter(p=>p.t>=sh.a&&p.t<sh.b&&p.back!==null).map(p=>p.back);if(sh.k===cur&&S.backlog!==null)mbv.push(S.backlog);
    rows+=`<tr class="${sh.k===cur?'cur':''}"><td class="l">${shiftLabel(sh)}${sh.k===cur?' ▸':''}</td><td>${S.recv}</td><td>${S.ship}</td><td>${dash(S.built)}</td><td>${mbv.length?Math.max(...mbv):'—'}</td></tr>`;sh=shiftAt(sh.a-1)}
  $('shiftT').innerHTML=rows||`<tr><td class="l mut" colspan="5">${T('fa_none')}</td></tr>`}
const CHARTS=[{k:'stock',l:'c_stock',c:'#f2b705',max:()=>rack.length},{k:'back',l:'c_back',c:'#ef6b4a'},{k:'q',l:'c_q',c:'#6b9cf0'},{k:'built',l:'c_built',c:'#5fd38a'}];
$('charts').innerHTML=CHARTS.map(c=>`<div class="chart"><div class="cl"><span data-t="${c.l}"></span><b id="cv-${c.k}"></b></div><canvas id="ch-${c.k}"></canvas></div>`).join('');
function curSample(){const ds=getDS(),K=compute(ds,...curWin(ds.now));return{t:ds.now,stock:ds.stockRack,back:K.backlog,q:K.waiting,built:dmode==='sim'?(simOn?stats.built:null):K.built}}
function drawCharts(){const H=(dmode==='sim'?histS:histF).slice();const cur=curSample();if(dmode==='fact'||simOn)H.push(cur);
  for(const c of CHARTS){$('cv-'+c.k).textContent=dash(cur[c.k]);const cv=$('ch-'+c.k);const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)continue;
    const dpr=Math.min(devicePixelRatio,2);if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    const P2=H.filter(p=>p[c.k]!==null&&p[c.k]!==undefined);const data=P2.map(p=>p[c.k]),ts=P2.map(p=>p.t);
    if(!data.length){g.fillStyle='#5d6b7a';g.font='11px "IBM Plex Mono",monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(T('noData'),w/2,h/2);continue}
    const mx=c.max?c.max():Math.max(4,...data)*1.15;const pl=26,pb=12,pw=w-pl-4,ph=h-pb-6;
    g.strokeStyle='#26313c';g.fillStyle='#8d9bab';g.font='10px "IBM Plex Mono",monospace';g.textBaseline='middle';g.lineWidth=1;
    for(let i=0;i<=2;i++){const y=6+ph*(1-i/2);g.beginPath();g.moveTo(pl,y+.5);g.lineTo(w-4,y+.5);g.stroke();g.textAlign='right';g.fillText(Math.round(mx*i/2),pl-3,y)}
    if(data.length<2)continue;const t0=ts[0],t1=Math.max(ts[ts.length-1],t0+1);const X=t=>pl+(t-t0)/(t1-t0)*pw,Y=v=>6+ph*(1-Math.min(1,v/mx));
    g.textAlign='left';g.fillText(fmtT(t0),pl,h-5);g.textAlign='right';g.fillText(fmtT(t1),w-4,h-5);
    g.beginPath();g.moveTo(X(ts[0]),Y(data[0]));for(let i=1;i<data.length;i++)g.lineTo(X(ts[i]),Y(data[i]));g.strokeStyle=c.c;g.lineWidth=1.6;g.stroke();
    g.lineTo(X(ts[ts.length-1]),6+ph);g.lineTo(X(ts[0]),6+ph);g.closePath();g.globalAlpha=.15;g.fillStyle=c.c;g.fill();g.globalAlpha=1}}

/* ================= DOCKS: GANTT + SCHEDULE ================= */
const tolOk=()=>has(P.punctTol);
function drawGantt(ds){const cv=$('gantt');const w=cv.clientWidth;if(!w)return;const rowsN=7,rh=22,top=6,axis=28,h=top+rowsN*rh+axis;
  const dpr=Math.min(devicePixelRatio,2);cv.style.height=h+'px';if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const now=ds.now,a=now-6*3600e3,b=now+2*3600e3;const lw=52,pw=w-lw-6;const X=t=>lw+(Math.max(a,Math.min(b,t))-a)/(b-a)*pw;
  const labels=[T('g_plan'),'WE-1','WE-2','WE-3','WA-1','WA-2','WA-3'];
  g.font='11px "IBM Plex Mono",monospace';g.textBaseline='middle';
  for(let r=0;r<rowsN;r++){const y=top+r*rh;g.fillStyle=r%2?'#1b2430':'#18212b';g.fillRect(lw,y,pw,rh);g.fillStyle=r===0?'#8d9bab':r<4?'#6b9cf0':'#3fbfae';g.textAlign='left';g.fillText(labels[r],4,y+rh/2)}
  g.strokeStyle='#33414f';g.fillStyle='#8d9bab';g.textAlign='center';
  for(let t=Math.ceil(a/3600e3)*3600e3;t<=b;t+=3600e3){const x=X(t);g.beginPath();g.moveTo(x+.5,top);g.lineTo(x+.5,top+rowsN*rh);g.stroke();if(x>lw+12&&x<w-14)g.fillText(fmtT(t,now).slice(-5),x,top+rowsN*rh+11)}
  g.setLineDash([4,3]);g.strokeStyle='#c98bf0';for(const s of shiftsBetween(a,b)){if(s.a<=a)continue;const x=X(s.a);g.beginPath();g.moveTo(x+.5,top);g.lineTo(x+.5,top+rowsN*rh);g.stroke();g.fillStyle='#c98bf0';g.textAlign='left';g.fillText(T('shift')+' '+s.n,x+3,top+rowsN*rh+20)}g.setLineDash([]);g.fillStyle='#8d9bab';
  if(!ds.trucks.length){g.fillStyle='#5d6b7a';g.textAlign='center';g.fillText(T('noData'),lw+pw/2,top+rowsN*rh/2)}
  for(const t of ds.trucks){if(!t.docked)continue;const e=t.departed||now;if(e<a||t.docked>b)continue;let dk=t.dock;if(!dk)continue;
    const r=(t.dir==='in'?0:3)+dk,y=top+r*rh+3,x1=X(t.docked),x2=Math.max(x1+2,X(Math.min(e,now)));
    g.fillStyle=t.dir==='in'?'#5b8def':'#2fa797';g.globalAlpha=t.departed?0.85:1;g.fillRect(x1,y,x2-x1,rh-6);g.globalAlpha=1;
    if(!t.departed){g.strokeStyle='#f2b705';g.strokeRect(x1+.5,y+.5,x2-x1-1,rh-7)}
    if(x2-x1>46){g.fillStyle='#0d1520';g.textAlign='left';g.fillText(String(t.id).slice(-7),x1+3,y+(rh-6)/2)}}
  for(const t of ds.trucks){if(t.dir!=='in'||!t.planned||t.planned<a||t.planned>b)continue;const x=X(t.planned),y=top+rh/2;
    let col='#8d9bab',fill=false;if(t.arrival){fill=true;if(tolOk())col=Math.abs(t.arrival-t.planned)<=P.punctTol*60000?'#5fd38a':'#ef6b4a'}else if(tolOk()&&t.planned+P.punctTol*60000<now)col='#ef6b4a';
    g.beginPath();g.moveTo(x,y-6);g.lineTo(x+5,y);g.lineTo(x,y+6);g.lineTo(x-5,y);g.closePath();g.strokeStyle=col;g.fillStyle=col;fill?g.fill():g.stroke()}
  if(now>=a&&now<=b){const x=X(now);g.strokeStyle='#f2b705';g.lineWidth=1.5;g.beginPath();g.moveTo(x,top);g.lineTo(x,top+rowsN*rh);g.stroke();g.lineWidth=1}}
function renderTrucks(ds){const now=ds.now,[a,b]=curWin(now);
  const list=ds.trucks.filter(t=>t.dir===truckDir).filter(t=>{const st=truckStatus(t,now);const ts=[t.planned,t.arrival,t.docked,t.departed].filter(Boolean);
    return st==='waiting'||st==='docked'||!ts.length||ts.some(x=>x>=a-2*3600e3&&x<=b)}).sort((x,y)=>(x.planned||x.arrival||0)-(y.planned||y.arrival||0)).slice(-150);
  setH($('truckT'),list.length?list.map(t=>{const st=truckStatus(t,now);const dl=t.planned&&t.arrival?(t.arrival-t.planned)/60000:(t.planned&&!t.arrival&&now>t.planned?(now-t.planned)/60000:null);
    const late=dl!==null&&tolOk()&&Math.abs(dl)>P.punctTol;
    return`<tr><td class="l">${esc(t.id)}</td><td class="l mut">${esc(t.plate)}</td><td>${t.dock?(t.dir==='in'?'WE-':'WA-')+t.dock:'—'}</td><td>${fmtT(t.planned,now)}</td><td>${fmtT(t.arrival,now)}</td>
      <td class="${late?'bad':dl!==null&&tolOk()?'good':''}">${dl===null?'—':(dl>0?'+':'')+Math.round(dl)}</td><td>${fmtT(t.docked,now)}</td><td>${fmtT(t.departed,now)}</td><td>${dash(t.pallets)}</td><td class="l">${T('st_'+st)}</td><td class="l">${srcBadge(t)}</td></tr>`}).join('')
    :`<tr><td class="l mut wrap" colspan="11">${T('emptyData')}<div class="rowb" style="margin-top:6px"><button class="pri" data-entry="truck">${T('ux_addTruck')}</button><button data-go="data">${T('ux_loadFile')}</button></div></td></tr>`)}

function azProbe(){let raw=null;
  try{raw=window.localStorage.getItem(AZ_KEY)}catch(e){return{ok:false,why:'ls'}}           // read-only: getItem only, never setItem/removeItem on this key
  if(raw===null)return{ok:false,why:'none'};
  try{const a=JSON.parse(raw);if(!Array.isArray(a))return{ok:false,why:'fmt'};
    return{ok:true,parts:a.filter(p=>p&&String(p.num||'').trim()).map(p=>({num:String(p.num).trim(),loc:String(p.loc||'').trim(),name:String(p.name||'').trim()}))}}
  catch(e){return{ok:false,why:'fmt'}}}
function renderAzAvail(){const p=azProbe();const o=location.origin&&location.origin!=='null'?location.origin:location.protocol+'//';
  $('azAvail').innerHTML=p.ok?`<span class="okc">${T('az_avail')}: ${p.parts.length} ${T('az_parts')}</span> · ${T('az_origin')}: <code>${esc(o)}</code>`
    :`<span class="err">${T('az_na')}</span> ${T(p.why==='ls'?'az_why_ls':p.why==='fmt'?'az_why_fmt':'az_why_none')} ${T('az_origin')}: <code>${esc(o)}</code>. ${T('az_hint')} <code>${AZ_HOME}</code>`;
  $('azSync').disabled=!p.ok;return p}
$('azSync').onclick=()=>{const p=renderAzAvail();if(!p.ok){$('azStat').innerHTML='<span class="err">'+T('az_na')+'</span>';return}
  const recs=partRecs(p.parts);addFact(recs,'arbeitzeit','localStorage: '+AZ_KEY);$('azStat').innerHTML='<span class="okc">'+T('az_synced')+': '+recs.length+'</span> · '+fmtDT(new Date());afterFactLoad()};

async function azGet(){const url=$('azUrl').value.trim();const st=$('azUrlStat');

    if(!res.ok)throw new Error('HTTP '+res.status);

    st.innerHTML='<span class="okc">'+T('fa_ok')+': '+recs.length+'</span> · '+fmtDT(new Date());afterFactLoad()}

/* ================= SHIFT REPORT (print + CSV) ================= */
function repShift(){const n=+$('repSel').value||0;let s=shiftAt(nowMs());for(let i=0;i<n&&s;i++)s=shiftAt(s.a-1);return s}
function fillRepSel(){const v=$('repSel').value||'0';const s0=shiftAt(nowMs());
  if(!s0){$('repSel').innerHTML=`<option value="0">${T('per_day')} (${T('noShifts')})</option>`;return}
  let s=s0,o='';for(let i=0;i<3&&s;i++){o+=`<option value="${i}">${shiftLabel(s)}${i===0?' ('+T('rep_cur')+')':i===1?' ('+T('rep_prev')+')':''}</option>`;s=shiftAt(s.a-1)}
  $('repSel').innerHTML=o;$('repSel').value=v;if($('repSel').selectedIndex<0)$('repSel').value='0'}
$('repSel').onchange=()=>renderReport();
function reportModel(){const ds=getDS(),now=ds.now,sh=repShift();const [a,b]=sh?[sh.a,sh.b]:[now-86400e3,now+1];const K=compute(ds,a,b);
  const trucks=ds.trucks.filter(t=>[t.planned,t.arrival,t.docked,t.departed].some(x=>x&&x>=a&&x<b)).sort((x,y)=>(x.planned||x.arrival)-(y.planned||y.arrival));
  const late=ds.orders.filter(o=>o.status!=='shipped'&&o.due&&o.due<Math.min(b,now)).sort((x,y)=>x.due-y.due);
  const prod=halls.map(h=>{const p=ds.prod[h.id];let act=null,plan=has(P.planHall)?P.planHall:null;
    if(dmode==='sim'){act=simOn?EV.built.filter(e=>e.hall===h.id&&e.t>=a&&e.t<b).length:null}else if(p){act=p.actual;if(p.plan!==null)plan=p.plan}
    return{h:h.id,order:p?p.order:'',phase:p?p.phase:'none',progress:p?p.progress:null,plan,act,src:p?p.src:''}});
  const srcs=dmode==='sim'?[]:[...new Map(FACT.map(r=>[r.src+'|'+r.label,{src:r.src,label:r.label,at:r.at}])).values()];
  return{ds,sh,a,b,K,trucks,late,prod,srcs,now}}
function renderReport(){if(!$('repSel').options.length)fillRepSel();const m=reportModel(),K=m.K;
  const kp=KPIS.map(d=>{const v=kpiVal(K,d);return`<tr><td class="l">${T('k_'+d.k)}</td><td>${fmtN(v,d.d)} ${v===null?'':unitT(d.u)}</td><td>${esc(d.th())}</td><td class="${v!==null&&d.bad(K)?'bad':''}">${v===null?'—':d.bad(K)?T('rep_bad'):T('rep_ok')}</td></tr>`}).join('');

  const tr=m.trucks.slice(0,60).map(t=>{const dl=t.planned&&t.arrival?Math.round((t.arrival-t.planned)/60000):null;return`<tr><td class="l">${esc(t.id)}</td><td class="l">${t.dir==='in'?T('f_in'):T('f_out')}</td><td>${t.dock||'—'}</td><td>${fmtT(t.planned,m.a)}</td><td>${fmtT(t.arrival,m.a)}</td><td class="${dl!==null&&tolOk()&&Math.abs(dl)>P.punctTol?'bad':''}">${dl===null?'—':dl}</td><td>${fmtT(t.docked,m.a)}</td><td>${fmtT(t.departed,m.a)}</td><td>${dash(t.pallets)}</td></tr>`}).join('');
  const lt=m.late.slice(0,40).map(o=>`<tr><td class="l">${esc(o.id)}</td><td class="l">${esc(o.customer)}</td><td>${fmtT(o.due,m.a)}</td><td>${dash(o.shippedPallets)}/${dash(o.pallets)}</td></tr>`).join('');
  const pr=m.prod.map(p=>`<tr><td class="l">H${p.h}</td><td class="l">${esc(p.order)}</td><td class="l">${T('ph_'+p.phase)}</td><td>${p.progress===null?'—':Math.round(p.progress*100)+'%'}</td><td>${p.plan===null?'—':fmtN(p.plan,p.plan%1?1:0)}</td><td>${dash(p.act)}</td></tr>`).join('');
  const st=m.sh?P.staff[m.sh.n]:null;

  L.push('');row([T('rep_late')]);row(['order_id','customer','created_at','due','pallets','shipped_pallets','source']);for(const o of m.late)row([o.id,o.customer,iso(o.created),iso(o.due),o.pallets,o.shippedPallets,o.src]);

let factSig='';
function factPallet(x,y,z){const g=new THREE.Group();const b=new THREE.Mesh(gBase,M.wood);b.position.y=0.08;const l=new THREE.Mesh(gLoad,loadMats[(Math.abs(x*7+z*3+y*11)|0)%loadMats.length]);l.scale.y=0.85;l.position.y=0.16+0.55*0.85;
  for(const o of[b,l]){o.castShadow=true;o.receiveShadow=true;g.add(o)}g.position.set(x,y,z);factG.add(g);return g}
function clearFactG(){for(const c of [...factG.children]){if(c.userData.disp)c.traverse(o=>{if(o.geometry&&o.geometry!==gBase&&o.geometry!==gLoad)o.geometry.dispose()});factG.remove(c)}}
function buildFact3D(force){const ds=factDS(),now=ds.now;
  const st=ds.trucks.map(t=>t.id+truckStatus(t,now)+(t.dock||'')).join(',');const sig=st+'|'+ds.stock.length+':'+ds.stockRack+':'+ds.stockIn+':'+ds.stockOut+':'+ds.stockProd+'|'+ds.stock.map(s=>s.uid).join('.');
  if(!force&&sig===factSig)return;factSig=sig;clearFactG();
  const occ={in:[null,null,null],out:[null,null,null]},wait={in:[],out:[]};
  for(const t of ds.trucks){const s=truckStatus(t,now);if(s==='docked'){const o=occ[t.dir];let i=t.dock?t.dock-1:o.indexOf(null);if(i<0)continue;if(!o[i]||(o[i].docked||0)<(t.docked||0))o[i]=t}else if(s==='waiting')wait[t.dir].push(t)}
  for(const dir of['in','out']){const D=dir==='in'?DOCKS_IN:DOCKS_OUT,cab=dir==='in'?M.inCab:M.outCab;
    occ[dir].forEach((t,i)=>{if(!t)return;const g=makeTruck(cab,D[i],factG);g.position.z=DOCK_Z;g.userData.disp=true});
    wait[dir].slice(0,6).forEach((t,j)=>{const g=makeTruck(cab,D[j%3],factG);g.position.z=DOCK_Z+20+Math.floor(j/3)*18;g.userData.disp=true})}
  const used=new Set();let left=0;
  for(const s of ds.stock){if(s.zone!=='rack'||s.qty===null)continue;let q=Math.round(s.qty);const m=s.loc.match(/(\d+)\D+(\d+)\D+(\d+)/);
    if(m&&q>0){const r=+m[1],bay=+m[2],lv=+m[3];if(r>=1&&r<=4&&bay>=1&&bay<=20&&lv>=1&&lv<=3){const i=(r-1)*60+(bay-1)*3+(lv-1);if(!used.has(i)){used.add(i);q--}}}left+=Math.max(0,q)}
  for(let i=0;i<rack.length&&left>0;i++)if(!used.has(i)){used.add(i);left--}
  for(const i of used){const s=rack[i];factPallet(s.x,s.y,s.z)}
  const zoneFill=(n,slots)=>{for(let i=0;i<Math.min(n,slots.length);i++)factPallet(slots[i].x,0,slots[i].z)};
  if(ds.hasStock){zoneFill(Math.round(ds.stockIn||0),inBuf);zoneFill(Math.round(ds.stockOut||0),outBuf);zoneFill(Math.round(ds.stockProd||0),prodBuf)}}
function factHallState(p){if(!p)return{phase:'none',prog:null,stock:0,order:''};return{phase:p.phase,prog:p.progress,stock:0,order:p.order}}

const HELP={ru:`<p><b>В программе нет встроенных данных и значений по умолчанию.</b> Все данные приходят только из трёх мест: <b>Arbeitzeit</b> (только чтение), <b>файлы</b> CSV/JSON пользователя и <b>ввод</b> вручную на вкладке «Ввод». У каждой записи хранится источник и время загрузки. Повторная загрузка того же файла/адреса заменяет его прежние записи. Пустое поле = «не задано»: такие значения не подставляются, показатель показывает «—», тревога не поднимается.</p>
<h3>Arbeitzeit → Logistik-Hub (односторонне)</h3>
<p>Arbeitzeit (<code>${AZ_HOME}</code>), раздел «Склад / Lager» — реестр деталей: номер детали, место, название. Logistik-Hub никогда ничего не пишет в Arbeitzeit и ничего туда не отправляет.</p>
<p><b>1. Экспорт CSV из Arbeitzeit</b> (Склад → «Экспорт CSV», файл <code>lager-ГГГГ-ММ-ДД.csv</code>): кодировка UTF-8 с BOM, разделитель <code>;</code>, строки CRLF, значения с <code>; , " </code> или пробелами по краям — в кавычках. Первая строка — заголовок на языке Arbeitzeit, колонки по позиции:</p>
<table><tr><th class="l">RU</th><td class="l"><code>Номер детали;Место;Название</code></td></tr><tr><th class="l">DE</th><td class="l"><code>Teilenummer;Lagerort;Bezeichnung</code></td></tr><tr><th class="l">EN</th><td class="l"><code>Part number;Location;Name</code></td></tr><tr><th class="l">FR / ES</th><td class="l"><code>Référence;Emplacement;Désignation</code> / <code>Número de pieza;Ubicación;Nombre</code></td></tr></table>
<p>Как и в Arbeitzeit, принимаются строка <code>sep=;</code>, файлы без заголовка, разделители <code>,</code>/Tab и старые Excel-файлы в windows-1251/1252. Пустой номер — строка пропускается; повтор номера — побеждает последняя строка.</p>
<p><b>2. «Синхронизировать с Arbeitzeit»</b> — только если обе программы открыты с одного origin (протокол + домен + порт, например обе на <code>https://workbridgepersonal.de</code>). Тогда читается <code>localStorage['timetracking-lager-parts']</code> (JSON <code>[{num,loc,name}]</code>) — только чтение. С другого адреса или из файла браузер этот ключ не показывает — используйте экспорт CSV.</p>
<p><b>3. Адрес GET</b> — необязательный URL, отдающий JSON или CSV (в т.ч. Lager-CSV). Выполняется только GET без тела; сайт должен разрешать чтение из браузера (CORS).</p>
<p><b>Время:</b> ISO 8601 (<code>2026-10-18T07:40:00+03:00</code>), <code>2026-10-18 07:40</code>, <code>18.10.2026 07:40</code>, <code>07:40</code> (сегодня) или Unix-время; без пояса — местное время браузера. CSV-файлы: первая строка — заголовки, разделитель <code>,</code> <code>;</code> или Tab. Тип записи — из поля <code>type</code>, ключа JSON-обёртки (<code>{"trucks":[…],"orders":[…],"stock":[…],"production":[…]}</code>), названий полей или имени файла. Принимаются английские, немецкие и русские синонимы полей (в скобках).</p>
<h3>Фуры (truck)</h3><table>
<tr><td class="l"><code>id</code></td><td class="l">ID рейса (truck_id, lkw_id, номер); иначе госномер</td></tr><tr><td class="l"><code>direction</code></td><td class="l">in / out (WE/WA, eingang/ausgang, приёмка/отгрузка)</td></tr>
<tr><td class="l"><code>dock</code></td><td class="l">рампа 1–3 или WE-1…WA-3</td></tr><tr><td class="l"><code>plate</code>, <code>carrier</code></td><td class="l">госномер, перевозчик</td></tr>
<tr><td class="l"><code>planned_arrival</code>, <code>actual_arrival</code></td><td class="l">план / факт прибытия</td></tr><tr><td class="l"><code>docked_at</code>, <code>departed_at</code></td><td class="l">на рампе / убытие</td></tr>
<tr><td class="l"><code>stocked_at</code></td><td class="l">последняя паллета размещена (dock-to-stock)</td></tr><tr><td class="l"><code>pallets</code></td><td class="l">паллет; если нет — «—»</td></tr>
<tr><td class="l"><code>status</code></td><td class="l">waiting / docked / departed — показывается как есть, времена не придумываются</td></tr></table>
<h3>Заказы (order)</h3><table><tr><td class="l"><code>order_id</code>, <code>customer</code>, <code>created_at</code>, <code>due</code> (срок), <code>pallets</code>, <code>shipped_pallets</code>, <code>shipped_at</code>, <code>status</code> (open / picked / shipped). Без <code>pallets</code> заказ не входит в fill rate.</td></tr></table>
<h3>Запас (stock)</h3><table><tr><td class="l"><code>sku</code>, <code>location</code> (<code>R1-05-2</code> = ряд 1–4, секция 1–20, ярус 1–3), <code>zone</code> (rack / inbound / outbound / production; пусто = rack), <code>qty</code> (паллет; без qty строка не считается). Учитывается последняя импортированная выгрузка + записи «ввод».</td></tr></table>
<h3>Производство (production)</h3><table><tr><td class="l"><code>hall</code> (H1–H9), <code>order_id</code>, <code>product</code>, <code>phase</code> (mech / elec / test / done / idle), <code>progress</code> (0–1 или %), <code>planned_qty</code>, <code>actual_qty</code> (за смену), <code>updated_at</code>. Цех без записи — «нет данных».</td></tr></table>
<h3>Детали (part)</h3><table><tr><td class="l"><code>num</code>, <code>loc</code>, <code>name</code> — формат Arbeitzeit. Используется на вкладке «Детали»; на запас в паллетах не влияет (в реестре нет количества).</td></tr></table>`,
de:`<p><b>Das Programm enthält keine eingebauten Daten oder Standardwerte.</b> Daten kommen nur aus drei Quellen: <b>Arbeitzeit</b> (nur lesen), <b>Dateien</b> CSV/JSON und <b>Eingabe</b> im Reiter „Eingabe“. Jeder Datensatz trägt Quelle und Ladezeit. Leeres Feld = „nicht gesetzt“: nichts wird ersetzt, die Kennzahl zeigt „—“, kein Alarm.</p>
<h3>Arbeitzeit → Logistik-Hub (nur in eine Richtung)</h3>
<p>Arbeitzeit (<code>${AZ_HOME}</code>), Bereich „Lager“ — Teileverzeichnis: Teilenummer, Lagerort, Bezeichnung. Logistik-Hub schreibt nie in Arbeitzeit und sendet nichts dorthin.</p>
<p><b>1. CSV-Export aus Arbeitzeit</b> (Lager → „CSV exportieren“, <code>lager-JJJJ-MM-TT.csv</code>): UTF-8 mit BOM, Trenner <code>;</code>, CRLF, Werte mit <code>; , "</code> oder Randleerzeichen in Anführungszeichen. Erste Zeile = Kopfzeile in der Arbeitzeit-Sprache, Spalten positionsbezogen: <code>Teilenummer;Lagerort;Bezeichnung</code> (DE), <code>Номер детали;Место;Название</code> (RU), <code>Part number;Location;Name</code> (EN), FR/ES analog. Wie in Arbeitzeit werden <code>sep=;</code>, Dateien ohne Kopfzeile, <code>,</code>/Tab und ältere Excel-Dateien (windows-1251/1252) akzeptiert.</p>
<p><b>2. „Mit Arbeitzeit synchronisieren“</b> — nur wenn beide Apps auf demselben Origin laufen (Protokoll + Domain + Port). Dann wird <code>localStorage['timetracking-lager-parts']</code> (JSON <code>[{num,loc,name}]</code>) nur gelesen. Sonst CSV-Export verwenden.</p>
<p><b>3. GET-Adresse</b> — optionale URL mit JSON oder CSV; nur GET, Seite muss CORS erlauben.</p>
<p><b>Zeit:</b> ISO 8601, <code>2026-10-18 07:40</code>, <code>18.10.2026 07:40</code>, <code>07:40</code> (heute) oder Unix-Zeit; ohne Zone = Ortszeit.</p>
<h3>LKW (truck)</h3><table><tr><td class="l"><code>id</code>, <code>direction</code> (in/out, WE/WA), <code>dock</code> (1–3 / WE-1…WA-3), <code>plate</code>, <code>carrier</code>, <code>planned_arrival</code>, <code>actual_arrival</code>, <code>docked_at</code>, <code>departed_at</code>, <code>stocked_at</code>, <code>pallets</code>, <code>status</code> (ohne erfundene Zeiten)</td></tr></table>
<h3>Aufträge (order)</h3><table><tr><td class="l"><code>order_id</code>, <code>customer</code>, <code>created_at</code>, <code>due</code>, <code>pallets</code>, <code>shipped_pallets</code>, <code>shipped_at</code>, <code>status</code> (open/picked/shipped)</td></tr></table>
<h3>Bestand (stock)</h3><table><tr><td class="l"><code>sku</code>, <code>location</code> (<code>R1-05-2</code> = Reihe 1–4, Feld 1–20, Ebene 1–3), <code>zone</code> (rack/inbound/outbound/production), <code>qty</code> (Paletten; ohne qty nicht gezählt). Letzter Import + manuelle Eingaben.</td></tr></table>
<h3>Produktion (production)</h3><table><tr><td class="l"><code>hall</code> (H1–H9), <code>order_id</code>, <code>product</code>, <code>phase</code> (mech/elec/test/done/idle), <code>progress</code> (0–1 oder %), <code>planned_qty</code>, <code>actual_qty</code>, <code>updated_at</code></td></tr></table>
<h3>Teile (part)</h3><table><tr><td class="l"><code>num</code>, <code>loc</code>, <code>name</code> — Arbeitzeit-Format, für die Teilesuche; ohne Mengen.</td></tr></table>`};

{const sp=$('split');let d=null;

function buildQuick(){$('qTruck').hidden=entType!=='truck';segSel('qDir','v',qDir);segSel('qEv','v',qEv);if(!$('qTime').value)$('qTime').value=nowLocal();

/* ================= SCENE SWITCH ================= */

/* ================= POINTER / ORBIT (shared) ================= */
const act=()=>scene==='hub'?[camH,goalH]:[camC,goalC];
const ptrs=new Map();let pinch=0,down=null;
stage.addEventListener('pointerdown',e=>{if(e.target!==R.domElement)return;stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  down=ptrs.size===1?{x:e.clientX,y:e.clientY,moved:0}:null;if(scene==='hub')stage.style.cursor='grabbing'});
stage.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
  if(!p){if(scene==='campus'&&e.pointerType==='mouse'&&e.target===R.domElement)setHover(pickAt(e.clientX,e.clientY));return}
  const [cam,goal]=act();
  if(ptrs.size===1){goal.th-=(e.clientX-p.x)*0.007;goal.ph=Math.min(1.45,Math.max(goal.phMin,goal.ph+(e.clientY-p.y)*0.005));cam.th=goal.th;cam.ph=goal.ph}
  if(down)down.moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){goal.d=Math.min(goal.max,Math.max(goal.min,goal.d*pinch/d))}pinch=d;down=null}});
const up=e=>{const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;if(!ptrs.size)stage.style.cursor=scene==='campus'&&hover?'pointer':'';
  if(had&&e.type==='pointerup'&&down&&down.moved<8&&scene==='campus'){const g=pickAt(e.clientX,e.clientY);if(g){setHover(g);openBuilding(g.userData.bid)}else setHover(null)}
  if(!ptrs.size)down=null};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();const [,goal]=act();goal.d=Math.min(goal.max,Math.max(goal.min,goal.d*(1+Math.sign(e.deltaY)*0.1)))},{passive:false});
function placeCam(cam,goal,camera,dt){const k=1-Math.exp(-4*dt);cam.t.lerp(goal.t,k);cam.th+=(goal.th-cam.th)*k;cam.ph+=(goal.ph-cam.ph)*k;cam.d+=(goal.d-cam.d)*k;
  camera.position.set(cam.t.x+cam.d*Math.sin(cam.th)*Math.cos(cam.ph),cam.t.y+cam.d*Math.sin(cam.ph),cam.t.z+cam.d*Math.cos(cam.th)*Math.cos(cam.ph));camera.lookAt(cam.t)}

  const narrow=w/h<0.9;VIEWS[0].d=narrow?290:200;VIEWS[1].d=narrow?170:115;if(vi<2&&viewName()===T('views')[vi])goalH.d=VIEWS[vi].d;
  if(narrow){goalC.d=Math.max(goalC.d,560);goalC.t.x=-70}C.updateProjectionMatrix();C2.updateProjectionMatrix()}

function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(dmode==='sim'&&!paused){let sim=dt*speed;while(sim>0){const s=Math.min(0.04,sim);step(s);sim-=s}}
