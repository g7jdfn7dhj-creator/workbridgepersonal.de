<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logistik-Hub</title>
<meta name="app-version" content="lhub-pwa-v5">
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#161d26">
<meta name="description" content="Logistik-Hub v5 — складской учёт в деталях (шт.) с 3D-визуализацией склада. Данные только на устройстве, без встроенных данных.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logistik-Hub">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<style>

:root{--bg:#161d26;--panel:#1e2732;--panel2:#18212b;--line:#33414f;--line2:#26313c;--fg:#e8edf2;--mut:#8d9bab;
  --amber:#f2b705;--on-amber:#1d1600;--in:#6b9cf0;--out:#3fbfae;--warn:#ef6b4a;--ok:#5fd38a;--sim:#c98bf0;
  --vest:#ff7a1a;--log:#b5d334;--mech:#3d6fc4;--elec:#9b7cf0;
  --f-disp:"Saira Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px var(--f-disp);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pad{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{padding-block:7px;display:flex;align-items:center;gap:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0;white-space:nowrap}
h1 small{font-weight:400;color:var(--mut);letter-spacing:.06em;font-size:13px;margin-left:8px}
.hright{display:flex;align-items:center;gap:12px;margin-left:auto}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock b{color:var(--amber);font-weight:500}
.banner{padding-block:5px;font-size:13px;letter-spacing:.03em;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner .tag{font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:2px}
.banner{background:#17242c}.banner .tag{background:var(--out);color:#06221e}
.banner .mut{color:var(--mut)}
.hud{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--panel);padding:6px 10px 7px;min-width:0}
.stat span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.stat.hot{box-shadow:inset 0 -2px 0 var(--warn)}.stat.hot b{color:var(--warn)}
.meter{height:3px;background:var(--line);margin-top:5px}.meter i{display:block;height:100%;width:0;background:var(--amber);transition:width .4s}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-height:0;min-width:0;touch-action:none;cursor:grab;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.legend{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);pointer-events:none;text-shadow:0 1px 2px #0008}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px}
#warn{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;max-width:60%}
#warn div{background:rgba(30,39,50,.92);border-left:3px solid var(--warn);color:var(--fg);font-size:12px;letter-spacing:.04em;padding:3px 8px}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(30,39,50,.94);border:1px solid var(--line);border-top:3px solid var(--out);padding:14px 18px;max-width:360px;font-size:14px;line-height:1.4}
.keys{position:absolute;bottom:8px;left:12px;font-family:var(--f-mono);font-size:11px;color:var(--mut);pointer-events:none}
#panel{width:560px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
.ptop{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.ptop .sp{flex:1}
.tabsrow{display:flex;border-bottom:1px solid var(--line)}
.tabs{flex:1;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;min-height:34px;color:var(--mut);font-size:13px;padding:2px 4px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--amber);background:var(--panel2)}
#sheetBtn{display:none}
.tabc{flex:1;overflow:auto;padding:10px 12px 16px;min-height:0;overscroll-behavior:contain}
.sec{margin-bottom:14px}
h3,details>summary{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 7px}
details{border-top:1px solid var(--line);padding-top:7px;margin-bottom:10px}
details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details>summary::after{content:"▾"}details:not([open])>summary::after{content:"▸"}details>summary::-webkit-details-marker{display:none}
button{font:inherit;font-size:13px;letter-spacing:.05em;text-transform:uppercase;background:transparent;color:var(--fg);border:1px solid var(--line);padding:4px 10px;min-height:32px;border-radius:2px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--mut)}
button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.pri{border-color:var(--amber);color:var(--amber)}button.danger{border-color:#ef6b4a;color:#ef6b4a}
.seg{display:flex}.seg button{border-radius:0}.seg button+button{border-left:0}
.seg.sm button{min-height:28px;padding:2px 8px;font-size:12px}
.note{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kpi{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--ok);padding:6px 8px;min-width:0}
.kpi.bad{border-left-color:var(--warn)}.kpi.na{border-left-color:var(--line)}
.kpi span{display:block;font-size:12px;color:var(--mut);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-family:var(--f-mono);font-weight:500;font-size:17px}.kpi.bad b{color:var(--warn)}
.kpi small{font-family:var(--f-mono);font-size:11px;color:var(--mut);margin-left:4px}
.kpi em{float:right;font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--mut);margin-top:6px}
.alerts div{border-left:3px solid var(--warn);background:var(--panel2);padding:4px 8px;margin-bottom:4px;font-size:13px}
.chart{margin-bottom:8px}.chart .cl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.chart .cl b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.chart canvas{width:100%;height:64px;display:block;background:var(--panel2);border:1px solid var(--line)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--f-mono)}
th{font-family:var(--f-disp);font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:-10px;background:var(--panel)}
td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line2);white-space:nowrap}
th.l,td.l{text-align:left}
td.bad{color:var(--warn)}td.good{color:var(--ok)}td.mut{color:var(--mut)}
tr.cur td{color:var(--amber)}
tr.click{cursor:pointer}tr.click:hover td{background:#223040}
.pbar{display:inline-block;width:70px;height:6px;background:var(--line);vertical-align:middle}.pbar i{display:block;height:100%}
.src{display:inline-block;font-family:var(--f-disp);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:0 4px;border:1px solid;border-radius:2px;white-space:nowrap}
.src.a{color:#9fc1e3;border-color:#4d6f93}.src.i{color:#f2c46b;border-color:#8a6a2a}.src.f{color:#cfe39a;border-color:#6a7d3a}.src.s{color:#d9b8f2;border-color:#6d4d86}
.gantt canvas{width:100%;display:block;background:var(--panel2);border:1px solid var(--line)}
.tw{overflow:auto;max-height:360px}
.cell{display:flex;align-items:center;gap:6px}.cell .nm{flex:1;min-width:0;font-size:14px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .nm i{display:inline-block;width:8px;height:8px;margin-right:6px}.cell b{font-family:var(--f-mono);font-weight:500;min-width:2.5ch;text-align:center}
.cell .ut{font-family:var(--f-mono);font-size:11px;color:var(--mut);width:4.5ch;text-align:right}
.staffc{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
input[type=number],input[type=url],input[type=text],input[type=time],input[type=datetime-local],input[type=search],select{font:13px var(--f-mono);background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:4px 6px;border-radius:2px}
input[type=number]{width:76px;text-align:right}
input[type=url]{width:100%;margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:1fr auto 5.5em;gap:4px 8px;align-items:center;font-size:13px}
.pgrid span.u{font-family:var(--f-mono);font-size:11px;color:var(--mut)}
.rowb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
label.ck{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}.kv span{color:var(--mut)}.kv b{font-family:var(--f-mono);font-weight:500;text-align:right}
.err{color:var(--warn)}.okc{color:var(--ok)}
.help{font-size:12.5px;line-height:1.4;color:#cdd6df}.help code{font-family:var(--f-mono);font-size:11.5px;color:var(--amber)}.help table{margin:4px 0 10px}.help td{white-space:normal}
#report{background:#fff;color:#111;padding:14px 16px;font:12px/1.35 var(--f-disp);border:1px solid var(--line)}
#report h2{font-size:18px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.04em}#report h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 4px;color:#333;border-bottom:1px solid #999}
#report table{font-size:11px}#report th{color:#333;background:#fff;position:static;border-bottom:1px solid #666}#report td{border-bottom:1px solid #ddd;white-space:normal}
#report .bad{color:#b4321a;font-weight:600}#report .modetag{display:inline-block;padding:1px 6px;border:1px solid #111;font-weight:600;letter-spacing:.06em}
#report .meta{color:#444}
/* campus */
.campusui{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.campusui>*{pointer-events:auto}
.hint{background:rgba(22,29,38,.85);border-left:3px solid var(--amber);padding:8px 12px;max-width:440px;font-size:15px}
.hint small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.blist{display:flex;flex-wrap:wrap;gap:6px}.blist button{background:rgba(22,29,38,.85)}.blist button.hubb{border-color:#f0a070;color:#ffc79e}
#bLabel{position:absolute;pointer-events:none;transform:translate(-50%,-100%);background:rgba(22,29,38,.92);border:1px solid var(--amber);padding:4px 10px;font-size:14px;white-space:nowrap}
#bLabel small{display:block;color:var(--amber);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,19,.5)}
#card>div{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--amber);padding:18px 20px;max-width:340px;width:calc(100% - 32px)}
#card h2{margin:0 0 4px;font-size:21px;font-weight:600;text-transform:uppercase}#card .soon{color:var(--amber);font-family:var(--f-mono);font-size:13px;margin-bottom:10px}#card p{color:var(--mut);margin:0 0 14px}
#fade{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .25s}#fade.on{opacity:1}
body[data-scene="campus"] .hubonly{display:none!important}body[data-scene="hub"] .campusonly{display:none!important}body[data-scene="campus"] #stage{cursor:default}
@media (max-width:1250px){#panel{width:470px}.hud{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  #main{flex-direction:column}#panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:48vh;flex:none}
  #panel.collapsed .tabc{display:none}#sheetBtn{display:block;flex:none;width:42px;border:0;border-left:1px solid var(--line);border-radius:0}
  .keys{display:none}.charts{grid-template-columns:1fr}.legend{font-size:10px}#warn{max-width:55%}
}
.sh{display:none}
@media (max-width:900px){#legend,#warn{display:none!important}.banner{white-space:nowrap;overflow:hidden;font-size:12px}.banner span:not(.tag){overflow:hidden;text-overflow:ellipsis}
  .hud{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:4px 8px}.stat span{font-size:10px}.stat b{font-size:13px}.meter{margin-top:3px}#panel{max-height:44vh}}
@media (max-width:520px){.lg{display:none}.sh{display:inline}header{gap:6px 10px}.clock{font-size:12px}.hright{gap:8px}h1 small{display:none}h1{font-size:17px}.hud .stat b{font-size:14px}.kpis{grid-template-columns:1fr 1fr}.staffc{grid-template-columns:1fr}.kpi b{font-size:15px}}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  header,.banner,.hud,#stage,.ptop,.tabsrow,.noprint{display:none!important}
  #main{display:block}#panel{display:block!important;width:auto;border:0;background:#fff;max-height:none}
  .tabc{display:none!important}#tab-report{display:block!important;overflow:visible;padding:0}
  #report{border:0;padding:0}
}
.inv{border-color:var(--red,#ef6b4a)!important;outline:1px solid var(--red,#ef6b4a)}
.req{color:var(--amber);font-style:normal}
.miss{margin:6px 0 8px 18px;padding:0;font-size:12px;line-height:1.45}.empty ul{margin:6px 0 0 18px;padding:0;font-size:12px;text-align:left}
#simGate{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--panel2);padding:8px 10px;margin-bottom:12px;font-size:13px}
.eform{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:12px;margin-bottom:8px}.eform input,.eform select{width:100%;box-sizing:border-box;min-width:0}
input[type=search]{width:100%;box-sizing:border-box;margin-bottom:6px}
.part{padding:6px 8px;border:1px solid var(--line);background:var(--panel2);margin-bottom:4px;font-size:13px}.part .loc{color:var(--amber);font-family:var(--f-mono)}
button.x{min-height:22px;padding:0 6px;font-size:11px}button:disabled{opacity:.45;cursor:not-allowed}
.pgrid input[type=time]{width:96px}
#installBtn{min-height:28px;padding:2px 10px;font-size:12px;white-space:nowrap}
#pwaBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;gap:10px;align-items:center;max-width:min(560px,94vw);
  background:rgba(30,39,50,.97);border:1px solid var(--line);border-left:3px solid var(--amber);padding:10px 12px;font-size:13px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#pwaBar[hidden]{display:none}#pwaBar .t{flex:1}#pwaBar button{white-space:nowrap}
@media print{#pwaBar,#installBtn{display:none!important}}

/* ===================== UX v2 (responsive shell) ===================== */
.xbtn{border:0;background:transparent;color:var(--mut);min-height:28px;min-width:28px;padding:0 6px;font-size:18px;line-height:1;text-transform:none;letter-spacing:0;flex:none}
.xbtn:hover{color:var(--fg)}
.banner{flex-wrap:nowrap;padding-block:2px}
#banner{flex:1;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:3px}
#addBtn{background:var(--amber);color:var(--on-amber);border-color:var(--amber);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
#addBtn .ic{font-size:18px;line-height:1;font-weight:600}
#menuBtn{font-size:18px;padding:2px 10px;text-transform:none;letter-spacing:0}
.menu{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 50px);right:max(10px,env(safe-area-inset-right,0px));width:min(330px,calc(100vw - 20px));max-height:calc(100vh - 70px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--amber);box-shadow:0 10px 30px rgba(0,0,0,.55);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.menu .mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu label.ck{font-size:14px;color:var(--fg);min-height:36px}
.menu .clockM{font-family:var(--f-mono);font-size:13px;color:var(--mut)}
.menu .mb{width:100%;text-align:left}
#warn{top:58px}
#warn div{pointer-events:auto;display:flex;align-items:center;gap:4px}
#warn .xbtn{min-height:22px;min-width:22px;font-size:15px;padding:0 2px}
.empty{pointer-events:auto;z-index:4}
.empty .ehead{display:flex;gap:10px;align-items:flex-start}.empty .ehead>span{flex:1}
.empty .ehead .xbtn{margin:-6px -10px 0 0}
.empty .rowb{margin-top:10px}
.hint{display:flex;gap:6px;align-items:flex-start}.hint>div{flex:1}.hint .xbtn{margin:-4px -8px 0 0}
#stageTools{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;z-index:6}
#stageTools button{background:rgba(22,29,38,.88);min-width:40px;font-size:16px;text-transform:none;letter-spacing:.02em}
#panelShow{display:none}
body.pcol[data-scene="hub"] #panelShow{display:inline-block}
body.fs #stage{position:fixed;inset:0;z-index:55;height:auto!important;flex:none;background:var(--bg)}
body.fs #stageTools{top:max(10px,env(safe-area-inset-top,0px))}
body.nohints #bannerRow,body.nohints #emptyMsg,body.nohints #warn,body.nohints #campusHint,body.nohints .keys{display:none!important}
#hudWrap{position:relative;border-bottom:1px solid var(--line);background:var(--line)}
#hudWrap .hud{border-bottom:0;margin-right:38px}
#hudBtn{position:absolute;right:0;top:0;bottom:0;width:38px;min-height:0;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--panel);padding:0;font-size:14px;color:var(--mut);text-transform:none}
#hudWrap.c .hud{display:none}
#hudWrap.c #hudBtn{position:static;display:block;width:100%;height:34px;min-height:34px;border-left:0;text-align:left;padding:0 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#split{flex:none;width:7px;cursor:col-resize;background:var(--panel2);border-left:1px solid var(--line);touch-action:none;position:relative}
#split::after{content:"";position:absolute;left:2px;top:50%;width:1px;height:36px;margin-top:-18px;background:var(--mut);box-shadow:2px 0 0 var(--mut)}
#split:hover,#split.drag,#split:focus-visible{background:#3a3220}
#panel{border-left:0}
body.pcol #panel,body.pcol #split{display:none!important}
@media (min-width:901px){#panel{width:var(--pw,560px)}}
@media (min-width:901px) and (max-width:1250px){#panel{width:var(--pw,470px)}}
.kpis{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.charts{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tabs button .ti{display:none}
#tabs button[data-tab="entry"]{color:var(--amber)}
.flash{animation:flash 1.8s ease-out}

/* ================= STOCK DATA (v5) — parts, counted in pieces. Sources: manual entry, CSV/JSON files, Arbeitzeit (read-only).
   Storage: lhub.r4.data (same key as v4, format v:5) via LHStore (localStorage + IndexedDB mirror, this device only). ================= */
const LS=(()=>{try{const s=window.localStorage;s.getItem('x');return s}catch(e){return null}})();
const has=v=>v!==null&&v!==undefined&&v!==''&&isFinite(v);
const DKEY='lhub.r4.data',PKEY='lhub.r4.params',MKEY='lhub.r4.migrated',V4KEY='lhub.r4.v4backup';
const ROWS_N=4,BAYS_N=20,LV_N=3,SLOTS_N=ROWS_N*BAYS_N*LV_N;          // fixed rack layout: 240 slots
const SIZES=['S','M','L'];
let PARTS=[],uidNo=0,lastChange=null,dataRev=0;
const azNorm=s=>String(s==null?'':s).trim().toLowerCase();
/* location R1-05-2 = row 1–4, section 1–20, level 1–3 → slot index 0…239 (or -1) */
function slotOf(loc){const m=String(loc||'').trim().match(/^R?\s*0*(\d{1,2})\s*[-.\/ _]\s*0*(\d{1,2})\s*[-.\/ _]\s*0*(\d{1,2})$/i);if(!m)return -1;
  const r=+m[1],b=+m[2],l=+m[3];if(r<1||r>ROWS_N||b<1||b>BAYS_N||l<1||l>LV_N)return -1;return (r-1)*BAYS_N*LV_N+(b-1)*LV_N+(l-1)}
function slotName(i){const r=Math.floor(i/(BAYS_N*LV_N))+1,b=Math.floor(i/LV_N)%BAYS_N+1,l=i%LV_N+1;return 'R'+r+'-'+String(b).padStart(2,'0')+'-'+l}
function normLoc(loc){const s=String(loc==null?'':loc).trim();const i=slotOf(s);return i>=0?slotName(i):s}
/* size class: S/M/L only from the user/import; anything else → null (unclassified, never invented) */
function parseSize(v){if(v==null)return null;const s=String(v).trim().toLowerCase().replace(/\.$/,'');if(!s)return null;
  if(/^(s|small|klein|kl|мал[а-яё]*)$/.test(s))return'S';
  if(/^(m|medium|mid|mittel|mittelgroß|сред[а-яё]*)$/.test(s))return'M';
  if(/^(l|large|big|groß|gross|бол[а-яё]*)$/.test(s))return'L';return null}
function parseQty(v){if(v===undefined||v===null)return undefined;const s=String(v).trim().replace(/[\s\u00a0']/g,'');if(s==='')return undefined;
  const n=+s.replace(',','.');if(!isFinite(n)||n<0)return undefined;return Math.round(n)}
/* ---- persistence ---- */
function saveData(){dataRev++;LHStore.set(DKEY,JSON.stringify({v:5,uidNo,recs:PARTS.map(p=>({type:'part',data:{num:p.num,loc:p.loc,name:p.name,qty:p.qty,size:p.size,...(p.extra||{})},src:p.src,label:p.label,at:+p.at,uid:p.uid}))}))}
function mkPart(o){return{uid:o.uid||++uidNo,num:String(o.num).trim(),name:String(o.name||'').trim(),loc:normLoc(o.loc),qty:has(o.qty)?Math.max(0,Math.round(+o.qty)):null,
  size:SIZES.includes(o.size)?o.size:null,src:o.src||'input',label:o.label||'',at:o.at instanceof Date?o.at:new Date(+o.at||Date.now()),extra:o.extra||null}}
function loadV5(o){PARTS=[];uidNo=+o.uidNo||0;const seen=new Map();
  for(const r of o.recs||[]){if(!r||r.type!=='part'||!r.data)continue;const d=r.data;if(!String(d.num||'').trim())continue;
    const extra={};for(const k of Object.keys(d))if(!['num','loc','name','qty','size'].includes(k))extra[k]=d[k];
    const p=mkPart({uid:+r.uid||0,num:d.num,name:d.name,loc:d.loc,qty:d.qty,size:parseSize(d.size),src:r.src,label:r.label,at:r.at,extra:Object.keys(extra).length?extra:null});
    if(!r.uid)p.uid=++uidNo;uidNo=Math.max(uidNo,p.uid);const k=azNorm(p.num);if(seen.has(k))PARTS.splice(PARTS.indexOf(seen.get(k)),1);seen.set(k,p);PARTS.push(p)}
  lastChange=PARTS.length?new Date(Math.max(...PARTS.map(p=>+p.at))):null}
/* ---- v4 → v5 migration: keep parts + locations (+ quantity if a part record had one); pallet quantities are not converted;
   trucks/orders/production records are dropped from the app (the untouched v4 snapshot is kept locally in lhub.r4.v4backup). ---- */
const F={num:['num','part','part_no','part_number','partnumber','part_#','teilenummer','teile_nr','teilenr','teil','artikel','artikelnummer','artikelnr','sku','article','material','pn','номер_детали','номер','деталь','артикул'],
  loc:['loc','location','lagerort','lagerplatz','platz','bin','место','ячейка','место_хранения'],
  name:['name','bezeichnung','beschreibung','description','title','название','наименование','описание'],
  qty:['qty','quantity','menge','anzahl','stk','stück','stueck','pcs','pieces','count','количество','кол_во','кол.','колво','шт','штук'],
  size:['size','size_class','sizeclass','class','klasse','größe','groesse','grösse','größenklasse','groessenklasse','размер','класс','класс_размера']};
function getF(d,names){const lk={};for(const k of Object.keys(d))lk[k.toLowerCase().trim().replace(/[\s\-]+/g,'_')]=k;
  for(const n of names){const k=lk[n];if(k!==undefined){const v=d[k];if(v!==''&&v!==null&&v!==undefined)return v}}return undefined}
const hasF=(d,names)=>{const ks=Object.keys(d).map(k=>k.toLowerCase().trim().replace(/[\s\-]+/g,'_'));return names.some(n=>ks.includes(n))};
function migrateV4(o,rawData,rawParams){const recs=Array.isArray(o&&o.recs)?o.recs:[];const by=new Map();let fromStock=0,dropped=0;
  let sb=-1;for(const r of recs)if(r&&r.type==='stock'&&r.src!=='input'&&(+r.batch||0)>sb)sb=+r.batch||0;   // v4 used only the latest imported stock snapshot + manual rows
  for(const r of recs){if(!r||!r.data){continue}const d=r.data;
    if(r.type==='part'){const num=String(d.num||'').trim();if(!num)continue;const q=parseQty(getF(d,F.qty));
      by.set(azNorm(num),mkPart({num,name:d.name,loc:d.loc,qty:q===undefined?null:q,size:parseSize(getF(d,F.size)),src:r.src,label:r.label,at:r.at}))}
    else if(r.type==='stock'){if(r.src!=='input'&&(+r.batch||0)!==sb)continue;
      const z=String(d.zone||'').toLowerCase();if(/prod|произв|fertigung/.test(z)){dropped++;continue}
      const num=String(d.sku||d.article||d.artikel||d['артикул']||'').trim()||String(d.location||d.loc||'').trim();if(!num)continue;
      const k=azNorm(num),old=by.get(k),loc=d.location||d.loc||'';
      if(old){if(!old.loc&&loc)old.loc=normLoc(loc);continue}
      const pal=parseQty(d.qty);fromStock++;by.set(k,mkPart({num,loc,qty:null,size:null,src:r.src,label:r.label,at:r.at,extra:pal===undefined?null:{palletsV4:pal}}))}
    else dropped++}
  PARTS=[...by.values()];PARTS.forEach((p,i)=>p.uid=i+1);uidNo=PARTS.length;
  lastChange=PARTS.length?new Date(Math.max(...PARTS.map(p=>+p.at))):null;
  try{if(!LHStore.get(V4KEY))LHStore.set(V4KEY,JSON.stringify({savedAt:new Date().toISOString(),data:rawData,params:rawParams}))}catch(e){}
  LHStore.set(MKEY,JSON.stringify({from:4,at:new Date().toISOString(),parts:PARTS.length,fromStock,dropped}));saveData()}
function loadDataObj(o,rawData,rawParams){if(!o||typeof o!=='object'){PARTS=[];return}
  if(+o.v>=5)loadV5(o);else migrateV4(o,rawData,rawParams)}
{const raw=LHStore.get(DKEY);let o=null;try{o=JSON.parse(raw||'null')}catch(e){}if(o)loadDataObj(o,raw,LHStore.get(PKEY));try{LHStore.remove('lhub.r4.mode')}catch(e){}}

/* ---- params (only thresholds + GET interval remain; v4 production/sim params are dropped silently) ---- */
const NUM_KEYS=['th_rackHi','th_rackLo','arbAutoS'];
function emptyParams(){const p={};for(const k of NUM_KEYS)p[k]=null;return p}
function mergeParams(src){const p=emptyParams();if(!src||typeof src!=='object')return p;for(const k of NUM_KEYS){const raw=src[k];if(raw===null||raw===undefined||raw==='')continue;const v=+raw;if(isFinite(v))p[k]=v}return p}
let P=mergeParams((()=>{try{return JSON.parse(LHStore.get(PKEY)||'null')}catch(e){return null}})());
function saveParams(){LHStore.set(PKEY,JSON.stringify(P))}
if(LHStore.get(PKEY)&&LHStore.get(PKEY)!==JSON.stringify(P))saveParams();

/* ---- queries ---- */
const findNum=n=>{const k=azNorm(n);return PARTS.find(p=>azNorm(p.num)===k)||null};
const findUid=u=>PARTS.find(p=>p.uid===u)||null;
function sortParts(L){return L.slice().sort((a,b)=>String(a.num).localeCompare(String(b.num),undefined,{numeric:true}))}
function partsInSlot(i){return PARTS.filter(p=>slotOf(p.loc)===i)}
/* ---- change → animation events (visual only; data is already saved) ---- */
function animEvents(before,after){const ev={in:[],out:[]};
  const b=before?{uid:before.uid,num:before.num,slot:slotOf(before.loc),size:before.size,qty:before.qty}:null,a=after?{uid:after.uid,num:after.num,slot:slotOf(after.loc),size:after.size,qty:after.qty}:null;
  if(!b&&a)ev.in.push(a);
  else if(b&&!a)ev.out.push(b);
  else if(a&&b){if(a.slot!==b.slot){if(b.slot>=0)ev.out.push(b);ev.in.push(a)}
    else if(has(a.qty)&&has(b.qty)){if(a.qty>b.qty)ev.in.push(a);else if(a.qty<b.qty)ev.out.push(Object.assign({},b,{keep:true}))}
    else if(has(a.qty)&&!has(b.qty)&&a.qty>0)ev.in.push(a)}
  return ev}
function emit(ev){if(typeof stockAnim==='function'&&(ev.in.length||ev.out.length))stockAnim(ev)}
function touch(){lastChange=new Date();saveData()}
/* manual entry: returns {err} or {part,created} */
function putPart(d,uid){const num=String(d.num||'').trim();if(!num)return{err:'e_needNum'};
  const other=findNum(num);let p=uid?findUid(uid):null;
  if(p&&other&&other!==p)return{err:'e_dup'};if(!p&&other)p=other;
  const before=p?Object.assign({},p):null;const at=new Date();
  if(p){p.num=num;p.name=String(d.name||'').trim();p.loc=normLoc(d.loc);p.qty=has(d.qty)?d.qty:null;p.size=SIZES.includes(d.size)?d.size:null;p.src='input';p.label='ввод';p.at=at}
  else{p=mkPart({num,name:d.name,loc:d.loc,qty:d.qty,size:d.size,src:'input',label:'ввод',at});PARTS.push(p)}
  touch();emit(animEvents(before,p));return{part:p,created:!before}}
function delPart(uid){const i=PARTS.findIndex(p=>p.uid===uid);if(i<0)return false;const p=PARTS[i];PARTS.splice(i,1);touch();emit(animEvents(p,null));return true}
function delWhere(fn){const gone=PARTS.filter(fn);if(!gone.length)return 0;PARTS=PARTS.filter(p=>!fn(p));touch();const ev={in:[],out:[]};for(const p of gone)ev.out.push(...animEvents(p,null).out);emit(ev);return gone.length}

/* ================= IMPORT PARSING ================= */
function parseCSV(txt){txt=txt.replace(/^\ufeff/,'');const sl=txt.match(/^sep=(.)\r?\n/i);let sep;if(sl){sep=sl[1];txt=txt.slice(sl[0].length)}
  const first=txt.split(/\r?\n/)[0]||'';if(!sep)sep=(first.split(';').length>first.split(',').length)?';':(first.split('\t').length>first.split(',').length?'\t':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"'&&f==='')q=true;else if(ch===sep){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.some(v=>v.trim()!==''))rows.push(row);row=[]}else f+=ch}
  row.push(f);if(row.some(v=>v.trim()!==''))rows.push(row);return rows}
/* Arbeitzeit 'Lager' CSV (lagerCsvText): UTF-8 BOM, ';', CRLF, localized header [part number, location, name], positional columns.
   v5 accepts optional extra columns (quantity / size class) recognised by header name, or positionally as 4th = quantity, 5th = size. */
const AZ_HEADERS=[['Part number','Location','Name'],['Teilenummer','Lagerort','Bezeichnung'],['Номер детали','Место','Название'],['Référence','Emplacement','Désignation'],['Número de pieza','Ubicación','Nombre']];
function azIsHeader(r){const n=azNorm(r[0]);return AZ_HEADERS.some(h=>azNorm(h[0])===n)||/^(part ?(no|number|#)|teile?-?nr\.?|teilenummer|artikel(nummer)?|номер( детали)?|référence|reference|número|numero|pn|num)$/i.test(String(r[0]||'').trim())}
function azLooksLager(rows){return rows.length>0&&AZ_HEADERS.some(h=>azNorm(h[0])===azNorm(rows[0][0])&&azNorm(h[1])===azNorm(rows[0][1]))}
function decodeBuf(buf){const b=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){try{return new TextDecoder(lang==='ru'?'windows-1251':'windows-1252').decode(b)}catch(e2){return new TextDecoder('utf-8').decode(b)}}}
const colIdx=(hd,names)=>{const h=hd.map(x=>azNorm(x).replace(/[\s\-]+/g,'_'));for(const n of names){const i=h.indexOf(n);if(i>=0)return i}return -1};
function parseLagerRows(rows){let hd=null;if(rows.length&&azIsHeader(rows[0])){hd=rows[0];rows=rows.slice(1)}
  let qi=-1,si=-1;if(hd){qi=colIdx(hd,F.qty);si=colIdx(hd,F.size)}else{qi=3;si=4}
  const out=[];let skip=0;
  for(const r of rows){const num=String(r[0]||'').trim();if(!num){skip++;continue}
    const o={num,loc:String(r[1]||'').trim(),name:String(r[2]||'').trim()};
    if(qi>=0){const q=parseQty(r[qi]);if(q!==undefined)o.qty=q}if(si>=0){const s=parseSize(r[si]);if(s)o.size=s}out.push(o)}
  return{parts:out,skip,hasQty:hd?qi>=0:out.some(o=>o.qty!==undefined),hasSize:hd?si>=0:out.some(o=>o.size)}}
function rowsFromObjects(arr){const out=[];let skip=0,hasQty=false,hasSize=false;
  for(const d of arr){if(!d||typeof d!=='object'||Array.isArray(d)){skip++;continue}const num=getF(d,F.num);if(num===undefined||String(num).trim()===''){skip++;continue}
    const o={num:String(num).trim(),loc:String(getF(d,F.loc)||'').trim(),name:String(getF(d,F.name)||'').trim()};
    if(hasF(d,F.qty))hasQty=true;if(hasF(d,F.size))hasSize=true;const q=parseQty(getF(d,F.qty));if(q!==undefined)o.qty=q;const s=parseSize(getF(d,F.size));if(s)o.size=s;out.push(o)}
  return{parts:out,skip,hasQty,hasSize}}
function csvObjects(rows){if(rows.length<1)return[];const hd=rows[0].map(h=>h.trim());return rows.slice(1).map(r=>{const o={};hd.forEach((h,i)=>{if(h)o[h]=(r[i]||'').trim()});return o})}
/* any text (JSON or CSV) → {parts,skip,hasQty,hasSize,lager} */
function parseAny(txt){const s=txt.replace(/^\ufeff/,'').trim();if(!s)return{parts:[],skip:0,hasQty:false,hasSize:false};
  if(/^[\[{]/.test(s)){const j=JSON.parse(s);let arr=null;
    if(Array.isArray(j))arr=j;else if(j&&typeof j==='object'){for(const k of['parts','teile','детали','lager','stock','bestand','items','data'])if(Array.isArray(j[k])){arr=j[k];break}
      if(!arr){arr=[];for(const v of Object.values(j))if(Array.isArray(v))arr.push(...v);if(!arr.length)arr=[j]}}
    return rowsFromObjects(arr)}
  const rows=parseCSV(txt);if(azLooksLager(rows))return Object.assign(parseLagerRows(rows),{lager:true});
  const objs=csvObjects(rows);const r=rowsFromObjects(objs);
  if(!r.parts.length&&rows.length&&rows[0].length<=5){const l=parseLagerRows(rows);if(l.parts.length)return Object.assign(l,{lager:true})}   // headerless Arbeitzeit-like file
  return r}
/* ---- import diff (preview) and apply ---- */

function animPending(){const pal=truckQ.reduce((n,t)=>n+t.length,0)+inTrucks.reduce((n,t)=>n+(t?t.n+t.pend:0),0)+inBuf.filter(s=>s.pallet).length+fls.filter(f=>f.job).length;
  return{inn:pal,out:ghosts.filter(g=>!g.done).length}}
function flushAnim(){hiddenIn.clear();ghosts=[];truckQ.length=0;
  for(let i=0;i<3;i++)if(inTrucks[i]){animG.remove(inTrucks[i].g);inTrucks[i]=null}
  for(const s of inBuf){if(s.pallet)animG.remove(s.pallet);s.pallet=null;s.reserved=false}
  for(const f of fls){if(f.load){f.car.remove(f.load);f.load=null}f.job=null;f.steps=[];f.g.position.set(f.home.x,0,f.home.z);f.car.position.y=0.2;f.inner.position.y=0}
  for(const w of [...dockW,...logW]){if(w.load){w.g.remove(w.load);w.load=null}w.jack.visible=false;w.job=null;w.steps=[];w.g.position.set(w.home.x,0,w.home.z)}
  for(const o of [...fading])animG.remove(o);fading.clear();settling.clear();visDirty=true}
function setAnim(on){animOn=on;if(!on)flushAnim();animG.visible=on}
/* motion */
function angLerp(a,b,k){let d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return a+d*k}
function angDiff(a,b){return Math.abs(((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)}
function stopOf(s){if(s.kind==='rack')return{x:s.x,z:s.a,face:s.z<s.a?Math.PI:0};return{x:s.x,z:6.6,face:0}}
function route(p,t){const pts=[];
  if(p.z<0&&t.z<0){if(Math.abs(p.z-t.z)<0.1&&p.x>-30&&t.x>-30){pts.push({x:t.x,z:t.z});return pts}const s=t.x<0||p.x<-28?-29:29;pts.push({x:s,z:p.z},{x:s,z:t.z},{x:t.x,z:t.z});return pts}
  let cur={x:p.x,z:p.z};if(cur.z<0){const s=cur.x<0?-29:29;pts.push({x:s,z:cur.z},{x:s,z:2});cur={x:s,z:2}}else{pts.push({x:cur.x,z:2});cur={x:cur.x,z:2}}
  if(t.z<0){const s=t.x<0?-29:29;pts.push({x:s,z:2},{x:s,z:t.z},{x:t.x,z:t.z})}else{pts.push({x:t.x,z:2},{x:t.x,z:t.z})}return pts}
function flPlan(f,src,dst,uids){const a=stopOf(src),b=stopOf(dst),p=f.g.position;
  return[{t:'go',pts:route({x:p.x,z:p.z},a)},{t:'face',a:a.face},{t:'lift',y:0.05},{t:'hold',d:0.4},{t:'grab',s:src},{t:'lift',y:0.35},{t:'back',d:1.0},
    {t:'go',pts:route(a,b)},{t:'face',a:b.face},{t:'lift',y:dst.y+0.1},{t:'hold',d:0.3},{t:'drop',s:dst,uids},{t:'lift',y:0.2},{t:'back',d:1.2},{t:'done'}]}
function upFL(f,dt){const st=f.steps[0];if(!st)return;const g=f.g;
  if(st.t==='go'){let rem=8*dt;while(rem>0&&st.pts.length){const q=st.pts[0];const dx=q.x-g.position.x,dz=q.z-g.position.z,d=Math.hypot(dx,dz);if(d<1e-3){st.pts.shift();continue}
      g.rotation.y=angLerp(g.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*12));const m=Math.min(d,rem);g.position.x+=dx/d*m;g.position.z+=dz/d*m;rem-=m;if(m===d)st.pts.shift()}if(!st.pts.length)f.steps.shift()}
  else if(st.t==='face'){g.rotation.y=angLerp(g.rotation.y,st.a,Math.min(1,dt*8));if(angDiff(g.rotation.y,st.a)<0.03){g.rotation.y=st.a;f.steps.shift()}}
  else if(st.t==='lift'){const y=f.car.position.y,d=st.y-y,m=Math.sign(d)*Math.min(Math.abs(d),2.6*dt);f.car.position.y=y+m;f.inner.position.y=Math.max(0,f.car.position.y-1.4);if(Math.abs(st.y-f.car.position.y)<1e-3)f.steps.shift()}
  else if(st.t==='back'){if(st.left===undefined)st.left=st.d;const m=Math.min(st.left,3*dt);g.position.x-=Math.sin(g.rotation.y)*m;g.position.z-=Math.cos(g.rotation.y)*m;st.left-=m;if(st.left<=1e-4)f.steps.shift()}
  else if(st.t==='hold'){st.d-=dt;if(st.d<=0)f.steps.shift()}
  else if(st.t==='grab'){const p=st.s.pallet;st.s.pallet=null;st.s.reserved=false;if(p){f.car.attach(p);settle(p,new THREE.Vector3(0,0.06,0.62));f.load=p}f.steps.shift()}
  else if(st.t==='drop'){const p=f.load;f.load=null;if(p){animG.attach(p);p.position.set(st.s.x,st.s.y,st.s.z);fadeOut(p,0.6)}
    for(const u of st.uids||[])hiddenIn.delete(u);visDirty=true;f.steps.shift()}        // pallet unpacked at the slot → the part visual appears
  else if(st.t==='done'){f.steps.shift();f.job=null}}
function fadeOut(o,t){o.userData.fade=t;o.userData.fade0=t;fading.add(o)}
const WALK={in:2.3,log:2.6};
function upWorker(w,dt){const st=w.steps[0],g=w.g;let moved=0;
  if(st){if(st.t==='go'){let rem=WALK[w.crew]*(w.load?0.85:1)*dt;while(rem>0&&st.pts.length){const q=st.pts[0];const dx=q.x-g.position.x,dz=q.z-g.position.z,d=Math.hypot(dx,dz);if(d<1e-3){st.pts.shift();continue}
        g.rotation.y=angLerp(g.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*10));const m=Math.min(d,rem);g.position.x+=dx/d*m;g.position.z+=dz/d*m;rem-=m;moved+=m;if(m===d)st.pts.shift()}if(!st.pts.length)w.steps.shift()}
    else if(st.t==='face'){g.rotation.y=angLerp(g.rotation.y,st.a,Math.min(1,dt*8));if(angDiff(g.rotation.y,st.a)<0.05){g.rotation.y=st.a;w.steps.shift()}}
    else if(st.t==='wait'){st.d-=dt;if(st.d<=0)w.steps.shift()}
    else if(st.t==='fn'){w.steps.shift();st.f()}}
  let s;if(moved>0){w.phase+=moved*3.2;s=Math.sin(w.phase)*0.6}else s=w.legL.rotation.x*0.8;
  w.legL.rotation.x=s;w.legR.rotation.x=-s;if(w.load){w.armL.rotation.x=w.armR.rotation.x=-1.0}else{w.armL.rotation.x=-s*0.8;w.armR.rotation.x=s*0.8}}
function assignAnim(){
  // trucks to free inbound docks
  for(let i=0;i<3;i++)if(!inTrucks[i]&&truckQ.length){const pals=truckQ.shift();const g=TRUCK.clone();g.position.set(DOCKS_IN[i],0,95);animG.add(g);inTrucks[i]={g,pals,n:pals.length,pend:0,state:'arr'}}
  // dock workers: truck → inbound buffer
  for(const w of dockW){if(w.job)continue;const k=inTrucks.findIndex(t=>t&&t.state==='dock'&&t.n>0);const s=inBuf.find(s=>!s.pallet&&!s.reserved);
    if(k>=0&&s){const tr=inTrucks[k];const info=tr.pals[tr.pals.length-tr.n];tr.n--;tr.pend++;s.reserved=true;w.job=true;const dx=DOCKS_IN[k];
      w.steps=[{t:'go',pts:[{x:dx+(Math.random()-0.5),z:25.6}]},{t:'face',a:0},{t:'wait',d:0.8},
        {t:'fn',f:()=>{const p=makePallet();w.g.add(p);p.position.set(0,0.05,1.05);p.rotation.y=0;w.load=p;w.jack.visible=true;tr.pend--;p.userData.info=info}},
        {t:'go',pts:[{x:s.x,z:11.6}]},{t:'face',a:Math.PI},{t:'wait',d:0.3},
        {t:'fn',f:()=>{const p=w.load;w.load=null;w.jack.visible=false;animG.attach(p);settle(p,new THREE.Vector3(s.x,0,s.z));s.pallet=p;s.reserved=false;w.job=null;
          w.steps=[{t:'go',pts:[{x:w.home.x,z:w.home.z}]},{t:'face',a:Math.PI}]}}];continue}}
  // forklifts: buffer → target rack slot
  for(const f of fls){if(f.job)continue;const src=inBuf.find(s=>s.pallet&&!s.reserved&&!settling.has(s.pallet));
    if(src){const info=src.pallet.userData.info||{slot:0,uids:[]};const dst=rack[info.slot];src.reserved=true;f.job=true;f.steps=flPlan(f,src,dst,info.uids);
      f.steps.push({t:'go',pts:route(stopOf(dst),f.home)});continue}
    if(!f.steps.length){const p=f.g.position;if(Math.hypot(p.x-f.home.x,p.z-f.home.z)>0.5)f.steps=[{t:'go',pts:route({x:p.x,z:p.z},f.home)},{t:'face',a:Math.PI}]}}
  // logisticians: rack slot → «Производство» zone behind the warehouse
  for(const w of logW){if(w.job)continue;const gh=ghosts.find(g=>!g.taken);if(!gh)continue;gh.taken=true;w.job=true;const s=rack[gh.slot];const st=stopOf(s);
    const zx=PZ.x-6+Math.random()*12,zz=PZ.z-3+Math.random()*6;
    w.steps=[{t:'go',pts:[{x:-29,z:w.g.position.z},{x:-29,z:st.z},{x:st.x,z:st.z}]},{t:'face',a:st.face},{t:'wait',d:0.6},
      {t:'fn',f:()=>{gh.picked=true;visDirty=true;const m=partMesh(gh.size,gh.size==='L'?0.45:gh.size==='M'?0.6:0.8);w.g.add(m);m.position.set(0,0.95,0.38);w.load=m}},
      {t:'go',pts:[{x:-29,z:st.z},{x:-29,z:-24.5},{x:-38.6,z:-24.5},{x:-38.6,z:-31},{x:zx,z:zz}]},{t:'wait',d:0.3},
      {t:'fn',f:()=>{const m=w.load;w.load=null;animG.attach(m);settle(m,new THREE.Vector3(zx,0,zz+0.5),()=>fadeOut(m,2.5));gh.done=true;ghosts=ghosts.filter(g=>g!==gh)}},
      {t:'go',pts:[{x:-38.6,z:-31},{x:-38.6,z:-24.5},{x:w.home.x,z:-24.5},{x:w.home.x,z:w.home.z}]},{t:'face',a:Math.PI/2},{t:'fn',f:()=>{w.job=null}}]}}
function upTrucks(dt){for(let i=0;i<3;i++){const tr=inTrucks[i];if(!tr)continue;const g=tr.g;
  if(tr.state==='arr'){g.position.z=Math.max(DOCK_Z,g.position.z-14*dt);if(g.position.z===DOCK_Z)tr.state='dock'}
  else if(tr.state==='dock'){if(tr.n===0&&tr.pend===0)tr.state='out'}
  else{g.position.z+=14*dt;if(g.position.z>110){animG.remove(g);inTrucks[i]=null}}}}
function animStep(dt0){if(!animOn)return;const pend=animPending();animSpeed=Math.min(4,1+(pend.inn+pend.out)/10);const dt=dt0*animSpeed;
  assignAnim();upTrucks(dt);for(const f of fls)upFL(f,dt);for(const w of dockW)upWorker(w,dt);for(const w of logW)upWorker(w,dt);
  for(const o of settling){const t=o.userData.t,k=1-Math.exp(-9*dt);o.position.lerp(t,k);o.rotation.y*=(1-k);if(o.position.distanceTo(t)<0.01){o.position.copy(t);settling.delete(o);if(o.userData.done)o.userData.done()}}
  for(const o of fading){o.userData.fade-=dt;const k=Math.max(0,o.userData.fade/o.userData.fade0);o.scale.setScalar((o.userData.s0||(o.userData.s0=o.scale.x))*(0.2+0.8*k));if(k<=0){animG.remove(o);fading.delete(o)}}}

const QSCENES=[S];let uiReady=false;
let qMode='auto',autoLow=(()=>{try{const coarse=matchMedia('(pointer:coarse)').matches,small=Math.min(screen.width,screen.height)<=820;
  return (coarse&&small)||(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)}catch(e){return false}})();
const effQ=()=>qMode==='auto'?(autoLow?'low':'high'):qMode;
function applyQuality(){const q=effQ();R.setPixelRatio(q==='high'?Math.min(devicePixelRatio,2):Math.min(devicePixelRatio,1));
  const sh=q==='high';if(R.shadowMap.enabled!==sh){R.shadowMap.enabled=sh;for(const sc of QSCENES)sc.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true)}})}
  if(uiReady)resize()}

const HELP={ru:`<p><b>В программе нет встроенных данных и значений по умолчанию.</b> Запас ведётся <b>в деталях (шт.)</b>: номер детали, место, название, количество и класс размера S/M/L. Он меняется только ручным вводом и импортом. Машины, паллеты и погрузчики в 3D — лишь изображение этих изменений: при добавлении приезжает машина и погрузчики ставят паллеты в ячейки, где затем видна деталь; при удалении логисты выносят детали в зону «Производство» за складом. На данные анимация не влияет.</p>
<h3>Arbeitzeit → Logistik-Hub (односторонне, только чтение)</h3>
<p><b>CSV склада Arbeitzeit</b> (Склад → «Экспорт CSV», <code>lager-ГГГГ-ММ-ДД.csv</code>): UTF-8 с BOM, разделитель <code>;</code>, строки CRLF, первая строка — заголовок на языке Arbeitzeit, колонки по позиции:</p>
<table><tr><th class="l">RU</th><td class="l"><code>Номер детали;Место;Название</code></td></tr><tr><th class="l">DE</th><td class="l"><code>Teilenummer;Lagerort;Bezeichnung</code></td></tr><tr><th class="l">EN</th><td class="l"><code>Part number;Location;Name</code></td></tr></table>
<p>Необязательно можно добавить колонки <code>Количество</code> (Menge, qty, шт) и <code>Размер</code> (Größe, size, класс) — значения <code>S/M/L</code>, <code>small/medium/large</code>, <code>klein/mittel/groß</code>, <code>маленькая/средняя/большая</code>. Без класса деталь показывается «без класса» — класс не придумывается. Без количества у существующей детали количество не меняется.</p>
<p><b>«Синхронизировать с Arbeitzeit»</b> — если обе программы открыты с одного origin: читается <code>localStorage['timetracking-lager-parts']</code> (только чтение). <b>Адрес GET</b> — необязательный URL с JSON/CSV; автообновление только добавляет/обновляет.</p>
<h3>Свои CSV / JSON</h3><p>Поля (регистр не важен, RU/DE/EN): <code>num</code> (part_number, Teilenummer, артикул, sku), <code>loc</code> (location, Lagerort, место), <code>name</code> (Bezeichnung, название), <code>qty</code> (Menge, количество, шт.), <code>size</code> (Größe, размер). JSON: массив объектов или <code>{"parts":[…]}</code>.</p>
<h3>Импорт: добавить или полная инвентаризация</h3><p>Перед применением показывается предпросмотр: новые, изменённые, без изменений и «есть на складе, но нет в файле». По умолчанию ничего не удаляется; «Полная инвентаризация» удаляет со склада детали, которых нет в файле.</p>
<h3>Место</h3><p><code>R1-05-2</code> = ряд 1–4, секция 1–20, ярус 1–3 (240 ячеек). Другое место сохраняется, но в 3D не показывается.</p>`,
de:`<p><b>Das Programm enthält keine eingebauten Daten oder Standardwerte.</b> Der Bestand wird <b>in Teilen (Stk)</b> geführt: Teilenummer, Lagerort, Bezeichnung, Menge und Größenklasse S/M/L. Er ändert sich nur durch manuelle Eingabe und Import. LKW, Paletten und Stapler in 3D visualisieren nur diese Änderungen: beim Hinzufügen kommt ein LKW und Stapler bringen die Paletten an den Platz, wo danach das Teil sichtbar ist; beim Löschen tragen Logistiker die Teile in die Zone „Produktion“ hinter dem Lager. Die Animation ändert keine Daten.</p>
<h3>Arbeitzeit → Logistik-Hub (nur lesen)</h3>
<p><b>Arbeitzeit-Lager-CSV</b> (Lager → „CSV exportieren“): UTF-8 mit BOM, <code>;</code>, CRLF, Kopfzeile <code>Teilenummer;Lagerort;Bezeichnung</code> (DE), <code>Номер детали;Место;Название</code> (RU), <code>Part number;Location;Name</code> (EN). Optional zusätzliche Spalten <code>Menge</code> und <code>Größe</code> (<code>S/M/L</code>, <code>klein/mittel/groß</code>, <code>small/medium/large</code>). Ohne Klasse: „ohne Klasse“ — es wird nichts erfunden. Ohne Menge bleibt eine bestehende Menge unverändert.</p>
<p><b>„Mit Arbeitzeit synchronisieren“</b> — nur bei gleichem Origin: <code>localStorage['timetracking-lager-parts']</code> wird nur gelesen. <b>GET-Adresse</b> optional; Auto-Aktualisierung fügt nur hinzu/aktualisiert.</p>
<h3>Eigene CSV / JSON</h3><p>Felder: <code>num</code> (Teilenummer, part_number, sku), <code>loc</code> (Lagerort, location), <code>name</code> (Bezeichnung), <code>qty</code> (Menge), <code>size</code> (Größe). JSON: Array oder <code>{"parts":[…]}</code>.</p>
<h3>Import: hinzufügen oder vollständige Inventur</h3><p>Vor dem Anwenden erscheint eine Vorschau. Standard: nichts wird gelöscht; „Vollständige Inventur“ löscht Teile, die nicht in der Datei stehen.</p>
<h3>Lagerort</h3><p><code>R1-05-2</code> = Reihe 1–4, Feld 1–20, Ebene 1–3 (240 Plätze). Andere Orte werden gespeichert, aber nicht in 3D gezeigt.</p>`};

    _hit.set(s.x,s.y+0.6,s.z);const d=ray.ray.distanceSqToPoint(_hit);if(d<bd){bd=d;best=s.idx}}return best}   // among boxes on the ray: the slot whose centre the click aims at

/* ================= SCENE SWITCH ================= */
function fadeTo(fn){const f=$('fade');f.classList.add('on');setTimeout(()=>{fn();requestAnimationFrame(()=>f.classList.remove('on'))},260)}
function enterHub(){$('card').hidden=true;setHover(null);fadeTo(()=>{scene='hub';document.body.dataset.scene='hub';setView(0);camH.d=goalH.d*1.6;camH.ph=1.15;resize();applyLang()})}

/* ================= POINTER / ORBIT ================= */
const act=()=>scene==='hub'?[camH,goalH]:[camC,goalC];
const ptrs=new Map();let pinch=0,down=null;
stage.addEventListener('pointerdown',e=>{if(e.target!==R.domElement)return;stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  down=ptrs.size===1?{x:e.clientX,y:e.clientY,moved:0}:null;if(scene==='hub')stage.style.cursor='grabbing'});
stage.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
  if(!p){if(scene==='campus'&&e.pointerType==='mouse'&&e.target===R.domElement)setHover(pickAt(e.clientX,e.clientY));return}
  const [cam,goal]=act();
  if(ptrs.size===1){goal.th-=(e.clientX-p.x)*0.007;goal.ph=Math.min(1.45,Math.max(goal.phMin,goal.ph+(e.clientY-p.y)*0.005));cam.th=goal.th;cam.ph=goal.ph}
  if(down)down.moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){goal.d=Math.min(goal.max,Math.max(goal.min,goal.d*pinch/d))}pinch=d;down=null}});
const up=e=>{const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;if(!ptrs.size)stage.style.cursor=scene==='campus'&&hover?'pointer':'';
  if(had&&e.type==='pointerup'&&down&&down.moved<8){
    if(scene==='campus'){const g=pickAt(e.clientX,e.clientY);if(g){setHover(g);openBuilding(g.userData.bid)}else setHover(null)}
    else{const s=pickSlot(e.clientX,e.clientY);openSlot(s)}}
  if(!ptrs.size)down=null};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();const [,goal]=act();goal.d=Math.min(goal.max,Math.max(goal.min,goal.d*(1+Math.sign(e.deltaY)*0.1)))},{passive:false});
function placeCam(cam,goal,camera,dt){const k=1-Math.exp(-4*dt);cam.t.lerp(goal.t,k);cam.th+=(goal.th-cam.th)*k;cam.ph+=(goal.ph-cam.ph)*k;cam.d+=(goal.d-cam.d)*k;
  camera.position.set(cam.t.x+cam.d*Math.sin(cam.th)*Math.cos(cam.ph),cam.t.y+cam.d*Math.sin(cam.ph),cam.t.z+cam.d*Math.cos(cam.th)*Math.cos(cam.ph));camera.lookAt(cam.t)}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;R.setSize(w,h,false);C.aspect=C2.aspect=w/h;
  const narrow=w/h<0.9;VIEWS[0].d=narrow?150:95;VIEWS[4].d=narrow?170:105;if((vi===0||vi===4)&&viewName()===T('views')[vi])goalH.d=VIEWS[vi].d;
  if(narrow){goalC.d=Math.max(goalC.d,560);goalC.t.x=-70}C.updateProjectionMatrix();C2.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);uiReady=true;applyQuality();resize();camH.d=goalH.d;camC.d=goalC.d;
