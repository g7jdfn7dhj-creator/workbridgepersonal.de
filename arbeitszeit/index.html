  /* ================= calculator (Tools) ================= */
  function calcDecSep(){ return isEn() ? '.' : ','; }
  function calcFmt(str){
    const n = parseFloat(str);
    if(isNaN(n)) return str;
    const rounded = Math.round((n + Number.EPSILON) * 1e9) / 1e9;
    let s = String(rounded);
    if(s.length > 14) s = rounded.toPrecision(10).replace(/\.?0+$/,'');
    return s;
  }
  function calcDisp(str){
    if(calcState.error) return t('calcError');
    const s = String(str);
    return isEn() ? s : s.replace('.', ',');
  }
  function calcPaint(){
    const displayValue = document.getElementById('calcDisplayValue');
    const displaySub = document.getElementById('calcDisplaySub');
    if(!displayValue) return;
    const shown = calcDisp(calcState.current);
    displayValue.textContent = shown;
    let size = 44;
    if(shown.length > 9) size = 32;
    if(shown.length > 12) size = 24;
    displayValue.style.fontSize = size + 'px';
    if(calcState.operator && calcState.previous !== null){
      displaySub.textContent = calcDisp(calcFmt(String(calcState.previous))) + ' ' + calcState.operator;
    } else {
      displaySub.textContent = '';
    }
  }
  function calcRenderTape(){
    const entries = document.getElementById('calcTapeEntries');
    const empty = document.getElementById('calcTapeEmpty');
    if(!entries) return;
    entries.innerHTML = calcState.history.map(h =>
      '<div class="calc-tape-entry"><span class="expr">'+esc(h.expr)+'</span><span class="res">'+esc(h.res)+'</span></div>'
    ).join('');
    if(empty) empty.style.display = calcState.history.length ? 'none' : '';
  }
  function calcAddHistory(a, op, b, result){
    const loc = s => (isEn() ? calcFmt(String(s)) : calcFmt(String(s)).replace('.', ','));
    calcState.history.unshift({
      expr: loc(a) + ' ' + op + ' ' + loc(b) + ' =',
      res: result
    });
    if(calcState.history.length > 20) calcState.history.pop();
  }
  function calcOperate(op, a, b){
    switch(op){
      case '+': return a + b;
      case '\u2212': return a - b;
      case '\u00d7': return a * b;
      case '\u00f7': return b === 0 ? NaN : a / b;
    }
  }
  function calcCompute(){
    if(calcState.operator === null || calcState.previous === null) return;
    const a = calcState.previous;
    const b = parseFloat(calcState.current);
    const raw = calcOperate(calcState.operator, a, b);
    const resultStr = isNaN(raw) ? t('calcError') : calcFmt(String(raw));
    const histRes = isNaN(raw) ? t('calcError') : (isEn() ? resultStr : resultStr.replace('.', ','));
    calcAddHistory(a, calcState.operator, b, histRes);
    calcState.error = isNaN(raw);
    calcState.current = isNaN(raw) ? '0' : resultStr;
    calcState.previous = null;
    calcState.operator = null;
    calcState.overwrite = true;
  }
  function calcInputDigit(d){
    if(calcState.error){
      calcState.error = false;
      calcState.current = d;
      calcState.overwrite = false;
      return;
    }
    if(calcState.overwrite){
      calcState.current = d;
      calcState.overwrite = false;
    } else {
      calcState.current = calcState.current === '0' ? d : calcState.current + d;
    }
  }
  function calcInputDot(){
    if(calcState.error){
      calcState.error = false;
      calcState.current = '0.';
      calcState.overwrite = false;
      return;
    }
    if(calcState.overwrite){
      calcState.current = '0.';
      calcState.overwrite = false;
    } else if(calcState.current.indexOf('.') === -1){
      calcState.current += '.';
    }
  }
  function calcChooseOp(op){
    if(calcState.error){
      calcState.error = false;
      calcState.current = '0';
      calcState.overwrite = true;
    }
    if(calcState.operator !== null && !calcState.overwrite){
      calcCompute();
    }
    calcState.previous = parseFloat(calcState.current);
    calcState.operator = op;
    calcState.overwrite = true;
  }
  function calcAllClear(){
    calcState.current = '0';
    calcState.previous = null;
    calcState.operator = null;
    calcState.overwrite = true;
    calcState.error = false;
  }
  function calcBackspace(){
    if(calcState.error){ calcAllClear(); return; }
    if(calcState.overwrite) return;
    calcState.current = calcState.current.length > 1 ? calcState.current.slice(0, -1) : '0';
    if(calcState.current === '-' || calcState.current === '') calcState.current = '0';
  }
  function calcToggleSign(){
    if(calcState.error) return;
    if(calcState.current === '0') return;
    calcState.current = calcState.current.charAt(0) === '-' ? calcState.current.slice(1) : '-' + calcState.current;
  }
  function calcPercent(){
    if(calcState.error) return;
    const n = parseFloat(calcState.current);
    calcState.current = calcFmt(String(n / 100));
    calcState.overwrite = false;
  }
  function calcApply(btn){
    const digit = btn.getAttribute('data-digit');
    const op = btn.getAttribute('data-op');
    const action = btn.getAttribute('data-action');
    if(digit !== null) calcInputDigit(digit);
    else if(op !== null) calcChooseOp(op);
    else if(action === 'ac') calcAllClear();
    else if(action === 'dot') calcInputDot();
    else if(action === 'back') calcBackspace();
    else if(action === 'sign') calcToggleSign();
    else if(action === 'percent') calcPercent();
    else if(action === 'equals') calcCompute();
    calcPaint();
    calcRenderTape();
  }
  document.addEventListener('keydown', function(e){
    if(!document.getElementById('calcApp')) return;
    if(e.key >= '0' && e.key <= '9'){ calcInputDigit(e.key); }
    else if(e.key === '.' || e.key === ','){ calcInputDot(); }
    else if(e.key === '+'){ calcChooseOp('+'); }
    else if(e.key === '-'){ calcChooseOp('\u2212'); }
    else if(e.key === '*'){ calcChooseOp('\u00d7'); }
    else if(e.key === '/'){ e.preventDefault(); calcChooseOp('\u00f7'); }
    else if(e.key === 'Enter' || e.key === '='){ calcCompute(); }
    else if(e.key === 'Backspace'){ calcBackspace(); }
    else if(e.key === 'Escape'){ calcAllClear(); }
    else if(e.key === '%'){ calcPercent(); }
    else return;
    calcPaint();
    calcRenderTape();
  });

  }

  /* ================= staff journal (app-level roster) ================= */
  const staffUi = { query:'', formOpen:false, editingId:null, stamp:'' };
  const STAFF_STATUS = ['office','field','leave'];
  function staffClock(){
    const d = new Date();
    return pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function staffNowStamp(){
    const d = new Date();
    return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function rosterUid(){
    return 'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  }
  function ensureRoster(){
    if(!Array.isArray(data.roster)) data.roster = [];
    if(!Array.isArray(data.staffArchive)) data.staffArchive = [];
  }
  function normalizeStatus(s){
    const v = String(s||'').trim().toLowerCase();
    if(v==='field' || v==='в поле' || v==='im einsatz' || v==='in field') return 'field';
    if(v==='leave' || v==='отпуск' || v==='urlaub' || v==='on leave') return 'leave';
    return 'office';
  }
  function statusLabel(code){
    const c = normalizeStatus(code);
    if(c==='field') return t('stField');
    if(c==='leave') return t('stLeave');
    return t('stOffice');
  }
  function statusTone(code){
    const c = normalizeStatus(code);
    return c==='leave' ? 'warn' : (c==='field' ? 'muted' : '');
  }
  function staffInitials(name){
    const p = String(name||'').trim().split(/\s+/);
    return ((p[0]||'')[0]||'').toUpperCase() + ((p[1]||'')[0]||'').toUpperCase();
  }
  function seedRosterFromProjects(){
    ensureRoster();
    if(data.roster.length || data.staffArchive.length) return;
    const seen = {};
    (data.projects||[]).forEach(pr=>{
      (pr.staff||[]).forEach(n=>{
        const v = String(n||'').trim();
        if(v && !seen[v]){
          seen[v] = 1;
          data.roster.push({id:rosterUid(), name:v, role:'', dept:'', status:'office'});
        }
      });
    });
  }
  function staffNames(){
    ensureRoster();
    const names = [];
    data.roster.forEach(r=>{
      const n = String(r.name||'').trim();
      if(n && names.indexOf(n) < 0) names.push(n);
    });
    return names;
  }
  function upsertRoster(name, extra){
    ensureRoster();
    const n = String(name||'').trim();
    if(!n) return null;
    let rec = data.roster.find(r => String(r.name||'').trim() === n);
    if(rec){
      if(extra){
        if(extra.role != null) rec.role = extra.role;
        if(extra.dept != null) rec.dept = extra.dept;
        if(extra.status) rec.status = normalizeStatus(extra.status);
      }
      staffUi.stamp = staffClock();
      save();
      return rec;
    }
    rec = {
      id: rosterUid(),
      name: n,
      role: (extra && extra.role) || '',
      dept: (extra && extra.dept) || '',
      status: normalizeStatus((extra && extra.status) || 'office')
    };
    data.roster.push(rec);
    staffUi.stamp = staffClock();
    save();
    return rec;
  }
  function renameRosterPerson(oldName, newName){
    const oldN = String(oldName||'').trim();
    const newN = String(newName||'').trim();
    if(!oldN || !newN || oldN === newN) return;
    (data.projects||[]).forEach(pr=>{
      if(Array.isArray(pr.staff)){
        pr.staff = pr.staff.map(x => x === oldN ? newN : x);
      }
      (pr.sheets||[]).forEach(sh=>{
        if(sh.mitarbeiter === oldN) sh.mitarbeiter = newN;
      });
    });
  }
  function staffRecordsLabel(n){
    const stamp = staffUi.stamp || staffClock();
    return t('staffRecords').replace('{n}', n).replace('{t}', stamp);
  }
  function captureStaffForm(){
    const form = document.getElementById('staffEntryForm');
    if(!form || !staffUi.formOpen) return null;
    const fd = new FormData(form);
    const o = {};
    fd.forEach((v,k)=>{ o[k] = String(v); });
    return o;
  }
  function staffStatusSelect(r){
    const tone = statusTone(r.status);
    const opts = STAFF_STATUS.map(code =>
      '<option value="'+code+'"'+(normalizeStatus(r.status)===code?' selected':'')+'>'+esc(statusLabel(code))+'</option>'
    ).join('');
    return '<select class="status-select" data-tone="'+tone+'" data-action="status" data-id="'+esc(r.id)+'">'+opts+'</select>';
  }
  function staffRowActions(id, actions){
    let html = '<span class="row-actions">';
    actions.forEach(x=>{
      html += '<button type="button" class="btn-mini'+(x.cls?' '+x.cls:'')+'" data-action="'+x.a+'" data-id="'+esc(id)+'">'+esc(x.l)+'</button>';
    });
    return html + '</span>';
  }
  function staffMatches(r, q){
    if(!q) return true;
    const blob = [r.name, r.role, r.dept, statusLabel(r.status), r.archivedDate].join(' ').toLowerCase();
    return blob.indexOf(q) !== -1;
  }
  function renderStaff(){
    const host = invoiceHost();
    const draft = captureStaffForm();
    const searchPos = (function(){
      const inp = document.getElementById('staffSearch');
      if(inp && document.activeElement === inp) return inp.selectionStart;
      return null;
    })();
    ensureRoster();
    if(!staffUi.stamp) staffUi.stamp = staffClock();
    data.roster.forEach(r=>{ r.status = normalizeStatus(r.status); });

    const q = String(staffUi.query||'').toLowerCase();
    const rows = data.roster.filter(r => staffMatches(r, q));
    const archRows = (data.staffArchive||[]).filter(r => staffMatches(r, q));
    const editing = staffUi.editingId ? data.roster.find(r => r.id === staffUi.editingId) : null;
    function fieldVal(key){
      if(draft && draft[key] != null) return draft[key];
      if(editing) return editing[key] || (key==='status' ? 'office' : '');
      return key==='status' ? 'office' : '';
    }

    let formHtml = '';
    if(staffUi.formOpen){
      const statusOpts = STAFF_STATUS.map(code =>
        '<option value="'+code+'"'+(normalizeStatus(fieldVal('status'))===code?' selected':'')+'>'+esc(statusLabel(code))+'</option>'
      ).join('');
      formHtml =
        '<form class="form-panel" id="staffEntryForm">'+
          '<div class="form-grid">'+
            '<div class="field"><label>'+esc(t('staffName'))+'</label>'+
              '<input name="name" type="text" required value="'+esc(fieldVal('name'))+'"></div>'+
            '<div class="field"><label>'+esc(t('staffRole'))+'</label>'+
              '<input name="role" type="text" value="'+esc(fieldVal('role'))+'"></div>'+
            '<div class="field"><label>'+esc(t('staffDept'))+'</label>'+
              '<input name="dept" type="text" value="'+esc(fieldVal('dept'))+'"></div>'+
            '<div class="field"><label>'+esc(t('staffStatus'))+'</label>'+
              '<select name="status">'+statusOpts+'</select></div>'+
          '</div>'+
          '<div class="form-actions">'+
            '<button type="button" class="btn-add ghost" data-action="cancel-form">'+esc(t('staffCancel'))+'</button>'+
            '<button type="submit" class="btn-add primary">'+esc(editing ? t('staffSave') : t('staffAdd'))+'</button>'+
          '</div>'+
        '</form>';
    }

    let listHtml = '';
    if(!rows.length){
      if(q){
        listHtml = '<div class="empty-state"><b>'+esc(t('staffNoneFound'))+'</b>'+esc(t('staffSearch'))+'</div>';
      } else {
        listHtml = '<div class="empty-state"><b>'+esc(t('staffEmpty'))+'</b>'+esc(t('staffEmptyHint'))+'</div>';
      }
    } else {
      listHtml =
        '<ul class="cols c-staff" aria-hidden="true">'+
          '<li></li><li>'+esc(t('staffName'))+'</li><li>'+esc(t('staffRole'))+'</li>'+
          '<li>'+esc(t('staffDept'))+'</li><li>'+esc(t('staffStatus'))+'</li><li></li>'+
        '</ul>'+
        '<ol class="people p-staff">'+
          rows.map(r =>
            '<li>'+
              '<span class="mark">'+esc(staffInitials(r.name))+'</span>'+
              '<span class="name">'+esc(r.name)+'</span>'+
              '<span class="role">'+esc(r.role||'')+'</span>'+
              '<span class="dept">'+esc(r.dept||'')+'</span>'+
              staffStatusSelect(r)+
              staffRowActions(r.id, [{a:'edit',l:t('staffEdit')},{a:'archive',l:t('staffArchive')}])+
            '</li>'
          ).join('')+
        '</ol>';
    }

    let archHtml = '';
    if((data.staffArchive||[]).length){
      archHtml = '<p class="feed-title">'+esc(t('staffArchived'))+'</p>';
      if(!archRows.length){
        archHtml += '<div class="empty-state"><b>'+esc(t('staffNoneFound'))+'</b></div>';
      } else {
        archHtml +=
          '<ul class="cols c-archive" aria-hidden="true">'+
            '<li></li><li>'+esc(t('staffName'))+'</li><li>'+esc(t('staffRole'))+'</li>'+
            '<li>'+esc(t('dateLabel'))+'</li><li></li>'+
          '</ul>'+
          '<ol class="people p-archive">'+
            archRows.map(r =>
              '<li>'+
                '<span class="mark">'+esc(staffInitials(r.name))+'</span>'+
                '<span class="name">'+esc(r.name)+'</span>'+
                '<span class="role">'+esc(r.role||'')+'</span>'+
                '<span class="role a-date">'+esc(r.archivedDate||'')+'</span>'+
                staffRowActions(r.id, [{a:'restore',l:t('staffRestore')}])+
              '</li>'
            ).join('')+
          '</ol>';
      }
    }

    host.innerHTML =
      viewHead('journal','staffJournal')+
      '<div class="toolbar no-print">'+
        '<button class="btn ghost" id="staffBack" type="button">'+esc('\u2039 '+t('journal'))+'</button>'+
      '</div>'+
      '<div id="staffApp">'+
        '<header class="plate">'+
          '<div class="notch-frame">'+
            '<i class="n n-tl"></i><i class="n n-tr"></i><i class="n n-bl"></i><i class="n n-br"></i>'+
            '<p class="plate-meta"><span>'+esc(t('staffMeta'))+'</span>'+
              '<span class="sync">'+esc(staffRecordsLabel(data.roster.length))+'</span></p>'+
            '<div class="hairline"></div>'+
            '<div class="title-row">'+
              '<h1>'+esc(t('staffJournal'))+'</h1>'+
              '<div class="controls">'+
                '<label class="find"><span>'+esc(t('staffSearch'))+'</span>'+
                  '<input type="text" inputmode="search" autocomplete="off" id="staffSearch" '+
                    'placeholder="'+esc(t('staffSearchPh'))+'" value="'+esc(staffUi.query)+'"></label>'+
                '<button type="button" class="btn-add" data-action="toggle-form">'+
                  esc(staffUi.formOpen ? t('staffCancel') : t('staffAdd'))+'</button>'+
              '</div>'+
            '</div>'+
          '</div>'+
        '</header>'+
        formHtml + listHtml + archHtml +
        '<footer class="caption"><i></i><span>'+esc(t('staffList'))+'</span></footer>'+
      '</div>';

    wireHeadTools(host);
    const back = document.getElementById('staffBack');
    if(back) back.addEventListener('click', ()=>{ hubItem = ''; renderAll(); });

    const root = document.getElementById('staffApp');
    if(!root) return;

    const search = document.getElementById('staffSearch');
    if(search){
      search.addEventListener('input', ()=>{
        staffUi.query = search.value;
        const pos = search.selectionStart;
        renderStaff();
        const inp = document.getElementById('staffSearch');
        if(inp){ inp.focus(); try{ inp.setSelectionRange(pos, pos); }catch(e){} }
      });
      if(searchPos != null){
        search.focus();
        try{ search.setSelectionRange(searchPos, searchPos); }catch(e){}
      }
    }

    root.addEventListener('click', function(e){
      const btn = e.target.closest('[data-action]');
      if(!btn) return;
      const action = btn.getAttribute('data-action');
      const id = btn.getAttribute('data-id');
      if(action === 'toggle-form'){
        staffUi.formOpen = !staffUi.formOpen;
        staffUi.editingId = null;
        renderStaff();
        return;
      }
      if(action === 'cancel-form'){
        staffUi.formOpen = false;
        staffUi.editingId = null;
        renderStaff();
        return;
      }
      if(action === 'edit'){
        staffUi.editingId = id;
        staffUi.formOpen = true;
        renderStaff();
        return;
      }
      if(action === 'archive'){
        const i = data.roster.findIndex(r => r.id === id);
        if(i === -1) return;
        const rec = data.roster[i];
        data.roster.splice(i, 1);
        data.staffArchive.push({
          id: rosterUid(),
          name: rec.name,
          role: rec.role,
          dept: rec.dept,
          archivedDate: staffNowStamp()
        });
        staffUi.stamp = staffClock();
        if(staffUi.editingId === id){ staffUi.editingId = null; staffUi.formOpen = false; }
        save();
        renderStaff();
        return;
      }
      if(action === 'restore'){
        const i = data.staffArchive.findIndex(r => r.id === id);
        if(i === -1) return;
        const rec = data.staffArchive[i];
        data.staffArchive.splice(i, 1);
        data.roster.push({
          id: rosterUid(),
          name: rec.name,
          role: rec.role || '',
          dept: rec.dept || '',
          status: 'office'
        });
        staffUi.stamp = staffClock();
        save();
        renderStaff();
      }
    });

    root.addEventListener('change', function(e){
      const sel = e.target.closest('select.status-select');
      if(!sel) return;
      const rec = data.roster.find(r => r.id === sel.getAttribute('data-id'));
      if(!rec) return;
      rec.status = normalizeStatus(sel.value);
      staffUi.stamp = staffClock();
      save();
      renderStaff();
    });

    const form = document.getElementById('staffEntryForm');
    if(form){
      form.addEventListener('submit', function(e){
        e.preventDefault();
        const fd = new FormData(form);
        const name = String(fd.get('name')||'').trim();
        if(!name) return;
        const role = String(fd.get('role')||'').trim();
        const dept = String(fd.get('dept')||'').trim();
        const status = normalizeStatus(fd.get('status'));
        if(staffUi.editingId){
          const rec = data.roster.find(r => r.id === staffUi.editingId);
          if(rec){
            const oldName = rec.name;
            rec.name = name;
            rec.role = role;
            rec.dept = dept;
            rec.status = status;
            renameRosterPerson(oldName, name);
          }
        } else {
          upsertRoster(name, {role:role, dept:dept, status:status});
          const rec = data.roster.find(r => String(r.name||'').trim() === name);
          if(rec){ rec.role = role; rec.dept = dept; rec.status = status; }
        }
        staffUi.formOpen = false;
        staffUi.editingId = null;
        staffUi.stamp = staffClock();
        save();
        renderStaff();
      });
    }
  }


  load();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    try { reg.update(); } catch(e) {}
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') {
        try { reg.update(); } catch(e) {}
      }
    });
  });
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}
</script>
</body>
</html>
