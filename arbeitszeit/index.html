<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Working Hours Management</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WHM">
<meta name="theme-color" content="#1b2c4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=clock">
<style>
  :root{
    --ink:#1b2c4a;
    --ink-2:#33415c;
    --muted:#6d7484;
    --bg:#e9e6dd;
    --panel:#f7f4ec;
    --white:#fdfcf8;
    --hair:#cec8b9;
    --active:#ccd6ea;
    --gold:#b58b3c;
    --line:#1b2c4a;
    --line-strong:#1b2c4a;
    --head-bg:#e4e0d5;
    --warn:#8f2f2f;
    --sans:"Helvetica Neue",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
    -webkit-text-size-adjust:100%;
    border-top:3px solid var(--gold);
  }
  .wrap{max-width:1400px;margin:0 auto;padding:14px 14px 30px;}

  /* ---------- language ---------- */
  .lang-bar{margin-bottom:10px;}
  .lang-pill{
    display:flex; align-items:stretch; gap:0;
    background:var(--panel);
    border:1.5px solid var(--line);
    overflow:hidden;
  }
  .lang-btn{
    flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; padding:9px 2px 8px;
    background:transparent; border:none; border-right:1.5px solid var(--line);
    cursor:pointer; font-family:var(--sans);
    font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink);
  }
  .lang-btn:last-child{border-right:none;}
  .lang-btn svg{display:block; width:22px; height:15px; flex:none; border:1px solid rgba(0,0,0,.12);}
  .lang-code{line-height:1;}
  .lang-btn.active{background:var(--ink); color:#fff;}
  .lang-btn.active svg{border-color:rgba(255,255,255,.25);}

  /* ---------- projects ---------- */
  .proj-bar{margin-bottom:10px;}
  .proj-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:11px;
    background:var(--panel);border:1.5px solid var(--line);border-radius:0;
    padding:14px 18px;cursor:pointer;font-family:var(--sans);
    font-size:16px;font-weight:600;color:var(--ink);
  }
  .proj-btn svg{flex:none;}
  .proj-list{display:block;margin-bottom:14px;}
  .proj-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px;white-space:nowrap;
  }
  .proj-items{border:1.5px solid var(--line);background:var(--white);}
  .proj-card{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:100%;background:var(--white);border:none;border-bottom:1px solid var(--line);
    border-left:6px solid transparent;
    padding:16px 16px 16px 18px;cursor:pointer;font-family:var(--sans);
  }
  .proj-items .proj-card:last-child{border-bottom:none;}
  .proj-card.active{background:var(--active);border-left-color:var(--ink);}
  .proj-card .pname{
    font-size:20px;font-weight:700;color:var(--ink);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
  }
  .proj-card .pcount{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.04em;}
  .proj-card.editing{background:var(--panel);}
  .proj-card .pname-input{
    flex:1;min-width:0;font-size:19px;font-weight:700;color:var(--ink);
    border:1.5px solid var(--gold);padding:8px 10px;background:#fff;
  }
  .proj-card .pedit{
    border:1.5px solid var(--line);background:var(--panel);cursor:pointer;
    width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    padding:0;flex:none;border-radius:0;
  }
  .proj-card.active .pedit{background:var(--ink);}
  .proj-card.active .pedit svg{stroke:#fff;}

  /* ---------- nav ---------- */
  .panel{border:1.5px solid var(--line);background:var(--panel);margin-bottom:16px;}
  .nav-card{
    width:100%;display:flex;align-items:center;gap:14px;
    background:var(--panel);border:none;border-bottom:1px solid var(--line);
    border-left:6px solid transparent;
    padding:15px 16px;cursor:pointer;font-size:16px;color:var(--ink);
    text-align:left;font-family:var(--sans);font-weight:500;
  }
  .panel .nav-card:last-child{border-bottom:none;}
  .nav-card svg{flex:none;stroke:var(--ink);}
  .nav-card.active{background:var(--active);border-left-color:var(--ink);font-weight:700;}

  /* ---------- view header ---------- */
  .view-head{
    border-bottom:2px solid var(--ink);margin-bottom:10px;padding-bottom:4px;
    display:flex;align-items:flex-end;gap:10px;
  }
  .vh-text{flex:1 1 auto;min-width:0;}          /* the title may wrap; buttons never shrink it */
  .head-tools{display:flex;gap:8px;flex:none;align-self:flex-end;padding-bottom:2px;}
  .head-tool{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    min-width:52px;min-height:44px;padding:4px 6px;
    background:var(--panel);border:1.5px solid var(--line);border-radius:0;
    border-left:1.5px solid var(--line);
    cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:none;
  }
  .head-tool.active{background:var(--active);border-left:5px solid var(--ink);}
  .head-tool .ht-glyph{display:block;line-height:0;}
  .head-tool .ht-glyph svg{width:23px;height:23px;display:block;}
  .head-tool .ht-label{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    color:var(--muted);line-height:1;white-space:nowrap;
  }
  .head-tool.active .ht-label{color:var(--ink);}
  @media screen and (max-width:420px){
    .head-tool{min-width:46px;padding:4px 3px;}
    .head-tool .ht-label{font-size:9px;letter-spacing:.06em;}
  }
  .eyebrow{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
  }
  h2.view-title{font-size:21px;font-weight:700;margin:1px 0 2px;letter-spacing:-.01em;}
  p.view-sub{font-size:14px;color:var(--muted);margin:0 0 14px;}

  .card{background:var(--white);border:1.5px solid var(--line);padding:0;margin-bottom:14px;}

  /* ---------- controls ---------- */
  button.btn{
    font-family:var(--sans);font-size:15px;font-weight:600;
    border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:0;padding:12px 18px;cursor:pointer;
  }
  button.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  button.btn.ghost{background:var(--panel);}
  button.btn.danger{color:var(--warn);border-color:var(--warn);background:var(--panel);}
  button.btn.danger.confirming{background:var(--warn);color:#fff;border-color:var(--warn);}
  button.btn:active{opacity:.85;}
  button.btn.wide{width:100%;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px;}
  .toolbar .spacer{margin-left:auto;}

  .seg{display:flex;width:100%;border:1.5px solid var(--line);}
  .seg button{
    flex:1;font-family:var(--sans);font-size:13.5px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;
    background:var(--panel);border:none;padding:13px 6px;cursor:pointer;
    border-right:1.5px solid var(--line);color:var(--ink);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--ink);color:#fff;}

  /* labelled field groups */
  .fpair,.field{display:flex;flex-direction:column;gap:4px;}
  .fpair > .flab,.field-label,label.fld{
    display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);white-space:normal;
    overflow-wrap:break-word;word-break:break-word;line-height:1.35;
    margin:0 0 4px;max-width:100%;
  }
  .rowbreak{flex-basis:100%;height:0;margin:0;}
  .stepper{display:flex;gap:8px;flex:none;}
  .stepper .btn{min-width:52px;padding:12px 0;text-align:center;}
  .meta-line{
    font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;
    color:var(--muted);text-align:right;margin:0 0 8px;
  }

  input[type=text],input[type=date],input[type=time],input[type=number],input[type=month],select,textarea{
    font-family:var(--sans);font-size:15px;color:var(--ink);
    border:1.5px solid var(--line);border-radius:0;padding:11px 10px;width:100%;
    background:var(--white);
  }
  select{background:var(--white);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-2px;}

  /* date fields: we draw the text so it follows the app language */
  .datefield{position:relative;display:flex;align-items:stretch;
    width:100%;max-width:100%;overflow:hidden;}
  .datefield > input[type=date]{
    width:100%;min-width:0;max-width:100%;
    -webkit-appearance:none;appearance:none;color:transparent;
  }
  .datefield > input[type=date]::-webkit-datetime-edit{opacity:0;}
  .datefield > input[type=date]::-webkit-calendar-picker-indicator{opacity:.5;}
  .timefield{position:relative;display:flex;align-items:stretch;width:100%;overflow:hidden;}
  .timefield > input[type=time]{
    width:100%;min-width:0;-webkit-appearance:none;appearance:none;color:transparent;
  }
  .timefield > input[type=time]::-webkit-date-and-time-value{opacity:0;}
  .timefield > input[type=time]::-webkit-calendar-picker-indicator{display:none;}
  .tflabel{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;font-size:13px;color:var(--ink);white-space:nowrap;
  }
  .dflabel{
    position:absolute;left:0;top:0;bottom:0;right:26px;
    display:flex;align-items:center;padding:0 10px;
    pointer-events:none;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;
  }

  .grid{display:grid;gap:12px;}
  .grid > *{min-width:0;}
  .g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));}
  .g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));}

  /* ---------- sheet list ---------- */
  .sheet-list{border:1.5px solid var(--line);background:var(--white);}
  .sheet-item{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    border:none;border-bottom:1px solid var(--hair);
    padding:14px 16px;background:var(--white);
  }
  .sheet-list .sheet-item:last-child{border-bottom:none;}
  .sheet-item .who{font-weight:700;font-size:16px;flex:1 1 170px;}
  .sheet-item .meta{font-family:var(--mono);font-size:12px;color:var(--muted);flex:1 1 100%;letter-spacing:.03em;}
  .sheet-item .hrs{font-family:var(--mono);font-weight:700;min-width:74px;text-align:right;}

  .empty{
    background:var(--white);border:1.5px solid var(--line);
    padding:56px 24px;text-align:center;margin-bottom:14px;
  }
  .empty-title{font-size:17px;font-weight:700;color:var(--ink);}
  .empty-desc{font-size:14px;color:var(--muted);margin-top:6px;white-space:pre-line;}

  /* ---------- tables ---------- */
  .table-wrap{overflow:auto;max-height:70vh;border:1.5px solid var(--line);background:var(--white);-webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse;width:100%;}
  th,td{border:1px solid var(--hair);padding:8px 6px;font-size:13px;text-align:center;white-space:nowrap;}
  thead th{
    background:var(--head-bg);position:sticky;top:0;z-index:3;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;
    font-weight:700;border-bottom:1.5px solid var(--line);
  }
  th.weekend,td.weekend{background:#efece3;}
  td.name-cell,th.name-cell{
    position:sticky;left:0;z-index:2;background:var(--white);text-align:left;
    min-width:160px;font-weight:600;border-right:1.5px solid var(--line);
  }
  thead th.name-cell{z-index:4;background:var(--head-bg);}
  td.total-cell,th.total-cell{
    position:sticky;right:0;z-index:2;background:var(--panel);
    font-family:var(--mono);font-weight:700;min-width:80px;
    border-left:1.5px solid var(--line);
  }
  thead th.total-cell{z-index:4;background:var(--head-bg);}
  tr.sum-row td{background:var(--active);font-weight:700;border-top:1.5px solid var(--line);}
  tr.sum-row td.name-cell{background:var(--active);}
  td.money-cell,th.money-cell{position:static;box-shadow:none;min-width:104px;}

  /* ---------- report ---------- */
  .report{background:var(--white);border:1.5px solid var(--line);padding:20px 18px;}
  .report h3{
    font-size:16px;margin:26px 0 4px;border-bottom:2px solid var(--ink);padding-bottom:5px;
    letter-spacing:.02em;
  }
  .report h3:first-of-type{margin-top:4px;}
  .report h4{
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    margin:16px 0 6px;color:var(--ink-2);
  }
  .report table{margin-bottom:6px;}
  .report th,.report td{text-align:left;padding:7px 8px;border:1px solid var(--hair);}
  .report thead th{position:static;}
  .report td.num,.report th.num{text-align:right;width:120px;font-family:var(--mono);}
  .report .kw-total{font-size:13.5px;font-weight:700;margin:8px 0 0;}
  .report .kw-extra{
    font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:2px 0 0;
    letter-spacing:.03em;
  }
  .rep-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .report .kw-total span{font-weight:400;color:var(--muted);font-family:var(--mono);font-size:12px;}
  .report .grand{margin-top:26px;padding-top:14px;border-top:2px solid var(--ink);}

  /* ---------- timesheet document ---------- */
  .doc{background:var(--white);border:1.5px solid var(--line);padding:16px;}
  .doc h1{font-size:18px;margin:0 0 12px;letter-spacing:-.01em;}
  .doc .box{border:1.5px solid var(--line);margin-bottom:10px;}
  .doc .box-head{
    background:var(--head-bg);font-family:var(--mono);font-weight:700;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:6px 8px;border-bottom:1.5px solid var(--line);
  }
  .doc .box-body{padding:8px;}
  .doc table.kv{width:100%;border-collapse:collapse;}
  .doc table.kv td{border:1px solid var(--line);padding:0;}
  .doc table.kv td.lbl{
    background:var(--head-bg);font-family:var(--mono);font-weight:700;width:170px;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;
  }
  .doc table.kv input{border:none;}
  .doc .az{border-collapse:collapse;width:100%;min-width:1020px;}
  .doc .az th,.doc .az td{border:1px solid var(--line);padding:0;font-size:12px;}
  .doc .az thead th{background:var(--head-bg);padding:6px 4px;position:static;}
  .doc .az td input{border:none;text-align:center;padding:7px 3px;}
  .doc .az td.taet{min-width:240px;}
  .doc .az td.taet input{text-align:left;}
  .doc .az td.std{background:var(--panel);font-family:var(--mono);font-weight:700;text-align:center;padding:7px 3px;}
  .doc .datefield{width:100%;}
  .doc .az .dflabel{right:20px;padding:0 3px;justify-content:center;font-size:12px;}
  .doc .az td:first-child{min-width:126px;}
  .doc .gesamt{
    display:flex;justify-content:flex-end;gap:12px;align-items:center;
    margin:12px 0 4px;font-weight:700;
  }
  .doc .gesamt .val{
    border:1.5px solid var(--line);padding:8px 18px;min-width:84px;text-align:center;
    background:var(--active);font-family:var(--mono);
  }
  .doc .allg-row{display:flex;gap:0;align-items:stretch;}
  .doc .allg-row input.main{flex:1;border:none;}
  .doc .allg-row input.small{width:92px;text-align:center;border:none;border-left:1px solid var(--line);}
  .doc .sig-section{display:flex;flex-wrap:wrap;gap:22px;margin-top:26px;}
  .doc .sig-block{flex:1 1 260px;}
  .doc .ort-datum{flex:1 1 190px;}
  .doc .ort-datum input,.doc .ort-datum .datefield{margin-bottom:8px;}
  .doc .sig-pad{
    border:none;border-bottom:1.5px solid var(--line);
    width:100%;height:96px;touch-action:none;background:var(--white);display:block;cursor:crosshair;
  }
  .doc .sig-caption{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
    color:var(--muted);margin-top:4px;
  }
  .doc .sig-name{margin-top:12px;}
  .doc .sig-name input{border:none;border-bottom:1.5px solid var(--line);}
  .doc .sig-clear{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    background:var(--panel);border:1.5px solid var(--line);border-radius:0;
    padding:4px 10px;cursor:pointer;margin-top:6px;color:var(--ink);
  }

  /* validation */
  .warnbox{
    border:1.5px solid var(--warn);background:#fbf2f2;
    padding:12px 14px;margin-bottom:12px;
  }
  .warnbox-title{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--warn);font-weight:700;margin-bottom:4px;
  }
  .warnbox ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink);}
  .doc .az tr.row-bad td{background:#fbf2f2;}
  .doc .az tr.row-bad td.c-date input,.doc .az tr.row-bad td.c-pause input{box-shadow:inset 0 0 0 2px var(--warn);}

  /* On a phone the five time columns fill the screen; the rest scrolls sideways
     inside the table, so the header keeps lining up with its columns. */
  @media screen and (max-width:760px){
    /* fixed layout: the declared column widths win over the intrinsic
       width of the date/time controls, which would otherwise stretch the cells */
    .doc .az{min-width:0;width:944px;table-layout:fixed;}
    .doc .az td input,.doc .az td select{
      min-width:0;width:100%;-webkit-appearance:none;appearance:none;
    }
    .doc .az td input[type=time]::-webkit-date-and-time-value{text-align:center;margin:0;}
    .doc .az th,.doc .az td{font-size:11.5px;}
    .doc .az td input{font-size:13px;padding:8px 1px;}
    .doc .az .dflabel{font-size:11px;right:16px;}
    .doc .az col.c-date{width:92px;}
    .doc .az col.c-von,.doc .az col.c-bis{width:56px;}
    .doc .az col.c-pause{width:46px;}
    .doc .az col.c-std{width:62px;}
    .doc .az col.c-rate{width:70px;}
    .doc .az col.c-sum{width:84px;}
    /* the hours heading must stay readable, so let it wrap instead of clipping */
    .doc .az thead th{white-space:normal;line-height:1.15;}
    .doc .az col.c-extra{width:104px;}
    .doc .az col.c-taet{width:170px;}
    .doc .az td,.doc .az th{min-width:0;overflow:hidden;}
    /* two label+value pairs per line leave no room for the values on a phone */
    .doc table.kv,.doc table.kv tbody,.doc table.kv tr,.doc table.kv td{display:block;width:auto;}
    .doc table.kv td{border:none;border-bottom:1px solid var(--line);}
    .doc table.kv td.lbl{width:auto;border-bottom:none;padding:6px 8px 2px;}
    .doc table.kv tr{border-bottom:1.5px solid var(--line);}
    .doc table.kv tr:last-child{border-bottom:none;}
  }

  .hint{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:8px 0 0;letter-spacing:.03em;}
  .pay-row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0;justify-content:flex-end;}
  .pay-cell{
    display:flex;flex-direction:column;gap:3px;min-width:110px;
    border:1.5px solid var(--line);background:var(--panel);padding:7px 10px;
  }
  .pay-cell input{border:none;background:transparent;padding:2px 0;font-size:15px;}
  .pay-val{font-family:var(--mono);font-size:15px;padding:3px 0;min-height:21px;}
  .pay-val.strong{font-weight:700;}
  .settings-card{padding:14px;background:var(--panel);border:1.5px solid var(--line);margin-bottom:14px;}

  /* ---------- footer ---------- */
  .app-footer{
    display:flex;justify-content:space-between;gap:12px;
    border-top:1px solid var(--hair);margin-top:22px;padding-top:10px;
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);
  }

  /* ---------- hubs (Journal / Tools) ---------- */
  .hub-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    max-width:420px;
    margin:6px 0 18px;
  }
  .hub-tile{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    aspect-ratio:1;min-height:120px;
    background:var(--panel);border:1.5px solid var(--line);border-radius:0;

  /* ---------- calculator (Tools) ---------- */
  #calcApp{

    --journal-bg:#F5F0E4;
    --journal-border:#C9A24B;
    --journal-text:#2A2A28;
    --journal-muted:#A79E8C;
    --navy:#1C2A3A;
    --navy-2:#223244;
    --gold:#CBA43B;
    --gold-dim:#7C7048;
    --red-dash:#B7503C;

    --cream-text:#1C2A3A;
    --orange:#C15E30;
    display:flex;
    align-items:stretch;
    gap:20px;
    max-width:740px;

  #calcApp .calc-tape{

    width:280px;
    flex-shrink:0;
    padding:22px 20px;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  #calcApp .calc-tape::after{
    content:"";
    position:absolute;
    top:22px; bottom:22px; right:10px;
    border-right:1.5px dashed var(--journal-border);
  }
  #calcApp .calc-tape-dots{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  #calcApp .calc-tape-dots span{
    width:8px; height:8px;
    border-radius:50%;
    border:1.5px solid var(--journal-text);
  }
  #calcApp .calc-tape-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:lowercase;
    color:var(--journal-text);
    margin-bottom:16px;
  }
  #calcApp .calc-tape-entries{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-right:14px;
  }
  #calcApp .calc-tape-entry{
    font-size:12px;
    line-height:1.5;
    color:var(--journal-text);
    padding-bottom:10px;
    border-bottom:1px dashed #DBD2BC;
  }
  #calcApp .calc-tape-entry .expr{
    display:block;
    color:var(--journal-muted);
    font-size:11px;
  }
  #calcApp .calc-tape-entry .res{
    display:block;
    font-weight:700;
    font-size:15px;
    margin-top:2px;
  }
  #calcApp .calc-tape-empty{
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--journal-muted);
    text-align:center;
    padding-top:12px;
    margin-top:auto;
  }
  #calcApp .calc{
    background:var(--navy);
    border-radius:14px;
    padding:20px 20px 22px;
    flex:1;
    min-width:0;
  }
  #calcApp .ticket-dashes{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  #calcApp .ticket-dashes span{
    height:0;
    border-top:1.5px dashed var(--gold-dim);
    flex:1;
  }
  #calcApp .ticket-dashes span:nth-child(3){ flex:0.4; }
  #calcApp .display{
    position:relative;
    margin:0 2px 18px;
    padding:16px 18px 20px;
  }
  #calcApp .display .corner{
    position:absolute;
    width:14px; height:14px;
  }
  #calcApp .corner.tl{ top:0; left:0; border-top:1.5px solid var(--gold); border-left:1.5px solid var(--gold); }
  #calcApp .corner.tr{ top:0; right:0; border-top:1.5px solid var(--gold); border-right:1.5px solid var(--gold); }
  #calcApp .corner.bl{ bottom:0; left:0; border-bottom:1.5px solid var(--gold); border-left:1.5px solid var(--gold); }
  #calcApp .corner.br{ bottom:0; right:0; border-bottom:1.5px solid var(--gold); border-right:1.5px solid var(--gold); }
  #calcApp .display-dash{
    height:0;
    border-top:1.5px dashed var(--red-dash);
    margin:8px 0 40px;
  }
  #calcApp .display-sub{
    text-align:right;
    color:#8FA0B3;
    font-size:14px;
    min-height:18px;
    margin-bottom:2px;
    letter-spacing:0.02em;
  }
  #calcApp .display-value{
    text-align:right;
    color:#F5F1E7;
    font-weight:700;
    font-size:44px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #calcApp .keys{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  #calcApp button.key{
    border:none;
    border-radius:6px;
    font-size:19px;
    font-weight:700;
    padding:16px 0;
    cursor:pointer;
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
    transition:transform .06s ease, filter .12s ease;
  }
  #calcApp button.key:active{ transform:scale(0.96); filter:brightness(0.95); }
  #calcApp button.key.key-num{
    background:var(--cream);
    color:var(--cream-text);
  }
  #calcApp button.key.key-op{
    background:var(--navy-2);
    color:#F5F1E7;
    border:1.5px solid var(--gold-dim);
  }
  #calcApp button.key.key-ac{
    background:var(--orange);
    color:#FBF3EA;
  }
  #calcApp button.key.key-eq{
    background:var(--gold);
    color:var(--navy);
  }
  @media (max-width:560px){
    #calcApp{ flex-direction:column-reverse; }
    #calcApp .calc-tape{ width:100%; max-height:220px; }
    #calcApp .calc-tape::after{ display:none; }
    #calcApp .calc-tape-entries{ padding-right:4px; }
  }

  /* ================= helpers ================= */
  const pad = n => n<10 ? '0'+n : ''+n;

  const isEn = () => lang==='en';
  function fmt(h){
    if(!h || isNaN(h)) return '';
    const r = Math.round(h*100)/100;
    const s = (r%1===0 ? r.toFixed(0) : r.toFixed(2));
    return isEn() ? s : s.replace('.',',');
  }
  function fmtMoney(v){
    if(v === null || v === undefined || isNaN(v)) return '';
    const n = Math.round(v*100)/100;
    const parts = Math.abs(n).toFixed(2).split('.');
    const grouped = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, isEn() ? ',' : '.');
    const body = isEn() ? grouped+'.'+parts[1] : grouped+','+parts[1];
    return (n<0?'-':'') + body + ' \u20ac';
  }
  function fmt0(h){
    if(!h || isNaN(h)) h = 0;
    const r = Math.round(h*100)/100;
    const s = (r%1===0 ? r.toFixed(0) : r.toFixed(2));
    return isEn() ? s : s.replace('.',',');
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function dmy(isoStr){
    if(!isoStr) return '';
    const p = isoStr.split('-');
    if(lang==='en') return p[1]+'/'+p[2]+'/'+p[0];
    if(lang==='fr' || lang==='es') return p[2]+'/'+p[1]+'/'+p[0];
    return p[2]+'.'+p[1]+'.'+p[0];
  }

  function locale(){
    if(lang==='de') return 'de';
    if(lang==='ru') return 'ru';
    if(lang==='fr') return 'fr';
    if(lang==='es') return 'es';
    return 'en';
  }

  function isoWeek(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr+'T00:00:00');
    if(isNaN(d)) return null;
    const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = x.getUTCDay() || 7;
    x.setUTCDate(x.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(x.getUTCFullYear(),0,1));
    const week = Math.ceil((((x - yearStart)/86400000)+1)/7);
    return { year:x.getUTCFullYear(), week:week, key:x.getUTCFullYear()+'-W'+pad(week) };
  }

  function rowHours(r){
    if(!r.von || !r.bis) return 0;
    const [vh,vm] = r.von.split(':').map(Number);
    const [bh,bm] = r.bis.split(':').map(Number);
    let mins = (bh*60+bm)-(vh*60+vm);
    if(mins < 0) mins += 1440;
    mins -= (parseFloat(String(r.pause||'0').replace(',','.'))||0)*60;
    return mins > 0 ? mins/60 : 0;
  }
  const sheetHours = s => (s.rows||[]).reduce((a,r)=>a+rowHours(r), 0);
  const num = v => parseFloat(String(v==null?'':v).replace(',','.')) || 0;
  // Money is typed by hand, so accept both 18,5 and 18.5. When both separators
  // appear (1.234,56 / 1,234.56) the last one is the decimal point and the other
  // is grouping. An empty cell stays empty — null, never 0.
  function parseMoney(v){
    let raw = String(v == null ? '' : v).replace(/[\s\u00a0\u20ac]/g, '').trim();
    if(!raw) return null;
    const lastComma = raw.lastIndexOf(','), lastDot = raw.lastIndexOf('.');
    if(lastComma >= 0 && lastDot >= 0){
      const dec = Math.max(lastComma, lastDot);
      raw = raw.slice(0, dec).replace(/[.,]/g, '') + '.' + raw.slice(dec+1);
    } else if(lastComma >= 0){
      raw = raw.replace(',', '.');
    }
    const n = parseFloat(raw);
    return isNaN(n) ? null : n;
  }
  // what an input shows: decimal separator of the language, no grouping and no
  // currency sign, so the field round-trips cleanly when edited again
  function moneyInput(v){
    const n = parseMoney(v);
    if(n === null) return '';
    const str = String(Math.round(n*100)/100);
    return isEn() ? str : str.replace('.', ',');
  }
  // A row is paid by whatever stands in its own Summe cell.
  function rowMoney(r){ return parseMoney(r && r.sum); }
  // Summe follows Stunden x €/h until the user types over it; from then on the
  // typed figure stands, until the rate on that row is changed again.
  function autoSum(r){
    if(r.sumAuto === false) return;
    const rate = parseMoney(r.rate);
    const h = rowHours(r);
    if(rate === null || h <= 0){ r.sum = ''; return; }
    r.sum = String(Math.round(h * rate * 100) / 100);
  }
  function sheetMoney(s){
    let total = null;
    (s.rows||[]).forEach(r=>{ total = addMoney(total, rowMoney(r)); });
    return total;
  }
  function sheetDateRange(s){
    const ds = (s.rows||[]).map(r=>r.date).filter(Boolean).sort();
    return ds.length ? {from:ds[0], to:ds[ds.length-1]} : null;
  }

  function updateDateLabel(inp){
    const lab = inp.parentElement && inp.parentElement.querySelector('.dflabel');
    if(!lab) return;
    lab.textContent = inp.value ? dmy(inp.value) : '';

  function updateTimeLabel(inp){
    const lab = inp.parentElement && inp.parentElement.querySelector('.tflabel');

  // a German timesheet needs 24h times; the native control would follow the device locale
  function localizeTimeInputs(root){
    if(!root) return;
    root.querySelectorAll('input[type=time]').forEach(inp=>{
      if(inp.parentElement && inp.parentElement.classList.contains('timefield')){
        updateTimeLabel(inp); return;

      const wrap = document.createElement('span');
      wrap.className = 'timefield';
      inp.parentNode.insertBefore(wrap, inp);

      wrap.appendChild(lab);
      inp.addEventListener('input', ()=>updateTimeLabel(inp));
      inp.addEventListener('change', ()=>updateTimeLabel(inp));
      updateTimeLabel(inp);

  }

  async function load(){
    try{
      const res = await storage.get(KEY, false);
      if(res && res.value){
        const p = JSON.parse(res.value);
        if(p && p.lang && I18N[p.lang]) lang = p.lang;
        if(p && p.seller && typeof p.seller === 'object') data.seller = p.seller;
        if(p && Array.isArray(p.roster)) data.roster = p.roster;
        if(p && Array.isArray(p.staffArchive)) data.staffArchive = p.staffArchive;
        if(p && Array.isArray(p.partners)) data.partners = p.partners;
        if(p && Array.isArray(p.projects) && p.projects.length){
          data.projects = p.projects;
          data.active = p.active || p.projects[0].id;
        } else if(p && Array.isArray(p.sheets)){
          // migrate the previous single-workspace format into project 1
          data.projects = makeProjects();
          data.projects[0].sheets = p.sheets;
          data.active = data.projects[0].id;
        }
      }
    }catch(e){ /* first run */ }
    try{
      const r2 = await storage.get(KEY_SIG, false);
      if(r2 && r2.value){ const parsed = JSON.parse(r2.value); if(parsed && typeof parsed==='object') sigs = parsed; }
    }catch(e){ /* no signatures yet */ }
    // an earlier build had one rate for the whole sheet; push it down to the rows
    data.projects.forEach(pr=>{
      delete pr.rates;
      (pr.sheets||[]).forEach(sh=>{
        const old = String(sh.rate == null ? '' : sh.rate).trim();
        (sh.rows||[]).forEach(r=>{
          if(r.sumAuto === undefined) r.sumAuto = true;
          if(r.rate === undefined) r.rate = '';
          if(r.sum === undefined) r.sum = '';
          if(old && !String(r.rate).trim() && rowHours(r) > 0){ r.rate = old; autoSum(r); }
        });
        delete sh.rate;
      });
    });

    // an earlier build kept travel/km/flat on each row; roll them up to the sheet
    data.projects.forEach(pr=>(pr.sheets||[]).forEach(sh=>{
      let fa=0, km=0, pa=0, moved=false;
      (sh.rows||[]).forEach(r=>{
        if(r.fahrt!==undefined || r.km!==undefined || r.pausch!==undefined){
          fa+=num(r.fahrt); km+=num(r.km); pa+=num(r.pausch); moved=true;
          delete r.fahrt; delete r.km; delete r.pausch;
        }
      });
      if(moved){
        if(!num(sh.fahrt) && fa)  sh.fahrt  = String(fa);
        if(!num(sh.km)    && km)  sh.km     = String(km);
        if(!num(sh.pausch)&& pa)  sh.pausch = String(pa);
      }
      if(sh.fahrt===undefined) sh.fahrt='';
      if(sh.km===undefined) sh.km='';
      if(sh.pausch===undefined) sh.pausch='';
    }));

    // signatures written by an older build lived on the sheet itself
    data.projects.forEach(pr=>(pr.sheets||[]).forEach(sh=>{
      if(sh.sigEmpData || sh.sigCliData){
        const box = sigOf(sh.id);
        box.emp = box.emp || sh.sigEmpData || '';
        box.cli = box.cli || sh.sigCliData || '';
        delete sh.sigEmpData; delete sh.sigCliData;
      }
    }));
    if(!data.projects.length){
      data.projects = makeProjects();
      data.active = data.projects[0].id;
    }
    ensureRoster();
    ensurePartners();
    seedRosterFromProjects();
    (data.roster||[]).forEach(r=>{ r.status = normalizeStatus(r.status); });
    applyLang();
  }

  // correct plural form of "sheets" for the active language
  function sheetsWord(n){
    if(lang==='en') return n===1 ? 'sheet' : 'sheets';
    if(lang==='de') return n===1 ? 'Tabelle' : 'Tabellen';
    if(lang==='fr') return n===1 ? 'feuille' : 'feuilles';
    if(lang==='es') return n===1 ? 'hoja' : 'hojas';
    const m100 = n % 100, m10 = n % 10;
    if(m100 >= 11 && m100 <= 14) return 'таблиц';
    if(m10 === 1) return 'таблица';
    if(m10 >= 2 && m10 <= 4) return 'таблицы';
    return 'таблиц';
  }

  /* ================= file export ================= */
  // German/Russian Excel expects ';' and a decimal comma; English builds use ',' and '.'
  const csvSep = () => (isEn() ? ',' : ';');
  function csvMoney(v){ return (v === null || v === undefined) ? '' : csvNum(v); }
  function csvNum(v){
    if(v === '' || v === null || v === undefined || isNaN(v)) return '';
    const n = Math.round(Number(v)*100)/100;
    const str = (n % 1 === 0) ? String(n) : n.toFixed(2);
    return isEn() ? str : str.replace('.', ',');
  }
  function csvCell(v){
    const str = String(v === null || v === undefined ? '' : v);
    return /["\n\r;,\t]/.test(str) ? '"'+str.replace(/"/g,'""')+'"' : str;
  }
  function csvRows(rows){
    const sep = csvSep();
    return rows.map(r=>r.map(csvCell).join(sep)).join('\r\n');
  }
  function download(filename, text, mime){
    // the BOM is what makes Excel read UTF-8 umlauts correctly
    const blob = new Blob(['\uFEFF'+text], {type:(mime||'text/csv')+';charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }
  function stamp(){
    const d = new Date();
    return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  }
  function safeName(x){ return String(x||'').replace(/[^\w\u00c0-\u024f-]+/g,'_').slice(0,40) || 'export'; }

  /* ================= PDF export (html2pdf, no window.print on iPhone) ================= */
  let pdfBusy = false;
  function pdfValOf(inp){
    const type = (inp.type||'').toLowerCase();
    if(type==='date'){
      const lab = inp.parentElement && inp.parentElement.querySelector('.dflabel');
      if(lab && lab.textContent.trim()) return lab.textContent.trim();
      return inp.value ? dmy(inp.value) : '';
    }
    if(type==='time'){
      const lab = inp.parentElement && inp.parentElement.querySelector('.tflabel');
      if(lab && lab.textContent.trim()) return lab.textContent.trim();
      return inp.value || '';
    }
    if(inp.tagName==='SELECT'){
      const opt = inp.options[inp.selectedIndex];
      if(!opt || opt.value==='' || opt.value==='__new__') return '';
      return (opt.textContent||'').trim();
    }
    return inp.value || '';
  }
  function preparePdfClone(clonedDoc, srcEl){
    const style = clonedDoc.createElement('style');
    style.textContent =
      '.no-print{display:none !important;}'+
      '.doc,.report,#allPrintDoc,.table-wrap{width:100% !important;max-width:100% !important;overflow:visible !important;max-height:none !important;}'+
      '.doc [style*="overflow"]{overflow:visible !important;width:100% !important;max-width:100% !important;}'+
      '.doc .az{min-width:0 !important;width:100% !important;table-layout:fixed !important;font-size:8px !important;}'+
      '.doc .az th,.doc .az td{min-width:0 !important;overflow:hidden !important;font-size:8px !important;padding:2px 1px !important;word-wrap:break-word;}'+
      '.doc .az thead th{font-size:7.5px !important;line-height:1.15;white-space:normal !important;}'+
      '.doc .az td input,.doc .az td select{font-size:8px !important;padding:2px 1px !important;min-width:0 !important;width:100% !important;}'+
      '.doc .az col.c-date{width:12%;}'+
      '.doc .az col.c-von,.doc .az col.c-bis{width:7%;}'+
      '.doc .az col.c-pause{width:6%;}'+
      '.doc .az col.c-std{width:7%;}'+
      '.doc .az col.c-rate{width:7%;}'+
      '.doc .az col.c-sum{width:8%;}'+
      '.doc .az col.c-extra{width:9%;}'+
      '.doc .az col.c-taet{width:19%;}'+
      '.doc .az td:first-child,.doc .az td.taet{min-width:0 !important;}'+
      '.pdf-val{display:block;width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit;color:inherit;text-align:inherit;padding:3px 1px;}'+
      'td.taet .pdf-val,td.c-extra .pdf-val{white-space:normal;word-break:break-word;}'+
      '.datefield.pdf-flat,.timefield.pdf-flat{position:static;display:block;overflow:visible;}'+
      '.table-wrap table,.report table{width:100% !important;table-layout:fixed !important;font-size:8px !important;}'+
      '.table-wrap th,.table-wrap td,.report th,.report td{font-size:8px !important;padding:2px 1px !important;overflow:hidden;}'+
      '.sig-pad{background:#fff;display:block;}'+
      '#invoiceDoc{width:100% !important;max-width:100% !important;box-shadow:none !important;margin:0 !important;overflow:visible !important;}'+
      '#invoiceDoc .pdf-val{white-space:normal;overflow:visible;text-overflow:clip;}'+
      '#invoiceDoc .inv-header .pdf-val.inv-company{color:#fff;font-size:19px;font-weight:700;}'+
      '#invoiceDoc .inv-header .pdf-val.inv-tagline{color:#E8D6A8;font-size:12px;font-weight:400;margin-top:4px;}'+
      '#invoiceDoc table.inv-items{display:table !important;width:100% !important;table-layout:auto !important;}'+
      '#invoiceDoc .inv-add-wrap,#invoiceDoc .inv-del-cell{display:none !important;}';
    (clonedDoc.head || clonedDoc.documentElement).appendChild(style);

    const root = (srcEl && srcEl.id && clonedDoc.getElementById(srcEl.id)) || clonedDoc.body;
    if(!root) return;
    root.querySelectorAll('.no-print').forEach(n=>{ n.style.display = 'none'; });
    root.querySelectorAll('div').forEach(d=>{
      const st = d.getAttribute('style')||'';
      if(/overflow-x\s*:\s*auto/i.test(st) || /overflow\s*:\s*auto/i.test(st)){
        d.style.overflow = 'visible';
        d.style.width = '100%';
        d.style.maxWidth = '100%';
      }
    });
    const az = root.querySelector('.az');
    if(az){
      az.style.width = '100%';
      az.style.minWidth = '0';
      az.style.tableLayout = 'fixed';
    }

    srcEl.querySelectorAll('canvas').forEach(src=>{
      const dst = src.id ? clonedDoc.getElementById(src.id) : null;
      if(!dst || !dst.parentNode) return;
      try{
        const img = clonedDoc.createElement('img');
        img.src = src.toDataURL('image/png');
        img.className = ((src.getAttribute('class')||'')+' sig-pad').trim();
        img.alt = '';
        const r = src.getBoundingClientRect();
        img.style.width = '100%';
        img.style.height = Math.max(48, r.height)+'px';
        img.style.display = 'block';
        dst.parentNode.replaceChild(img, dst);
      }catch(e){}
    });

    root.querySelectorAll('input,select,textarea').forEach(inp=>{
      const type = (inp.type||'').toLowerCase();
      if(type==='hidden' || type==='file' || type==='checkbox' || type==='radio' || type==='button' || type==='submit') return;
      const st = inp.getAttribute('style')||'';
      if(/display\s*:\s*none/i.test(st)) return;
      const span = clonedDoc.createElement('span');
      span.className = 'pdf-val';
      if(inp.classList.contains('inv-tagline')) span.classList.add('inv-tagline');
      if(inp.classList.contains('inv-company')) span.classList.add('inv-company');
      span.textContent = pdfValOf(inp);
      const wrap = inp.parentElement;
      if(wrap && (wrap.classList.contains('datefield') || wrap.classList.contains('timefield'))){
        wrap.classList.add('pdf-flat');
        wrap.innerHTML = '';
        wrap.appendChild(span);
      } else {
        inp.parentNode.replaceChild(span, inp);
      }
    });
  }
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 2000);
  }
  function exportPdf(el, filename){
    if(!el || pdfBusy) return Promise.resolve();
    filename = filename || ('export_'+stamp()+'.pdf');
    if(typeof html2pdf === 'undefined'){
      console.error('html2pdf is not loaded');
      return Promise.resolve();
    }
    pdfBusy = true;
    const opt = {
      margin: 10,
      filename: filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        onclone: function(clonedDoc){ preparePdfClone(clonedDoc, el); }
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.sig-pad', 'canvas', '.box'] }
    };
    return html2pdf().set(opt).from(el).outputPdf('blob').then(function(blob){
      const file = new File([blob], filename, { type: 'application/pdf' });
      const tryShare = typeof navigator.canShare === 'function' && (function(){
        try{ return navigator.canShare({ files: [file] }); }catch(e){ return false; }
      })();
      if(tryShare){
        return navigator.share({ files: [file], title: filename }).catch(function(err){
          if(err && err.name === 'AbortError') return;
          downloadBlob(blob, filename);
        });
      }
      downloadBlob(blob, filename);
    }).catch(function(err){
      console.error('PDF export failed', err);
    }).then(function(){ pdfBusy = false; }, function(){ pdfBusy = false; });
  }


  // --- one employee sheet ---
  function csvSheet(s){
    const rows = [];
    rows.push([t('employee'), s.mitarbeiter]);
    rows.push([t('siteFilter'), s.bereich]);
    rows.push([t('poPrefix'), s.po]);
    rows.push([t('colProject'), s.projektNr]);
    rows.push([t('company'), s.kFirma]);
    rows.push([]);
    rows.push([t('colDate'),t('colFrom'),t('colTo'),t('colBreak'),t('colHours'),
               t('rateLabel'),t('colSumMoneyUnit'),
               t('colProject'),t('colMachine'),t('colAssembly').replace('\n',' '),t('colActivities')]);
    let h=0;
    (s.rows||[]).forEach(r=>{
      if(!r.date && !r.von && !r.bis && !r.taet) return;
      const hh = rowHours(r);
      h += hh;
      rows.push([r.date, r.von, r.bis, csvNum(num(r.pause)), hh ? csvNum(hh) : '',
                 csvMoney(parseMoney(r.rate)), csvMoney(rowMoney(r)),
                 r.ta, r.masch, r.bau, r.taet]);
    });
    rows.push([]);
    rows.push([t('colHours'), csvNum(h)]);
    rows.push([t('colSumMoneyUnit'), csvMoney(sheetMoney(s))]);
    rows.push([t('travelTotal'), csvNum(num(s.fahrt))]);
    rows.push([t('kmTotal'), csvNum(num(s.km))]);
    rows.push([t('flatTotal'), csvNum(num(s.pausch))]);
    return csvRows(rows);
  }

  // --- the all-time table, exactly as filtered on screen ---
  function csvOverview(entries, fromStr, toStr, scopeLabel){
    const rows = [];
    rows.push([t('allTitle'), scopeLabel]);
    rows.push([]);
    rows.push([t('colDate'), t('colWeek'), t('colEmployee'), t('siteFilter'), t('poPrefix'),
               t('colHours'), t('colSumMoneyUnit'), t('travelTotal'), t('kmTotal'), t('flatTotal')]);
    const sel = entries.filter(e=> (!fromStr || e.date>=fromStr) && (!toStr || e.date<=toStr));
    sel.sort((a,b)=> a.date.localeCompare(b.date) || a.name.localeCompare(b.name, locale()));
    let h=0, fa=0, km=0, pa=0, mo=null;
    sel.forEach(e=>{
      const w = isoWeek(e.date);
      h+=e.hours; fa+=e.fahrt; km+=e.km; pa+=e.pausch; mo=addMoney(mo, e.money);
      rows.push([e.date, w ? t('colWeek')+' '+pad(w.week)+'/'+w.year : '', e.name, e.bereich, e.po,
                 csvNum(e.hours), csvMoney(e.money), csvNum(e.fahrt), csvNum(e.km), csvNum(e.pausch)]);
    });
    rows.push([]);
    rows.push([t('rowTotal'),'','','','', csvNum(h), csvMoney(mo), csvNum(fa), csvNum(km), csvNum(pa)]);
    return csvRows(rows);
  }

  // --- the period statement, grouped the same way it is shown ---
  function csvStatement(weeks, wKeys){
    const rows = [];
    rows.push([t('repHeading'), dmy(repFrom)+' – '+dmy(repTo)]);
    rows.push([]);
    rows.push([t('colWeek'), t('siteFilter'), t('poPrefix'), t('colEmployee'),
               t('colHours'), t('colSumMoneyUnit'), t('travelTotal'), t('kmTotal'), t('flatTotal')]);
    let H=0,FA=0,KM=0,PA=0,MO=null;
    wKeys.forEach(k=>{
      const W = weeks[k];
      Object.keys(W.groups).sort().forEach(gk=>{
        const G = W.groups[gk];
        Object.keys(G.workers).sort((a,b)=>a.localeCompare(b, locale())).forEach(n=>{
          const w = G.workers[n];
          rows.push([W.label, G.bereich, G.po, n,
                     csvNum(w.hours), csvMoney(w.money), csvNum(w.fahrt), csvNum(w.km), csvNum(w.pausch)]);
        });
        rows.push([W.label, G.bereich, G.po, t('subtotal'),
                   csvNum(G.hours), csvMoney(G.money), csvNum(G.fahrt), csvNum(G.km), csvNum(G.pausch)]);
      });
      rows.push([W.label, '', '', t('weekTotal'),
                 csvNum(W.hours), csvMoney(W.money), csvNum(W.fahrt), csvNum(W.km), csvNum(W.pausch)]);
      H+=W.hours; FA+=W.fahrt; KM+=W.km; PA+=W.pausch; MO=addMoney(MO, W.money);
    });
    rows.push([]);
    rows.push([t('sumWord'),'','','', csvNum(H), csvMoney(MO), csvNum(FA), csvNum(KM), csvNum(PA)]);
    return csvRows(rows);
  }

  function makeBackup(){
    return JSON.stringify({
      format:'zeiterfassung-backup', version:1,
      exported: new Date().toISOString(),
      lang: lang, active: data.active,
      projects: data.projects, seller: data.seller, signatures: sigs,
      roster: data.roster, staffArchive: data.staffArchive, partners: data.partners
    }, null, 1);

  function applyBackup(text){
    const b = JSON.parse(text);
    if(!b || b.format !== 'zeiterfassung-backup' || !Array.isArray(b.projects))
      throw new Error('bad backup');
    data.projects = b.projects;
    data.active = b.active && b.projects.some(p=>p.id===b.active) ? b.active : b.projects[0].id;
    sigs = (b.signatures && typeof b.signatures === 'object') ? b.signatures : {};
    if(b.lang && I18N[b.lang]) lang = b.lang;
    if(b.seller && typeof b.seller === 'object') data.seller = b.seller;
    data.roster = Array.isArray(b.roster) ? b.roster : [];
    data.staffArchive = Array.isArray(b.staffArchive) ? b.staffArchive : [];
    data.partners = Array.isArray(b.partners) ? b.partners : [];
    ensureRoster();
    ensurePartners();
    seedRosterFromProjects();
    (data.roster||[]).forEach(r=>{ r.status = normalizeStatus(r.status); });
    save(); saveSigs();
  }

  // a row is flagged when the entry is internally inconsistent
  function rowProblem(r){
    const hasTime = r.von && r.bis;
    if(hasTime && !r.date) return 'nodate';
    if(hasTime){
      const [vh,vm]=r.von.split(':').map(Number), [bh,bm]=r.bis.split(':').map(Number);
      let span=(bh*60+bm)-(vh*60+vm); if(span<0) span+=1440;
      const pause=(parseFloat(String(r.pause||'0').replace(',','.'))||0)*60;
      if(pause > span) return 'pause';
    }
    return '';
  }

  function setupSigPad(canvasId, sheetId, prop){
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, rect.width*ratio);
    canvas.height = Math.max(1, rect.height*ratio);
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a1a5c';

    const box = sigOf(sheetId);
    if(box[prop]){
      const img = new Image();
      img.onload = ()=>ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = box[prop];
    }

    let drawing = false, last = null;
    const pos = e => {
      const r = canvas.getBoundingClientRect();
      return { x:e.clientX-r.left, y:e.clientY-r.top };
    };
    canvas.addEventListener('pointerdown', e=>{
      drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e=>{
      if(!drawing) return;
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
      canvas.addEventListener(ev, ()=>{
        if(!drawing) return;
        drawing = false;
        try{ sigOf(sheetId)[prop] = canvas.toDataURL('image/png'); saveSigs(); }catch(err){}
      });
    });
  }

      const i = parseInt(el.dataset.r,10);

      const field = el.dataset.f;
      row[field] = el.value;
      if(field === 'sum'){
        // a hand-typed Summe wins until the rate on this row changes again
        row.sumAuto = false;
      } else {
        if(field === 'rate') row.sumAuto = true;
        autoSum(row);
        const sumEl = document.querySelector('[data-r="'+i+'"][data-f="sum"]');
        const shown = moneyInput(row.sum);
        if(sumEl && sumEl.value !== shown) sumEl.value = shown;
      }
      const cell = document.querySelector('[data-std="'+i+'"]');
      if(cell) cell.textContent = fmt(rowHours(row));
      refreshPay(s);
      const tr = document.querySelector('[data-row="'+i+'"]');
      if(tr) tr.classList.toggle('row-bad', !!rowProblem(s.rows[i]));
      refreshWarnings(s);
      save();
    });

    document.getElementById('btnBack').addEventListener('click', ()=>{ editingId=null; renderInput(); });
    document.getElementById('btnAddRow').addEventListener('click', ()=>{
      s.rows.push(blankRow());
      save(); renderInput();
    });
    document.getElementById('btnPdf').addEventListener('click', ()=>{
      exportPdf(document.getElementById('printDoc'), safeName(s.mitarbeiter||'sheet')+'_'+stamp()+'.pdf');
    });
    document.getElementById('btnSheetCsv').addEventListener('click', ()=>{
      download(safeName(s.mitarbeiter||'sheet')+'_'+stamp()+'.csv', csvSheet(s));
    });
    localizeDateInputs(host);
    localizeTimeInputs(host);
  }

  /* ================= aggregation ================= */
  const normName = n => (n||'').trim().replace(/\s+/g,' ');

  function allEntries(){
    const out = [];
    P().sheets.forEach(s=>{
      const name = normName(s.mitarbeiter) || t('unnamedWarn');
      const site = (s.bereich||'').trim() || '—', po = (s.po||'').trim() || '—';

      let first = null;
      (s.rows||[]).forEach(r=>{
        // hours are always (bis - von) - Pause and nothing else
        const h = rowHours(r), m = rowMoney(r);
        if(!r.date || (h<=0 && m===null)) return;
        const e = { name, bereich:site, po:po, date:r.date, hours:h,
                    money:rowMoney(r), fahrt:0, km:0, pausch:0 };
        if(!first || r.date < first.date) first = e;
        out.push(e);
      });
      // travel, distance and flat rate belong to the sheet, not to a single day;
      // they ride along with the sheet's earliest dated entry and stay out of `hours`
      if(first){ first.fahrt = num(s.fahrt); first.km = num(s.km); first.pausch = num(s.pausch); }
    });
    return out;
  }
  function addMoney(acc, m){ return m === null ? acc : (acc === null ? m : acc + m); }

  function workerNames(entries){
    return Array.from(new Set(entries.map(e=>e.name))).sort((a,b)=>a.localeCompare(b, locale()));
  }

    let tableHtml = '', summary = '';

      const rows = names.map(n=>({name:n, cells:new Array(12).fill(0), total:0, money:null}));

  function buildMatrix(entries, dateCols){
    const names = workerNames(entries);
    const idx = {}; names.forEach((n,i)=>idx[n]=i);
    const colIdx = {}; dateCols.forEach((d,i)=>colIdx[d]=i);
    const rows = names.map(n=>({name:n, cells:new Array(dateCols.length).fill(0), total:0, money:null}));
    entries.forEach(e=>{
      const ci = colIdx[e.date];
      if(ci===undefined) return;
      const r = rows[idx[e.name]];
      r.cells[ci] += e.hours; r.total += e.hours;
      r.money = addMoney(r.money, e.money);
    });
    const kept = rows.filter(r=>r.total>0);
    const colTotals = new Array(dateCols.length).fill(0);
    let grand = 0, grandMoney = null;
    kept.forEach(r=>{ r.cells.forEach((v,i)=>colTotals[i]+=v); grand += r.total;
                      grandMoney = addMoney(grandMoney, r.money); });
    return { rows:kept, colTotals, grand, grandMoney };
  }

  function matrixTable(cols, res){
    if(!res.rows.length) return emptyBox(t('noDataPeriod'), '');
    let h = '<div class="table-wrap"><table><thead><tr><th class="name-cell">'+esc(t('colEmployee'))+'</th>';
    cols.forEach(c=>{ h += '<th'+(c.weekend?' class="weekend"':'')+'>'+esc(c.label)+'</th>'; });
    h += '<th class="total-cell">'+esc(t('colHours'))+'</th>'+
         '<th class="total-cell money-cell">'+esc(t('colSumMoneyUnit'))+'</th></tr></thead><tbody>';
    res.rows.forEach(r=>{
      h += '<tr><td class="name-cell">'+esc(r.name)+'</td>';
      r.cells.forEach((v,i)=>{ h += '<td'+(cols[i].weekend?' class="weekend"':'')+'>'+fmt(v)+'</td>'; });
      h += '<td class="total-cell">'+fmt0(r.total)+'</td>'+
           '<td class="total-cell money-cell">'+esc(fmtMoney(r.money))+'</td></tr>';
    });
    h += '<tr class="sum-row"><td class="name-cell">'+esc(t('rowTotal'))+'</td>';
    res.colTotals.forEach((v,i)=>{ h += '<td'+(cols[i].weekend?' class="weekend"':'')+'>'+fmt(v)+'</td>'; });
    h += '<td class="total-cell">'+fmt0(res.grand)+'</td>'+
         '<td class="total-cell money-cell">'+esc(fmtMoney(res.grandMoney))+'</td></tr></tbody></table></div>';
    return h;
  }

  /* ================================================================
     VIEW 4 — warehouse (parts registry), own storage key
     ================================================================ */
  const KEY_LAGER = 'timetracking-lager-parts';
  let lagerParts = null;        // [{num, loc, name}]
  let lagerQuery = '';
  function lagerLoad(){
    if(lagerParts) return lagerParts;
    try{ const v = storage.get(KEY_LAGER).value; lagerParts = v ? JSON.parse(v) : []; }
    catch(e){ lagerParts = []; }
    if(!Array.isArray(lagerParts)) lagerParts = [];
    return lagerParts;
  }
  function lagerStore(){ try{ storage.set(KEY_LAGER, JSON.stringify(lagerParts)); }catch(e){} }
  const lagerNorm = s => String(s||'').trim().toLowerCase();
  function lagerMatches(q){
    q = lagerNorm(q); if(!q) return [];
    const exact = lagerParts.filter(p=>lagerNorm(p.num)===q);
    if(exact.length) return exact;
    return lagerParts.filter(p=>lagerNorm(p.num).startsWith(q))
      .sort((a,b)=>String(a.num).localeCompare(String(b.num),undefined,{numeric:true}));
  }
  function lagerResultHtml(){
    if(!lagerNorm(lagerQuery)) return '';
    const m = lagerMatches(lagerQuery);
    if(!m.length) return '<div class="empty"><div class="empty-title">'+esc(t('lagerNotFound'))+'</div></div>';
    return '<table class="kv lager-res">'+m.map(p=>
      '<tr><th>'+esc(t('lagerNum'))+'</th><td><b>'+esc(p.num)+'</b></td></tr>'+
      '<tr><th>'+esc(t('lagerLoc'))+'</th><td>'+esc(p.loc)+'</td></tr>'+
      '<tr><th>'+esc(t('lagerName'))+'</th><td>'+esc(p.name)+'</td></tr>'
    ).join('<tr><td colspan="2"><hr style="border:none;border-top:1px solid var(--line,#ccc);margin:2px 0;"></td></tr>')+'</table>';
  }
  function renderLager(){
    const host = document.getElementById('viewLager');
    lagerLoad();
    const list = lagerParts.slice().sort((a,b)=>String(a.num).localeCompare(String(b.num),undefined,{numeric:true}));
    host.innerHTML = viewHead('ebLager','lagerTitle')+
      '<p class="view-sub">'+esc(t('lagerSub'))+'</p>'+
      '<div class="flab" style="margin:10px 0 4px;">'+esc(t('lagerAdd'))+'</div>'+
      '<div class="toolbar no-print">'+
        '<span class="fpair" style="flex:1 1 140px;"><span class="flab">'+esc(t('lagerNum'))+'</span><input type="text" id="lgNum" autocomplete="off"></span>'+
        '<span class="fpair" style="flex:1 1 140px;"><span class="flab">'+esc(t('lagerLoc'))+'</span><input type="text" id="lgLoc" autocomplete="off"></span>'+
        '<span class="fpair" style="flex:2 1 200px;"><span class="flab">'+esc(t('lagerName'))+'</span><input type="text" id="lgName" autocomplete="off"></span>'+
        '<button class="btn primary" id="lgSave" style="align-self:flex-end;">'+esc(t('lagerSave'))+'</button>'+
      '</div>'+
      '<div id="lgMsg" class="view-sub" style="min-height:1.2em;"></div>'+
      '<div class="toolbar no-print">'+
        '<span class="fpair" style="flex:1 1 240px;"><span class="flab">'+esc(t('lagerFind'))+'</span><input type="text" id="lgFind" autocomplete="off" placeholder="'+esc(t('lagerFindPh'))+'" value="'+esc(lagerQuery)+'"></span>'+
      '</div>'+
      '<div id="lgResult">'+lagerResultHtml()+'</div>'+
      '<div class="toolbar no-print" style="margin-top:14px;align-items:center;">'+
        '<span class="flab" style="margin:0;">'+esc(t('lagerAll'))+' ('+list.length+')</span>'+
        '<span class="spacer"></span>'+
        '<button class="btn ghost" id="lgImport">'+esc(t('lagerImport'))+'</button>'+
        '<button class="btn ghost" id="lgExport">'+esc(t('lagerExport'))+'</button>'+
        '<input type="file" id="lgFile" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel,text/plain" style="display:none;">'+
      '</div>'+
      (list.length ?
        '<table class="az lager-list"><thead><tr><th>'+esc(t('lagerNum'))+'</th><th>'+esc(t('lagerLoc'))+'</th><th>'+esc(t('lagerName'))+'</th><th class="no-print"></th></tr></thead><tbody>'+
        list.map(p=>'<tr><td><b>'+esc(p.num)+'</b></td><td>'+esc(p.loc)+'</td><td>'+esc(p.name)+'</td>'+
          '<td class="no-print" style="width:1%;white-space:nowrap;"><button class="btn ghost" data-lgdel="'+esc(p.num)+'">'+esc(t('lagerDel'))+'</button></td></tr>').join('')+
        '</tbody></table>'
        : emptyBox(t('lagerEmpty'),''));
    wireLager(host); wireHeadTools(host);
  }
  function wireLager(host){
    const num = host.querySelector('#lgNum'), loc = host.querySelector('#lgLoc'), nm = host.querySelector('#lgName');
    const msg = host.querySelector('#lgMsg');
    function doSave(){
      const n = num.value.trim();
      if(!n){ msg.textContent = t('lagerNeedNum'); num.focus(); return; }
      const ex = lagerParts.find(p=>lagerNorm(p.num)===lagerNorm(n));
      if(ex){ ex.num = n; ex.loc = loc.value.trim(); ex.name = nm.value.trim(); }
      else lagerParts.push({ num:n, loc:loc.value.trim(), name:nm.value.trim() });
      lagerStore();
      renderLager();
      const m = document.getElementById('lgMsg'); if(m) m.textContent = t(ex ? 'lagerUpdated' : 'lagerSaved')+': '+n;
      const f = document.getElementById('lgNum'); if(f) f.focus();
    }
    host.querySelector('#lgSave').addEventListener('click', doSave);
    [num,loc,nm].forEach(i=>i.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doSave(); } }));
    num.addEventListener('input', ()=>{          // prefill when editing an existing part
      const ex = lagerParts.find(p=>lagerNorm(p.num)===lagerNorm(num.value));
      if(ex){ loc.value = ex.loc; nm.value = ex.name; }
    });
    const find = host.querySelector('#lgFind');
    find.addEventListener('input', ()=>{
      lagerQuery = find.value;
      host.querySelector('#lgResult').innerHTML = lagerResultHtml();
    });
    host.querySelectorAll('[data-lgdel]').forEach(b=>b.addEventListener('click', ()=>{
      const n = b.dataset.lgdel;
      if(!confirm(t('lagerDelConfirm')+'\n'+n)) return;
      lagerParts = lagerParts.filter(p=>p.num!==n);
      lagerStore(); renderLager();
    }));
    host.querySelector('#lgExport').addEventListener('click', ()=>{
      if(!lagerParts.length){ msg.textContent = t('lagerExpEmpty'); return; }
      lagerExport();
    });
    const file = host.querySelector('#lgFile');
    host.querySelector('#lgImport').addEventListener('click', ()=>{ file.value = ''; file.click(); });
    file.addEventListener('change', ()=>{
      const f = file.files && file.files[0];
      file.value = '';                                   // allow re-selecting the same file
      if(f) lagerImportFile(f);
    });
  }

  /* ---- Lager CSV export / import (Excel-friendly: UTF-8 BOM, ';') ---- */
  const tpl = (s, o) => String(s).replace(/\{(\w+)\}/g, (m,k)=> o[k]!==undefined ? o[k] : m);
  function lagerCsvCell(v){
    v = v==null ? '' : String(v);
    return /[";,\t\r\n]|^\s|\s$/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }
  function lagerCsvText(){
    const list = lagerParts.slice().sort((a,b)=>String(a.num).localeCompare(String(b.num),undefined,{numeric:true}));
    const rows = [[t('lagerNum'), t('lagerLoc'), t('lagerName')]].concat(list.map(p=>[p.num, p.loc, p.name]));
    return rows.map(r=>r.map(lagerCsvCell).join(';')).join('\r\n')+'\r\n';
  }
  function lagerExport(){
    const filename = 'lager-'+todayIso()+'.csv';
    const blob = new Blob(['\uFEFF'+lagerCsvText()], {type:'text/csv;charset=utf-8'});
    // iOS home-screen PWAs can't save blob downloads -> use the share sheet there
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true;
    let file = null;
    try{ file = new File([blob], filename, {type:'text/csv'}); }catch(e){}
    const canShare = !!file && typeof navigator.canShare==='function' &&
      (()=>{ try{ return navigator.canShare({files:[file]}); }catch(e){ return false; } })();
    if(ios && standalone && canShare){
      navigator.share({files:[file], title:filename}).catch(err=>{
        if(err && err.name==='AbortError') return;
        downloadBlob(blob, filename);
      });
      return;
    }
    try{ downloadBlob(blob, filename); }
    catch(e){ if(canShare) navigator.share({files:[file], title:filename}).catch(()=>{}); }
  }
  function lagerDecode(buf){
    const bytes = new Uint8Array(buf);
    try{ return new TextDecoder('utf-8', {fatal:true}).decode(bytes); }
    catch(e){
      // legacy Excel "CSV (delimited)" saves in the ANSI code page
      const enc = lang==='ru' ? 'windows-1251' : 'windows-1252';
      try{ return new TextDecoder(enc).decode(bytes); }catch(e2){ return new TextDecoder('utf-8').decode(bytes); }
    }
  }
  function lagerParseCsv(text){
    text = String(text).replace(/^\uFEFF/, '');
    let delim = null;
    const sepLine = text.match(/^sep=(.)\r?\n/i);       // Excel hint line
    if(sepLine){ delim = sepLine[1]; text = text.slice(sepLine[0].length); }
    if(!delim){
      const cnt = {';':0, ',':0, '\t':0}; let q = false;
      for(let i=0;i<text.length;i++){
        const c = text[i];
        if(c==='"') q = !q;
        else if(!q && (c==='\n' || c==='\r')) break;
        else if(!q && cnt[c]!==undefined) cnt[c]++;
      }
      delim = cnt[';']>=cnt[','] && cnt[';']>=cnt['\t'] ? ';' : (cnt['\t']>cnt[','] ? '\t' : ',');
      if(!cnt[';'] && !cnt[','] && !cnt['\t']) delim = ';';
    }
    const rows = []; let row = [], cell = '', q = false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){ cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if(c==='"' && cell==='') q = true;           // quotes only open a field at its start
      else if(c===delim){ row.push(cell); cell = ''; }
      else if(c==='\r' || c==='\n'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=>r.some(c=>String(c).trim()!==''));
  }
  function lagerIsHeader(r){
    const n = lagerNorm(r[0]);
    return Object.keys(I18N).some(k=>I18N[k].lagerNum && lagerNorm(I18N[k].lagerNum)===n) ||
      /^(part ?(no|number|#)|teile?-?nr\.?|artikel(nummer)?|номер|référence|reference|número|numero|pn)$/i.test(String(r[0]).trim());
  }
  function lagerPlanImport(rows){
    if(rows.length && lagerIsHeader(rows[0])) rows = rows.slice(1);
    const plan = {add:[], upd:[], skip:0, total:rows.length};
    const byKey = {}, order = [];                         // later rows in the same file win
    rows.forEach(r=>{
      const num = String(r[0]||'').trim(), loc = String(r[1]||'').trim(), name = String(r[2]||'').trim();
      if(!num){ plan.skip++; return; }
      const k = lagerNorm(num);
      if(byKey[k]) plan.skip++; else order.push(k);
      byKey[k] = {num, loc, name};
    });
    order.forEach(k=>{
      const it = byKey[k], ex = lagerParts.find(p=>lagerNorm(p.num)===k);
      if(!ex) plan.add.push(it);
      else if(ex.num===it.num && ex.loc===it.loc && ex.name===it.name) plan.skip++;
      else plan.upd.push(it);
    });
    return plan;
  }
  function lagerImportFile(f){
    const say = s => { const m = document.getElementById('lgMsg'); if(m) m.textContent = s; };
    const rd = new FileReader();
    rd.onerror = () => say(t('lagerImpErr'));
    rd.onload = () => {
      let plan;
      try{ plan = lagerPlanImport(lagerParseCsv(lagerDecode(rd.result))); }
      catch(e){ console.error(e); say(t('lagerImpErr')); return; }
      if(!plan.add.length && !plan.upd.length && !plan.total){ say(t('lagerImpNone')); return; }
      const o = {f:f.name, a:plan.add.length, u:plan.upd.length, s:plan.skip};
      if(!confirm(tpl(t('lagerImpConfirm'), o))){ say(t('lagerImpCancel')); return; }
      plan.upd.forEach(it=>{
        const ex = lagerParts.find(p=>lagerNorm(p.num)===lagerNorm(it.num));
        if(ex){ ex.num = it.num; ex.loc = it.loc; ex.name = it.name; }
      });
      plan.add.forEach(it=>lagerParts.push({num:it.num, loc:it.loc, name:it.name}));
      lagerStore(); renderLager();
      say(tpl(t('lagerImpDone'), o));
    };
    rd.readAsArrayBuffer(f);
  }

  function addDaysIso(iso, days){

  function prefillInvoice(){
    const inv = blankInvoice();
    const sheets = P().sheets || [];
    const withFirma = sheets.find(s => String(s.kFirma||'').trim()) || sheets[0];
    if(withFirma){
      inv.buyerAddr = [withFirma.kFirma, withFirma.kAnsprechTA, withFirma.kAbteilung, withFirma.kPlzOrt]
        .map(x => String(x||'').trim()).filter(Boolean).join('\n');
      inv.kdnr = String(withFirma.po||'').trim();
    }
    const dates = [];
    sheets.forEach(s => (s.rows||[]).forEach(r => { if(r.date) dates.push(r.date); }));
    dates.sort();
    if(dates.length){ inv.lvon = dates[0]; inv.lbis = dates[dates.length-1]; }
    inv.rdatum = todayIso();
    inv.rnr = String(new Date().getFullYear())+'/01';
    inv.faelligkeitsdatum = addDaysIso(inv.rdatum, inv.zahlungstage);

    let hours = 0, money = null, rates = [];
    sheets.forEach(s => {
      hours += sheetHours(s);
      money = addMoney(money, sheetMoney(s));
      (s.rows||[]).forEach(r => {
        const rate = parseMoney(r.rate);
        if(rate !== null && rowHours(r) > 0) rates.push(rate);
      });
    });
    let rate = null;
    if(rates.length){
      const uniq = Array.from(new Set(rates.map(x => Math.round(x*100))));
      if(uniq.length === 1) rate = uniq[0]/100;
      else if(hours > 0 && money !== null) rate = money / hours;
    } else if(hours > 0 && money !== null){
      rate = money / hours;
    }
    let desc = 'Montage- / Arbeitsleistungen';
    if(inv.lvon && inv.lbis) desc += ' ('+dmy(inv.lvon)+' \u2013 '+dmy(inv.lbis)+')';
    const pn = String(P().name||'').trim();
    if(pn && !/^\d+$/.test(pn)) desc += ' \u2013 ' + pn;
    inv.items = [{
      desc: desc,
      menge: hours ? String(Math.round(hours*100)/100) : '',
      einheit: hours ? 'Std.' : '',
      preis: rate !== null ? String(Math.round(rate*100)/100) : ''
    }, blankInvItem(), blankInvItem()];

    const seller = ensureSeller();
    if(!String(seller.company||'').trim()){
      const hdr = sheets.find(s => String(s.firmaHeader||'').trim());
      if(hdr) seller.company = String(hdr.firmaHeader).trim();
    }
    return inv;
  }

  function invRecalc(){
    const stored = P().invoice || {};
    let netto = 0;
    const rows = document.querySelectorAll('#invItems .inv-item');
    if(rows.length){
      rows.forEach(row => {
        const menge = parseFloat((row.querySelector('.f-menge')||{}).value) || 0;
        const preis = parseFloat((row.querySelector('.f-preis')||{}).value) || 0;
        const summe = menge * preis;
        const cell = row.querySelector('.inv-summe');
        if(cell) cell.textContent = formatInvEUR(summe);
        netto += summe;
      });
    } else {
      (stored.items||[]).forEach(it => {
        netto += (parseFloat(it.menge)||0) * (parseFloat(it.preis)||0);
      });
    }
    const rabattEl = document.getElementById('invRabatt');
    const rabatt = parseFloat(rabattEl ? rabattEl.value : (stored.rabatt||'')) || 0;
    const basis = Math.max(netto - rabatt, 0);
    const kuEl = document.getElementById('invModeKU');
    const isKU = kuEl ? !!kuEl.checked : (stored.taxmode === 'ku');
    const ustFeld = document.getElementById('invUstProzent');
    if(ustFeld) ustFeld.disabled = isKU;
    const ustProzent = isKU ? 0 : (parseFloat(ustFeld ? ustFeld.value : (stored.ustProzent||'')) || 0);
    const ustBetrag = isKU ? 0 : basis * ustProzent / 100;
    const gesamt = basis + ustBetrag;
    const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };

  function coStatsData(){
    ensureRoster(); ensurePartners(); ensureSeller();

    (data.projects||[]).forEach(pr => (pr.sheets||[]).forEach(s => { sheets++; hours += sheetHours(s); }));
    return {
      staff: (data.roster||[]).length,
      sheets: sheets,

  function coReportData(){
    const sheets = P().sheets || [];
    if(!sheets.length) return null;
    const dates = [];
    let hours = 0, money = null;
    const names = [];
    sheets.forEach(s => {
      hours += sheetHours(s);
      money = addMoney(money, sheetMoney(s));
      const n = String(s.mitarbeiter||'').trim();
      if(n) names.push(n);
      (s.rows||[]).forEach(r => { if(r.date) dates.push(r.date); });
    });
    dates.sort();
    return {
      from: dates[0] || '',
      to: dates[dates.length-1] || '',
      hours: hours,
      money: money,
      names: Array.from(new Set(names)),
      sheets: sheets.length
    };
  }

  function renderCompany(){
    const host = invoiceHost();
    ensureSeller();
    ensurePartners();
    const inner = coUi.page !== 'root';
    host.innerHTML =
      viewHead('journal','coMenu')+
      '<div class="toolbar no-print">'+
        '<button class="btn ghost" id="coBack" type="button">'+esc('\u2039 '+t('journal'))+'</button>'+
        (inner
          ? '<button class="btn ghost" type="button" data-coact="root">'+esc('\u2039 '+t('coMenu'))+'</button>'
          : '')+
      '</div>'+
      '<div id="coApp">'+coInnerHtml()+'</div>';

    wireHeadTools(host);
    const back = document.getElementById('coBack');
    if(back) back.addEventListener('click', ()=>{ hubItem = ''; coUi.page = 'root'; coUi.partnerId = null; renderAll(); });

    const goRoot = ()=>{ coUi.page = 'root'; coUi.partnerId = null; renderCompany(); };

    host.querySelectorAll('[data-cosection]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const n = b.dataset.cosection;
        coUi.partnerId = null;
        coUi.page = n==='01' ? 'details' : n==='02' ? 'stats' : n==='03' ? 'report' : 'partners';
        renderCompany();
      });
    });
    host.querySelectorAll('[data-coact="root"]').forEach(b=>{
      b.addEventListener('click', goRoot);
    });

    host.querySelectorAll('[data-seller]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const seller = ensureSeller();
        seller[el.dataset.seller] = el.value;
        save();
        coFlashSaved();
      });
    });

    host.querySelectorAll('[data-partner]').forEach(el=>{
      el.addEventListener('input', ()=>{
        if(!coUi.partnerId || coUi.partnerId === 'new') return;
        const p = ensurePartners().find(x=>x.id===coUi.partnerId);
        if(!p) return;
        p[el.dataset.partner] = el.value;
        save();
        coFlashSaved();
      });
    });

    host.querySelectorAll('[data-coact]').forEach(b=>{
      const act = b.dataset.coact;
      if(act==='root') return;
      b.addEventListener('click', ()=>{
        if(act==='partner-add'){
          coUi.partnerId = 'new';
          renderCompany();
          return;
        }
        if(act==='partner-edit'){
          coUi.partnerId = b.dataset.pid || coUi.partnerId;
          renderCompany();
          return;
        }
        if(act==='partner-cancel'){
          coUi.partnerId = null;
          renderCompany();
          return;
        }
        if(act==='partner-save'){
          const p = blankPartner();
          p.id = partnerUid();
          partnerFieldDefs().forEach(f=>{
            const el = document.getElementById('coP_'+f.key);
            p[f.key] = el ? el.value : '';
          });
          ensurePartners().push(p);
          save();
          coUi.partnerId = null;
          renderCompany();
          return;
        }
        if(act==='partner-del'){
          const id = b.dataset.pid || coUi.partnerId;
          if(!id || id==='new') return;
          data.partners = ensurePartners().filter(x=>x.id!==id);
          save();
          coUi.partnerId = null;
          renderCompany();
        }
      });
    });
  }
